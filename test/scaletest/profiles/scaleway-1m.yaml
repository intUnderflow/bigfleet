# scaleway-1m — 1,000,000-machine fleet test on Scaleway, two shards.
#
# Aggregate-named: 2 shards × 500K seeded inventory each = 1M total
# under management. The paper pegs the per-shard ceiling at 500K
# (Phase 3 walks the inventory each cycle); scaling beyond that is
# what shards are for. This profile is the smallest legitimate
# multi-shard validation — single-shard at the per-shard ceiling
# would be scaleway-500k.yaml.
#
# Sized for the same 2-node PRO2-M Kapsule pool as scaleway-500k.
# Per-shard CPU and memory work is roughly halved vs single-shard
# 500K (each shard sees ~25K demand against 500K inventory) so this
# isn't a per-shard scale stress; it's the wiring + per-shard SLO
# contract validation that gates anything bigger.
#
# Provisioning:
#
#   scw k8s cluster create name=bigfleet-1m \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-M \
#     pools.0.size=2 pools.0.min-size=2 pools.0.max-size=2 \
#     region=fr-par project-id=<bigfleet-project-id>
#
# Expected cost: 2× PRO2-M × €0.21/hr ≈ €0.42/hr.
# A 30-min run + setup + teardown ≈ 50 min ≈ €0.35 (~$0.38).

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  clusterCount: 50
  apiserverResources:
    requests: { cpu: 150m, memory: 500Mi }
    limits:   { cpu: 2,    memory: 3Gi }
  workloadResources:
    requests: { cpu: 150m, memory: 300Mi }
    limits:   { cpu: 1500m, memory: 1Gi }

shard:
  # 2 shards, kwok-cluster pods deterministically split N % 2 across
  # them. Each shard sees ~25K demand (50K total / 2 shards) against
  # 500K seeded inventory.
  replicas: 2
  seedMachines: 500000
  maxActionsPerCycle: 1000
  executeConcurrency: 128
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 2, memory: 3Gi }
    limits:   { cpu: 6, memory: 12Gi }

coordinator:
  enabled: true
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 4, memory: 12Gi }

costEstimate:
  vCPU: 32
  memoryGB: 128
  awsSpotUsdPerHour: 0.42
  notes: "2× Scaleway PRO2-M (16 vCPU / 64 GB each). 2 shards × 500K seeded inventory + 50 KWOK clusters × 1K demand = 1M-machine fleet. ~$0.38 for a 50-min run end-to-end. Smallest legitimate multi-shard validation; the wiring this exercises is the prerequisite for anything bigger (e.g. scaleway-5m)."
