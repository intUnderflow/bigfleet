# scaleway-1m — 1,000,000-machine fleet test, two shards, Pod-mode.
#
# Aggregate-named: 2 shards × 500K under management each = 1M total.
# Demand: 100 kwok clusters × 1K Pods/cluster = 100K Pods through the
# full M43 chain. Inherits Pod-mode + the realistic 6-archetype
# catalog from the chart defaults.
#
# **M29 production-realistic seed shape.** Each shard owns 50 owned
# clusters with seedConfiguredPerCluster=9000 (from realistic
# archetype catalog, weighted) — 450K Configured per shard, 900K
# fleet-wide already-bound workloads. 100K demand at any moment is
# the unsatisfied burst Phase 1 binds from Idle (50K per shard,
# 100K total). 1:10 burst regime against the 1M aggregate (ADR-0013).
#
# Why 1:10 and not 1:1: ADR-0013 codifies BigFleet's cycle-p99 SLO
# at burst density (≤10% pending demand). 1:1 reprovisioning is its
# own regime gated on convergence rate, not cycle p99 — that lived
# in scaleway-{1m,5m}-reprovision before M44 and is reachable by
# scaling demand up if needed (changes the gate semantics, not the
# binary).
#
# Sized for 4× PRO2-L Kapsule (32 vCPU / 128 GiB each):
#   shards:       2 × 2 vCPU / 3 GiB                =  4 vCPU / 6 GiB
#   coordinator:  1 × default                       = ~0.5 vCPU / 1 GiB
#   prometheus:   1 × 2 vCPU / 8 GiB                =  2 vCPU / 8 GiB
#   kwok pods:  100 × 1 vCPU / 2 GiB combined req   = 100 vCPU / 200 GiB
#                  (M44 Pod-mode floor)
#   total:       ~107 vCPU req / ~215 GiB            → fits 4× PRO2-L
#                                                       (128 vCPU / 512 GiB)
#                                                       ~84 % CPU, ~42 % memory reservation
#
# Provisioning:
#
#   scw k8s cluster create name=bigfleet-1m \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=4 pools.0.min-size=4 pools.0.max-size=4 \
#     region=fr-par project-id=<bigfleet-project-id>
#
# Cost: 4× PRO2-L × ~€0.42/hr ≈ €1.68/hr. ~50 min run ≈ €1.40/$1.50.

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  clusterCount: 100

shard:
  replicas: 2
  seedMachines: 50000        # 50K Idle per shard, 100K aggregate
  seedConfiguredPerCluster: 9000   # M29: 450K Configured per shard, 900K aggregate
  maxActionsPerCycle: 1000
  executeConcurrency: 128
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 2, memory: 3Gi }
    limits:   { cpu: 6, memory: 12Gi }

coordinator:
  enabled: true
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s
  coLocationKey: topology.bigfleet/rack

slo:
  bindingLatencyP99Seconds: 5
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 4, memory: 16Gi }

costEstimate:
  vCPU: 128
  memoryGB: 512
  awsSpotUsdPerHour: 1.68
  notes: "4× Scaleway PRO2-L (32 vCPU / 128 GB each). 2 shards × 500K under management (450K Configured + 50K Idle) = 1M aggregate; 100K Pod-mode demand through the full M43 chain. bindingLatency p99 ≤ 5s gated. ~$1.50 for a 50-min run end-to-end."
