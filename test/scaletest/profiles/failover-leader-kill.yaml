# failover-leader-kill — static-stability regression at the realistic shape.
#
# Ported to the BYO profileV2 contract (ADR-0034) so failover is exercised
# against the realistic.yaml catalog + the ADR-0054 gate set, not the legacy
# single-shape demand model. Pair with any substrate:
#
#   scaletest-runner --profile=test/scaletest/profiles/failover-leader-kill.yaml \
#                    --substrate=<substrate>.yaml --output=...
#
# The V2 render enables a single-replica coordinator (coordinator.enabled,
# replicas:1). At t=600s into the soak the runner deletes the coordinator's
# leader pod; the runnerAction asserts bigfleet_coordinator_raft_term advances
# by >=1 within the query window (a restart-recovery + re-election landed) AND
# that the data plane (shard + operators) holds its capacity-delivery SLOs
# throughout — i.e. clusters keep running while BigFleet's coordinator restarts.
# This is the "static stability is non-negotiable" hard rule, end to end.

apiVersion: bigfleet.io/scaletest/v1
kind: Profile

metadata:
  name: "failover-leader-kill"
  description: "Static-stability regression: coordinator leader-kill mid-soak at the realistic uber-5k shape."

scale:
  machines: 5000
  density: 100

catalog:
  archetypes: realistic

seed:
  configuredFraction: 1.0
  preBind: true
  speculativeMultiplier: 3
  idleHeadroomFraction: 0.2

loadProfile:
  rampSeconds: 1800
  # 20-min soak: the kill fires 10 min in, leaving 10 min to observe
  # re-election + confirm the data plane held its SLOs after recovery.
  soakSeconds: 1200
  churnPerMinute: 0.02

rampBudget: 60m

# Static-stability action: delete the coordinator's leader pod 10 min into
# the soak. The runner asserts term-advance within the window; the SLO gates
# below assert the data plane held throughout (the actual regression check).
runnerActions:
  - atSeconds: 600
    action: kill-coordinator-leader

slo:
  # ADR-0054 capacity-delivery gates — must hold across the disruption.
  # End-to-end pod-bind p99 is informational (uncapped-scheduler-bound).
  shardCycleDurationP99Seconds: 5
  shardConfigurePhaseP99Seconds: 15
  bootstrapSuccessRatio: 0.99
  operatorNodeStateUpdateP99Seconds: 1.5
  endToEndPodBindP50Seconds: 10
