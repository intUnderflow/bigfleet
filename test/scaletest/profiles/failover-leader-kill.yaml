# failover-leader-kill — M17 static-stability regression check.
#
# 50 KWOK clusters drive steady-state load against a single shard. At
# t=600s into the soak the runner deletes the coordinator's leader pod;
# the runnerAction asserts that bigfleet_coordinator_raft_term advances
# by ≥1 within the 5 min query window (a re-election landed) and that
# the data plane (shards + operators) holds its SLOs throughout.
#
# Validates the "static stability is non-negotiable" hard rule end-to-end:
# clusters keep running while BigFleet's coordinator restarts.

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  clusterCount: 50

shard:
  replicas: 1
  seedMachines: 0
  resources:
    requests: { cpu: 1, memory: 2Gi }

coordinator:
  enabled: true
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 4, memory: 12Gi }

# M17 runnerAction: fire one leader-kill mid-soak. The runner asserts
# the new term is observed in coordinator metrics within 60 s.
runnerActions:
  - { atSeconds: 600, action: kill-coordinator-leader }

costEstimate:
  vCPU: 64
  memoryGB: 256
  awsSpotUsdPerHour: 0.84
  notes: "2× Scaleway PRO2-L (32 vCPU / 128 GB each, M44 Pod-mode floor). Failover-soak with one mid-soak coordinator-leader-kill. ~$0.74 for a 50-min run. M17 regression check for static stability."
