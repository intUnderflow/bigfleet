# failover-partition — static-stability regression for a control-plane partition.
#
# Ported to the BYO profileV2 contract (ADR-0034): the realistic.yaml catalog
# + ADR-0054 gates, on a TWO-shard deploy (topology.shardReplicas: 2). At
# t=600s the runner installs a NetworkPolicy severing bigfleet-shard-1's
# egress to the rest of the cluster (incl. the coordinator); the policy holds
# ~60s and is removed. Validates the load-bearing "static stability is
# non-negotiable" hard rule: the partitioned shard MUST keep running cycles
# (Phase 1-3, execute, reconcile against in-process inventory) for the
# duration of the partition, and re-establish cleanly after heal — observed
# via the rest-of-soak SLO numbers holding.

apiVersion: bigfleet.io/scaletest/v1
kind: Profile

metadata:
  name: "failover-partition"
  description: "Static-stability regression: coordinator↔shard partition on a 2-shard realistic deploy."

scale:
  machines: 5000
  density: 100

catalog:
  archetypes: realistic

seed:
  configuredFraction: 1.0
  preBind: true
  speculativeMultiplier: 3
  idleHeadroomFraction: 0.2

loadProfile:
  rampSeconds: 1800
  soakSeconds: 1200
  churnPerMinute: 0.02

rampBudget: 60m

# Two shards so the partition isolates ordinal 1 while ordinal 0 stays
# connected — the data plane must keep running on both regardless.
topology:
  shardReplicas: 2

runnerActions:
  - atSeconds: 600
    action: partition-coordinator-from-shard-bigfleet-shard-1

slo:
  shardCycleDurationP99Seconds: 5
  shardConfigurePhaseP99Seconds: 15
  bootstrapSuccessRatio: 0.99
  operatorNodeStateUpdateP99Seconds: 1.5
  endToEndPodBindP50Seconds: 10
