# local-50k — M5 Max kind ceiling. 50 simulated clusters × 1K CRs.

kwok:
  clusterCount: 50
  # Two-container split: apiserver+kine and operator+load-driver each
  # get their own cgroup CPU. Pre-split the bundled 2-CPU limit was
  # the contention point; the split lets each side burst independently.
  apiserverResources:
    requests: { cpu: 50m,  memory: 200Mi }
    limits:   { cpu: 1500m, memory: 1Gi }
  workloadResources:
    requests: { cpu: 50m,  memory: 100Mi }
    limits:   { cpu: 500m, memory: 500Mi }

shard:
  replicas: 1
  resources:
    requests: { cpu: 1, memory: 2Gi }
    limits:   { cpu: 4, memory: 8Gi }

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

costEstimate:
  vCPU: 100
  memoryGB: 75
  awsSpotUsdPerHour: 3.00
  notes: "Free on M5 Max (18C/64GB). ~30 min run. 50 × 2 vCPU pods = 100 vCPU peak; M5 Max has 18 cores, so kwok pods will burst into Docker Desktop's CFS throttling at peak. Adequate for 50 clusters; tighter at higher counts."
