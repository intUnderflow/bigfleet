# local-50k — M5 Max kind ceiling. 50 simulated clusters × 1K CRs.
#
# M44: this profile opts out of the default Pod-mode. The Pod-mode
# floor (1 vCPU req per cluster) × 50 clusters = 50 vCPU on a host
# that has 18 cores. Pod-mode at this clusterCount belongs on cloud
# (scaleway-50k); here we keep CR-mode so the profile fits on the
# dev box. cycle/rollup/ack/shortfalls are all still gated; only
# bindingLatency is skipped per ADR-0017.

kwok:
  clusterCount: 50
  # Two-container split: apiserver+kine and operator+load-driver each
  # get their own cgroup CPU. Pre-split the bundled 2-CPU limit was
  # the contention point; the split lets each side burst independently.
  apiserverResources:
    requests: { cpu: 50m,  memory: 200Mi }
    limits:   { cpu: 1500m, memory: 1Gi }
  workloadResources:
    requests: { cpu: 50m,  memory: 100Mi }
    limits:   { cpu: 500m, memory: 500Mi }

shard:
  replicas: 1
  resources:
    requests: { cpu: 1, memory: 2Gi }
    limits:   { cpu: 4, memory: 8Gi }

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800
  mode: cr   # M44 opt-out — see header comment

slo:
  shardCycleDurationP99Seconds: 5

costEstimate:
  vCPU: 100
  memoryGB: 75
  awsSpotUsdPerHour: 3.00
  notes: "Free on M5 Max (18C/64GB). ~30 min run. CR-mode (M44 opt-out): Pod-mode floor would need 50 vCPU req on an 18-core host. For Pod-mode at 50 clusters, run scaleway-50k on cloud."
