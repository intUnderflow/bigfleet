# scaleway-500k — 500K-machine fleet, 50M aggregated Pods at density=100.
#
# M45.5 convention: "500k" is the machine count; ~50M aggregated Pods
# coalesce onto them at production-realistic density. 500 kwok clusters
# × 100K Pods each = 50M total. Same per-cluster shape as scaleway-50k,
# 10× more clusters. Single shard — 500K machines is the documented
# per-shard ceiling (M11.x). For 1M+ machines see scaleway-1m / -5m,
# which scale out shard.replicas in proportion.
#
# Sizing math (M45.5 reshape):
#   shard:        1 × 4 vCPU / 16 GiB               = 4 vCPU / 16 GiB
#   coordinator:  1 × 500m / 1 GiB                  = 0.5 vCPU / 1 GiB
#   prometheus:   1 × 4 vCPU / 16 GiB               = 4 vCPU / 16 GiB
#                  (50M Pod-bind histograms + 500K UpcomingNode series)
#   kwok pods:  500 × (2 vCPU + 2 vCPU) / (4 GiB + 4 GiB) reqs
#                                                   = 2000 vCPU / 4000 GiB
#   total:      ~2009 vCPU req / ~4033 GiB req      → fits ~70 × PRO2-L
#                                                       (2240 vCPU / 8960 GiB)
#                                                       headroom for spikes
#
# Provisioning (note: 70 PRO2-L exceeds the default quota in fr-par;
# request a quota bump before running, or fall back to a smaller dry-run):
#
#   scw k8s cluster create name=bigfleet-scaletest \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=70 pools.0.min-size=70 pools.0.max-size=70 \
#     region=nl-ams project-id=3150379f-d66f-414d-8ca7-3d7d28fbeef6
#
# Cost (Scaleway, May 2026): 70× PRO2-L × ~€0.42/hr ≈ €29/hr.
# Expected wall-clock: ~60 min ramp + 30 min soak + ~10 min teardown ≈
# 100 min ≈ €48 / ~$52. Single most-expensive M45-suite run; reserve
# for milestone gate validation, not iteration.
#
# Sizing history (pre-M45.5):
#   - Original 50K Pods × 500K seedMachines as a "low-demand against
#     giant inventory pool" stress for Phase 1 / Phase 3 algorithmic
#     scaling. M45.5 inverts that — "500K" now means honest demand
#     for 500K machines, not a 500K-machine static pool with 50K
#     workload.

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  clusterCount: 500
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 1
  # ADR-0022 / M45.5: 600K Idle × density-100 = 60M Pod capacity vs
  # 50M Pod demand (20 % headroom).
  seedMachines: 600000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 4096
  executeConcurrency: 256
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 8, memory: 32Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 100000
  churnPerMinute: 0.02
  durationSeconds: 3600
  reconcilePerTickCap: 200

rampBudget: 60m

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 8, memory: 32Gi }

costEstimate:
  vCPU: 2240
  memoryGB: 8960
  awsSpotUsdPerHour: 29.4
  notes: "70× Scaleway PRO2-L (32 vCPU / 128 GiB each). M45.5: 500K machines, 50M aggregated Pods at density=100 — single-shard ceiling test. ~$52 for a ~100-min end-to-end run. Quota bump may be needed (PRO2-L default ~10/zone). Reserve for milestone gate validation, not day-to-day iteration."
