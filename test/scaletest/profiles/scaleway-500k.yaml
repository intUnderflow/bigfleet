# scaleway-500k — production-shape 500K-machine scale test on Scaleway.
#
# Sized for a multi-PRO2-M Kapsule cluster:
#   shard:        1 pod, 4 vCPU / 6 GiB    (holds 500K-machine inventory)
#   coordinator:  1 pod, 1 vCPU / 1 GiB
#   prometheus:   1 pod, 2 vCPU / 4 GiB
#   kwok pods:   50 × 0.2 vCPU / 400 MiB   (50 simulated clusters)
#   total:       ~17 vCPU req / ~25 GiB   (one PRO2-M is enough)
#
# But the shard at 500K seeded inventory needs ~250 MB raw + indexes +
# sort buffers ≈ 1–2 GiB live, plus per-cycle pool allocations.
# Provisioning a 5-node Kapsule pool for headroom on this run:
#
#   scw k8s cluster create name=bigfleet-scaletest \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-M \
#     pools.0.size=5 pools.0.min-size=5 pools.0.max-size=5 \
#     region=nl-ams project-id=<bigfleet-project-id>
#
# Expected cost on Scaleway nl-ams: 5× PRO2-M × €0.21/hr ≈ €1.05/hr.
# A 30-min run + setup + teardown = ~50 min ≈ €0.88 (~$0.95).

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  # Always pull so iterative scaletest changes pick up the freshly-
  # pushed `:dev` image. Production uses immutable tags + IfNotPresent.
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  clusterCount: 50
  # Split per-container budgets — the pre-split design pinned the
  # apiserver+kine + operator+load-driver under a single 1-core
  # limit and the operator-side write fan-in starved the apiserver,
  # producing a 600 ms execute-side p99 tail in the M11.24a cloud
  # run. With the split, each side gets its own cgroup CPU budget.
  apiserverResources:
    requests: { cpu: 300m, memory: 500Mi }
    limits:   { cpu: 2,    memory: 2Gi }
  workloadResources:
    requests: { cpu: 200m, memory: 300Mi }
    limits:   { cpu: 1,    memory: 1Gi }

shard:
  replicas: 1
  # 500K idle machines pre-seeded so Phase 1 has a real population to
  # match against. Without this the harness measures rollup latency
  # only, not the algorithmic ceiling we actually want to test.
  seedMachines: 500000
  # Cap per-cycle work so a 50K-Need demand burst spreads across
  # cycles instead of blowing the 100ms SLO with 50K Configure RPCs
  # in one cycle. 1000/cycle × ~50 cycles = full ramp in <1 min.
  maxActionsPerCycle: 1000
  # M11.18: parallel execute through operator streams. With 1000
  # actions/cycle and per-cluster stream RTTs of ~5-20ms, serial
  # execute would still take ~10s. 128 parallel workers brings the
  # bottleneck back to actual local compute + apiserver concurrency.
  executeConcurrency: 128
  # M11.22: delta-only reconcile. The phase-dump diagnostic at 500K
  # showed reconcile was 87 % of the cycle on the full-List path; the
  # in-process fake provider honours since_revision so the harness
  # can opt in. Real-provider deployments validate per-provider.
  incrementalReconcile: true
  # Cycle 1 of any shard does a one-time full provider.List that's
  # ~700 ms on M5 and ~1.5 s on PRO2 at 500K — not representative of
  # steady-state cycle work. Skip the first 5 cycles' histogram
  # observations so cycle p99 reflects the SLO-relevant work.
  metricsWarmupCycles: 5
  # localBootstrap left false (default) so we exercise the real
  # operator-stream path. M11.18 should make that fast enough.
  resources:
    requests: { cpu: 2, memory: 3Gi }
    limits:   { cpu: 6, memory: 12Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 4, memory: 12Gi }

costEstimate:
  vCPU: 75
  memoryGB: 80
  awsSpotUsdPerHour: 1.05
  notes: "5× Scaleway PRO2-M (16 vCPU / 64 GB each). 500K seeded inventory + 50K demand. ~$0.95 for a 50-min run end-to-end."
