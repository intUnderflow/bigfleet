# scaleway-500k — production-shape 500K-machine scale test on Scaleway.
#
# M44 (Pod-mode by default): 50 kwok clusters × 1000 Pods each =
# 50K Pods exercised through the full Pod → CR → Configured →
# fake-Node → Pod-bound chain, against a 500K Idle inventory pool.
# internalBindingLatency p99 ≤ 5 s (ADR-0018) gate active per ADR-0014 / ADR-0017.
#
# Sized for a 2-node PRO2-L Kapsule pool. The CR-mode 2× PRO2-M
# sizing no longer fits the M44 kwok floor (1 vCPU req per cluster
# × 50 = 50 vCPU on a 32-vCPU pool).
#
# Sizing math:
#   shard:        1 × 2 vCPU / 3 GiB                = 2 vCPU / 3 GiB
#   coordinator:  1 × 500m / 1 GiB                  = 0.5 vCPU / 1 GiB
#   prometheus:   1 × 2 vCPU / 8 GiB                = 2 vCPU / 8 GiB
#                  (Pod-mode adds per-Pod histogram + Node objects)
#   kwok pods:   50 × 1 vCPU / 2 GiB combined req   = 50 vCPU / 100 GiB
#                  (apiserver 500m/1Gi + workload 500m/1Gi, M44 floor)
#   total:       ~55 vCPU req / ~112 GiB req         → fits 2× PRO2-L
#                                                       (64 vCPU / 256 GiB)
#                                                       ~86 % CPU, ~44 % memory reservation
#
# Sizing history:
#   - Original 5× PRO2-M, then 3× PRO2-M, then 2× PRO2-M (all CR-mode)
#     by trimming kwok requests below what Pod-mode needs.
#   - M44 Pod-mode default: floor is 1 vCPU / 2 GiB combined per kwok
#     pod (matches dev-5k-pods-loopback). 2× PRO2-M no longer fits;
#     2× PRO2-L is the cleanest match. PRO2-L is a separate quota
#     counter from PRO2-M (default 10/zone), so the 2/zone PRO2-M
#     limit doesn't apply.
#
# Provisioning:
#
#   scw k8s cluster create name=bigfleet-scaletest \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=2 pools.0.min-size=2 pools.0.max-size=2 \
#     region=nl-ams project-id=<bigfleet-project-id>
#
# Expected cost: 2× PRO2-L × ~€0.42/hr ≈ €0.84/hr.
# A 30-min run + setup + teardown ≈ 50 min ≈ €0.70 (~$0.74). About
# 2× the CR-mode cost — buys the *internal* binding-latency gate at
# 50K-Pod scale (ADR-0018: real-provider time is not measured here).

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  # Always pull so iterative scaletest changes pick up the freshly-
  # pushed `:dev` image. Production uses immutable tags + IfNotPresent.
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  clusterCount: 50
  # Per-pod budgets inherited from the chart's M44 Pod-mode floor
  # (apiserver 500m/1Gi req, 2/2Gi lim; workload same; sharedVolume
  # 1Gi). dev-5k-pods-loopback proved that's the minimum where kine
  # sqlite stops warning under combined CR + Pod + UpcomingNode +
  # Node write load.

shard:
  # Single-shard 500K. Multi-shard configurations are aggregate-named
  # — see scaleway-1m.yaml for 2 shards × 500K, scaleway-5m.yaml for
  # 10 shards × 500K. The paper sets 500K as the per-shard ceiling
  # (project_lessons_learned: M11.x), so the file's name reflects
  # the scale tested, not how many shards were used to test it.
  replicas: 1
  # 500K idle machines pre-seeded so Phase 1 has a real population to
  # match against. Without this the harness measures rollup latency
  # only, not the algorithmic ceiling we actually want to test.
  seedMachines: 500000
  # Cap per-cycle work so a 50K-Need demand burst spreads across
  # cycles instead of blowing the 5s SLO with 50K Configure RPCs
  # in one cycle. 1000/cycle × ~50 cycles = full ramp in <1 min.
  maxActionsPerCycle: 1000
  # M11.18: parallel execute through operator streams. With 1000
  # actions/cycle and per-cluster stream RTTs of ~5-20ms, serial
  # execute would still take ~10s. 128 parallel workers brings the
  # bottleneck back to actual local compute + apiserver concurrency.
  executeConcurrency: 128
  # M11.22: delta-only reconcile. The phase-dump diagnostic at 500K
  # showed reconcile was 87 % of the cycle on the full-List path; the
  # in-process fake provider honours since_revision so the harness
  # can opt in. Real-provider deployments validate per-provider.
  incrementalReconcile: true
  # Cycle 1 of any shard does a one-time full provider.List that's
  # ~700 ms on M5 and ~1.5 s on PRO2 at 500K — not representative of
  # steady-state cycle work. Skip the first 5 cycles' histogram
  # observations so cycle p99 reflects the SLO-relevant work.
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 2, memory: 3Gi }
    limits:   { cpu: 6, memory: 12Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s

# ADR-0014 + ADR-0017 + ADR-0018 / M44: internal binding-latency
# gate is active because Pod-mode is the default. In-process tier:
# ≤ 5 s for both the cycle envelope and BigFleet's contribution to
# binding latency. User-facing latency = this + provider time
# (not measured here, see ADR-0018).
slo:
  internalBindingLatencyP99Seconds: 5
  shardCycleDurationP99Seconds: 5

prometheus:
  # Bumped from CR-mode's 1/4 GiB: per-Pod bind-latency histogram
  # (12 buckets) + fake Node objects + UpcomingNode series add
  # cardinality. 8 GiB request gives the head block room.
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 4, memory: 16Gi }

costEstimate:
  vCPU: 64
  memoryGB: 256
  awsSpotUsdPerHour: 0.84
  notes: "2× Scaleway PRO2-L (32 vCPU / 128 GB each). 500K seeded inventory + 50K Pod-mode demand through the full M43 chain. internalBindingLatency p99 ≤ 5s (ADR-0018) gate active per ADR-0014/0017. ~$0.74 for a 50-min run end-to-end (~2× the CR-mode cost; the M44 Pod-mode floor needs PRO2-L)."
