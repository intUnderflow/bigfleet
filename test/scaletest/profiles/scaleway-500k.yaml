# scaleway-500k — production-shape 500K-machine scale test on Scaleway.
#
# Sized for a 2-node PRO2-M Kapsule pool. Total resource requests:
#   shard:        1 pod, 2 vCPU / 3 GiB    (holds 500K-machine inventory)
#   coordinator:  1 pod, default
#   prometheus:   1 pod, 1 vCPU / 4 GiB
#   kwok pods:   50 × 0.3 vCPU / 0.8 GiB   (apiserver + workload split)
#                 → 15 vCPU / 40 GiB
#   total:       ~18 vCPU req / ~48 GiB  → fits 2 PRO2-M (32 vCPU / 128 GiB)
#                                          with ~30 % CPU + ~60 % memory headroom
#
# Sizing history:
#   - 5× PRO2-M (initial): cluster utilisation 5-15 %, ~80 % headroom paid for.
#   - 3× PRO2-M (rightsize-1): observed kwok pods steady at ~115m per container
#     vs 300m requested, total cluster CPU 9-11 % across 3 nodes. Reservation
#     math forced a 3-node minimum (50 × 600m + 3.5 = 33.5 cores reserved,
#     above 2-node 32-core capacity), but real CPU only used ~5 cores.
#   - 2× PRO2-M (current): kwok per-container requests trimmed 300m → 150m
#     (still 30 % above observed 115m). Reservations now ~18 cores → fits 2
#     PRO2-M cleanly. Limits unchanged so kwok pods can still burst.
#
# Provisioning:
#
#   scw k8s cluster create name=bigfleet-scaletest \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-M \
#     pools.0.size=2 pools.0.min-size=2 pools.0.max-size=2 \
#     region=nl-ams project-id=<bigfleet-project-id>
#
# Expected cost on Scaleway nl-ams: 2× PRO2-M × €0.21/hr ≈ €0.42/hr.
# A 30-min run + setup + teardown ≈ 50 min ≈ €0.35 (~$0.38). 33 % cheaper
# than the 3-node sizing, 60 % cheaper than the original 5-node.

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  # Always pull so iterative scaletest changes pick up the freshly-
  # pushed `:dev` image. Production uses immutable tags + IfNotPresent.
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  clusterCount: 50
  # Split per-container budgets — the pre-split design pinned the
  # apiserver+kine + operator+load-driver under a single 1-core
  # limit and the operator-side write fan-in starved the apiserver,
  # producing a 600 ms execute-side p99 tail in the M11.24a cloud
  # run. With the split, each side gets its own cgroup CPU budget.
  apiserverResources:
    # Observed steady-state on the 3-node rightsize run was ~115m per
    # container; 150m gives ~30 % headroom above observed and lets 50
    # kwok pods + bigfleet pods fit on 2× PRO2-M (32 vCPU). Limits
    # unchanged — bursts up to 2 cores still allowed.
    requests: { cpu: 150m, memory: 500Mi }
    # tmpfs sharedVolume (default 512Mi) plus kine + apiserver +
    # kwok-controller working set. 3Gi ceiling so the tmpfs has
    # headroom under steady churn.
    limits:   { cpu: 2,    memory: 3Gi }
  workloadResources:
    requests: { cpu: 150m, memory: 300Mi }
    # Previous 500m → 1 cpu was too tight: load-driver couldn't keep
    # up (loadgenCRsActive 14,755 vs 50,000 target). 1.5 cores gives
    # operator + load-driver room under burst.
    limits:   { cpu: 1500m, memory: 1Gi }

shard:
  # Single-shard 500K. Multi-shard configurations are aggregate-named
  # — see scaleway-1m.yaml for 2 shards × 500K, scaleway-5m.yaml for
  # 10 shards × 500K. The paper sets 500K as the per-shard ceiling
  # (project_lessons_learned: M11.x), so the file's name reflects
  # the scale tested, not how many shards were used to test it.
  replicas: 1
  # 500K idle machines pre-seeded so Phase 1 has a real population to
  # match against. Without this the harness measures rollup latency
  # only, not the algorithmic ceiling we actually want to test.
  seedMachines: 500000
  # Cap per-cycle work so a 50K-Need demand burst spreads across
  # cycles instead of blowing the 100ms SLO with 50K Configure RPCs
  # in one cycle. 1000/cycle × ~50 cycles = full ramp in <1 min.
  maxActionsPerCycle: 1000
  # M11.18: parallel execute through operator streams. With 1000
  # actions/cycle and per-cluster stream RTTs of ~5-20ms, serial
  # execute would still take ~10s. 128 parallel workers brings the
  # bottleneck back to actual local compute + apiserver concurrency.
  executeConcurrency: 128
  # M11.22: delta-only reconcile. The phase-dump diagnostic at 500K
  # showed reconcile was 87 % of the cycle on the full-List path; the
  # in-process fake provider honours since_revision so the harness
  # can opt in. Real-provider deployments validate per-provider.
  incrementalReconcile: true
  # Cycle 1 of any shard does a one-time full provider.List that's
  # ~700 ms on M5 and ~1.5 s on PRO2 at 500K — not representative of
  # steady-state cycle work. Skip the first 5 cycles' histogram
  # observations so cycle p99 reflects the SLO-relevant work.
  metricsWarmupCycles: 5
  # localBootstrap left false (default) so we exercise the real
  # operator-stream path. M11.18 should make that fast enough.
  resources:
    requests: { cpu: 2, memory: 3Gi }
    limits:   { cpu: 6, memory: 12Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s

# ADR-0017: this profile is CR-mode (load-driver creates CRs directly,
# no pod-shim, no per-Pod histogram). The runner falls back to the
# fingerprint-grained shard provisioning histogram, which at this
# profile's shape (50 clusters × 1 fingerprint × 1000-CR ramp)
# measures fingerprint fan-out latency, not user-facing per-CR
# latency. The override codifies "fan-out at this shape ≤ 60 s" —
# longer than the in-process default 5 s, honest about what's being
# measured. Pod-mode profiles (dev-5k-pods-loopback, future
# scaleway-*-realistic with mode: pods) get sub-second per-Pod
# binding-latency from the pod-shim's histogram and don't need this
# override.
slo:
  bindingLatencyP99Seconds: 60
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 4, memory: 12Gi }

costEstimate:
  vCPU: 32
  memoryGB: 128
  awsSpotUsdPerHour: 0.42
  notes: "2× Scaleway PRO2-M (16 vCPU / 64 GB each). 500K seeded inventory + 50K demand. ~$0.38 for a 50-min run end-to-end. Sized down twice from the original 5-node profile (cluster CPU was 5-15 %): rightsize-1 went 5→3 nodes, then trimming kwok requests 300m→150m per container freed enough reservation headroom to fit on 2 nodes while still leaving kwok pods their 1.5-core burst limit."
