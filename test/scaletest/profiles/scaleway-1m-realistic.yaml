# scaleway-1m-realistic — 1M-machine fleet test on Scaleway with the
# **M31 production-realistic workload mix**.
#
# Where this differs from scaleway-1m.yaml:
#   - Demand is six distinct workload archetypes (GPU training, GPU
#     inference, CPU batch, CPU service, memory-bound DBs, critical
#     realtime), weighted by approximate fleet frequency.
#   - Real resource requests on every CR (cpu / memory / GPU), not
#     just instance-type pins.
#   - Multi-instance-type pools per archetype (CPU service may use
#     m6i.large or m6i.xlarge or m6i.2xlarge).
#   - Zone constraints — most archetypes spread across [zone-a, zone-b,
#     zone-c]; memory-DBs deliberately pin to zone-a, zone-b only.
#   - Priority diversity: 100 / 1000 / 1000000 ladder, weighted by
#     archetype.
#   - Configured seed mirrors the same archetype distribution so
#     Phase 3 sees a realistic per-cluster fingerprint mix (not a
#     single fingerprint).
#
# Why this matters: M30.{1,2}'s optimisations are validated under a
# uniform single-shape load. Real fleets have 5-50 distinct profile
# fingerprints per cluster. The min-priority short-circuit fires only
# when a bucket has no preemptable victim; the pin-only fast path
# fires only when a profile has no resources. Under a realistic mix
# both optimisations may fail to trigger on most needs, so cycle p99
# may regress vs scaleway-1m. That regression is the *honest* number
# — what the SLO needs to be measured against.
#
# Inventory shape (per shard, 50 owned clusters × 9000 Configured each):
#   ~5%  GPU-training  (a3-highgpu-8g)
#   ~15% GPU-inference (a3-highgpu-1g, a2-highgpu-1g)
#   ~35% CPU-batch     (c6i.4xlarge, c6i.8xlarge, n2-standard-32)
#   ~30% CPU-service   (m6i.large, m6i.xlarge, m6i.2xlarge)
#   ~10% memory-DB     (r6i.xlarge, r6i.2xlarge)
#   ~5%  critical-realtime (c6i.4xlarge, m6i.2xlarge, prio 1000000)
#
# Demand: target 10000 CRs per cluster (1M aggregate); same archetype
# distribution. ~9K of 10K matched by Configured; ~1K is unsatisfied
# burst at the 1:10 burst-regime ratio (ADR-0013).
#
# Sized for the same 2× PRO2-L Kapsule as scaleway-1m.yaml.
# Provisioning recipe identical:
#
#   scw k8s cluster create name=bigfleet-1m \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=2 pools.0.min-size=2 pools.0.max-size=2 \
#     region=fr-par project-id=<bigfleet-project-id>
#
# Expected cost: 2× PRO2-L × ~€0.42/hr ≈ €0.84/hr.
# A 30-min run + setup + teardown ≈ 50 min ≈ €0.70 (~$0.74).

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  clusterCount: 100
  apiserverResources:
    requests: { cpu: 150m, memory: 500Mi }
    limits:   { cpu: 2,    memory: 3Gi }
  workloadResources:
    requests: { cpu: 150m, memory: 400Mi }
    limits:   { cpu: 2,    memory: 1500Mi }

shard:
  replicas: 2
  seedMachines: 50000
  seedConfiguredPerCluster: 9000
  maxActionsPerCycle: 1000
  executeConcurrency: 128
  incrementalReconcile: true
  metricsWarmupCycles: 5
  # M38 (Item 5): spot/hardware failure injector. 1.16e-7 per second
  # per machine ≈ 1%/day, the upper bound of what real fleets see.
  failureRatePerSec: 0.0000001
  resources:
    requests: { cpu: 2, memory: 3Gi }
    limits:   { cpu: 6, memory: 12Gi }

coordinator:
  enabled: true
  replicas: 1

loadProfile:
  target: 10000
  churnPerMinute: 0.05
  durationSeconds: 1800
  priorityClasses: [100, 1000, 1000000]   # legacy fallback; unused when archetypes non-empty
  # M44 explicit opt-out: 10K Pods/cluster doesn't fit the M44
  # Pod-mode kwok floor without separate sizing. The realistic
  # archetype-mix shape this profile validates is orthogonal to
  # Pod-mode anyway — algorithmic SLOs are what we're checking.
  mode: cr

  # M41 (Item 8): Poisson jitter on per-tick churn + minute-scale
  # micro-bursts. Models the second-by-second + minute-scale variance
  # real apiserver write patterns have. Without these the p99.9 tail
  # in summary.json is artificially flat.
  jitteredChurn: true
  microBurstRatePerMinute: 1.0   # one micro-burst per minute on average per pod
  microBurstFactor: 5.0          # 5× the normal per-tick churn for that tick

  # ADR-0015 §3: concentrated bursts. 5 minutes into the soak, ~10 %
  # of pods (selectivity 0.1) ramp up an extra 2000 cpu-service CRs
  # for 60 s — Friday-deploy-window simulation.
  bursts:
    - atSeconds: 300
      archetype: cpu-service
      extraTarget: 2000
      durationSeconds: 60
      selectivity: 0.1

  # ADR-0015 §5 (capped per M36): cluster-size skew within the
  # uniform-pod-budget envelope. Real fleets are heavier-tailed but
  # raising kwok.workloadResources across the entire StatefulSet to
  # serve the few 5× pods would over-provision the rest. Until per-
  # pod resource templating lands, multipliers >2× are clamped at
  # runtime by the load-driver; values here stay inside that cap.
  clusterSizeDistribution:
    - { fraction: 0.05, targetMultiplier: 2.0 }
    - { fraction: 0.20, targetMultiplier: 1.5 }
    - { fraction: 0.50, targetMultiplier: 1.0 }
    - { fraction: 0.25, targetMultiplier: 0.3 }

  # archetypes inherit the chart's realistic catalog default (M44).
  # This profile's distinguishing trait is the additional M33-M42
  # realism layered on top: jitteredChurn, micro-bursts, concentrated
  # cpu-service burst at t=300s, cluster-size skew, failure injection,
  # production-defensible operator client-go defaults, 30s rollup.
  # The base 6-archetype mix comes from the chart.

operator:
  # M39 (Item 6): production-defensible client-go defaults.
  qps: 50
  burst: 100
  ackConcurrency: 16
  # M40 (Item 7): real cluster operators run rollup intervals of
  # 30-60s. The harness was at 10s, which artificially compresses
  # the binding-latency floor users feel. 30s sits at the lower end
  # of production practice; the binding-latency SLO (slo block
  # below) is sized to match.
  rollupInterval: 30s
  # M37: route owner-grouped CRs through Same(rack).
  coLocationKey: topology.bigfleet/rack

# M40 / ADR-0014: per-profile SLO overrides. The default release gate
# (5s binding latency / 5s cycle envelope) targets the in-process
# fake-provider tier with a 10s rollup. The realistic profile ramps
# down through production-defensible operator settings and a 30s
# rollup; binding latency includes ~30s rollup + cycle, so the
# user-facing target is the services-tier ceiling from ADR-0014's
# table (60s, on-demand provisioning). Cycle envelope = rollup/2
# = 15s.
slo:
  bindingLatencyP99Seconds: 60
  shardCycleDurationP99Seconds: 15

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 4, memory: 12Gi }

costEstimate:
  vCPU: 64
  memoryGB: 256
  awsSpotUsdPerHour: 0.84
  notes: "2× Scaleway PRO2-L (32 vCPU / 128 GB each). 2 shards × 500K under management each (450K Configured + 50K Idle) = 1M aggregate fleet. M31 production-realistic workload mix: 6 archetypes (GPU training/inference, CPU batch/service, memory-DB, critical-realtime) with real resources, multi-type pools, zone constraints, priority diversity. Configured seed mirrors the demand archetype distribution so Phase 3 sees a realistic fingerprint mix. ~$0.74 for a 50-min run end-to-end."
