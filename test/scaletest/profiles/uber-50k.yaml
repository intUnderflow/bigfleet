# uber-50k — 50K-machine fleet, 5M aggregated Pods at density=100.
#
# Topology: 20 hosts × 10 kwok clusters per host = 200 clusters total,
# single shard. Per-cluster target 25K Pods × density 100 = 250
# machines; 200 clusters × 250 = 50K machines / 5M Pods total.
#
# Mirror of scaleway-50k's total scale (5M Pods, 50K machines) at
# Uber-infra per-cluster shape. Where scaleway-50k uses 50 clusters
# × 100K Pods on PRO2-L Kapsule (kube-scheduler ~110 binds/sec/cluster
# on Scaleway hardware), uber-50k uses 200 clusters × 25K Pods on
# Uber hosts (kube-scheduler ~30 binds/sec/cluster as measured).
# Same total demand; 4× more clusters at 1/4 the per-cluster size to
# fit the same 60-min budget on slower per-cluster bind throughput.
#
# Per-host deployment: one Helm release per host. 20 hosts is a real
# infrastructure ask but each host runs the same kwok+shard+operators
# stack — scaling pattern is linear extension of uber-5k's 2-host
# setup. Satellite-side overrides (host N, N = 2..20):
#   --set shard.skip=true \
#   --set coordinator.skip=true \
#   --set shard.overrideAddr=<tunnel-endpoint:30780> \
#   --set kwok.clusterIdPrefix=h${N}-
#
# `loadProfile.target` is **per-cluster** CR demand; runner multiplies
# by clusterCount on each host. 25 000 per cluster × 10 clusters/host
# × 20 hosts = 5M total CRs = 50K machines at density 100.
#
# Validation status: aspirational pending uber-5k SLO-pass. Same
# per-cluster shape uber-5k uses, so the per-cluster rate math holds;
# the new validation surface is shard fan-out at 200 streams (uber-5k
# tested 20 streams; scaleway-50k tested 50 streams; this is 4×
# either of those).

namespace: bigfleet-scaletest

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  storage: etcd
  clusterCount: 10   # per host; 20 hosts × 10 = 200 clusters total
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    # 8 GiB comfortably holds 25K objects/cluster (per-cluster
    # apiserver OOM threshold is ~90K on this limit).
    limits:   { cpu: 8, memory: 8Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 1
  # 60K Idle × density-100 = 6M Pod capacity vs 5M demand (20 % headroom).
  # Mirrors scaleway-50k exactly.
  seedMachines: 60000
  seedSpeculative: 100000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 8192
  executeConcurrency: 512
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 8, memory: 16Gi }

coordinator:
  replicas: 1

harness:
  scheduler: kube-scheduler

crossHost:
  expose: true
  shardNodePort: 30780
  coordinatorNodePort: 30790

loadProfile:
  target: 25000   # per-cluster; 200 clusters × 25K = 5M total CRs.
  churnPerMinute: 0.02
  durationSeconds: 3600

# Regime-aware envelope (ADR-0028): ramp scales linearly with total
# CR count vs uber-5k (10× CRs → 2× ramp budget, since per-cluster
# bind work is the same shape). Cycle p99 ceiling scales linearly
# with projected NeedsTable cardinality × 1.5 safety factor
# (~77,600 Needs × 200 µs/Need × 1.5 ≈ 23 s). Internal binding (15 s)
# and ack (12 s, runner default) stay constant — they're BigFleet-
# property bars, not workload-property envelopes.
rampBudget: 120m

operator:
  qps: 400
  burst: 800
  ackConcurrency: 128
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  # ADR-0028: workload-property envelope, scales with NeedsTable.
  shardCycleDurationP99Seconds: 25

prometheus:
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 4, memory: 16Gi }

costEstimate:
  # Per-host. 20 hosts × this footprint.
  vCPU: 80
  memoryGB: 160
  notes: "20 Uber-infra hosts (primary + 19 satellites); free at run-time. M45.5: 50K machines, 5M aggregated Pods at density=100. Mirror of scaleway-50k's total scale, sized for Uber-infra's per-cluster bind throughput (~30 Pods/sec/cluster vs Scaleway's ~110)."
