# uber-50k — 50K-machine fleet, 5M aggregated Pods at density=100.
#
# Production-realistic per-cluster shape mirroring scaleway-50k exactly
# (1K machines/cluster × density 100 = 100K Pods/cluster). Each
# cluster runs on its own dedicated host.
#
# Topology: 50 hosts × 1 cluster each, single shard.
#   - 50 cluster→shard streams converge on the primary's shard.
#   - Primary host: shard + coordinator + 1 kwok cluster + crossHost
#     NodePort exposure.
#   - Satellite hosts (49 of them): 1 kwok cluster each; operators
#     dial the primary's shard through an SSH/TCP tunnel.
#
# Per-host deployment: one Helm release per host. Satellite-side
# overrides (host N where N = 2..50):
#   --set shard.skip=true \
#   --set coordinator.skip=true \
#   --set shard.overrideAddr=<tunnel-endpoint:30780> \
#   --set kwok.clusterIdPrefix=h${N}-

namespace: bigfleet-scaletest

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  storage: etcd
  clusterCount: 1   # per host; 50 hosts × 1 = 50 clusters total
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 8, memory: 16Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 1
  # 60K Idle × density-100 = 6M Pod capacity vs 5M demand (20 % headroom).
  seedMachines: 60000
  seedSpeculative: 100000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 8192
  executeConcurrency: 512
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 8, memory: 16Gi }

coordinator:
  replicas: 1

harness:
  scheduler: kube-scheduler

crossHost:
  expose: true
  shardNodePort: 30780
  coordinatorNodePort: 30790

loadProfile:
  # per-cluster; with clusterCount=1, equals per-host total. 100 000
  # per cluster × 50 hosts = 5M total CRs = 50K machines at density 100.
  target: 100000
  churnPerMinute: 0.02
  durationSeconds: 1800
  reconcilePerTickCap: 200

rampBudget: 60m

operator:
  qps: 400
  burst: 800
  ackConcurrency: 128
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 4, memory: 16Gi }

costEstimate:
  vCPU: 16
  memoryGB: 40
  notes: "50 dedicated Uber-infra hosts (primary + 49 satellites); free at run-time. Per-host footprint above; 50× for total. M45.5: 50K machines, 5M aggregated Pods at density=100. Each cluster on its own host — production-realistic per-cluster shape matching scaleway-50k exactly."
