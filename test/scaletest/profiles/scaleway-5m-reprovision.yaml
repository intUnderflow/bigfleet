# scaleway-5m-reprovision — 5M-machine fleet **reprovisioning regime**
# test on Scaleway (10 shards).
#
# Target shape:
#   10 shards × 500K seeded inventory each      = 5,000,000 machines under management
#   500 simulated KWOK clusters × 10K demand    = 5,000,000 demand CRs (reprovisioning, 1:1)
#   Per-shard load: ~500K demand × 500K inventory
#
# Per ADR-0013 this profile is **NOT gated on the cycle-p99 SLO**.
# At 1:1 the system promises convergence-rate, not per-cycle latency.
# v1 doesn't have automated convergence-rate gating in the runner —
# operators interpret the snapshot's bigfleet_shard_actions_total
# {kind="Bootstrap"} rate manually. Until that gate ships, runs at
# this profile "fail" the cycle-p99 SLO by design; what should pass
# is the loadgenCRsActive sustained gate (≥99.9 % of 5M throughout).
#
# For the burst-regime fleet-scale test (1:10 ratio, cycle p99 SLO
# applies), see scaleway-5m.yaml.
#
# Sized for 7× PRO2-L (32 vCPU / 128 GiB) Scaleway Kapsule:
#   shards:        10 × 2 vCPU / 3 GiB                   =  20 vCPU / 30 GiB
#   coordinator:   1 × default                            =  ~0.5 vCPU / 0.5 GiB
#   prometheus:    1 × 2 vCPU / 8 GiB (5M demand → bigger histogram fan-out)
#   kwok pods:     500 × 0.3 vCPU / 0.8 GiB (apiserver + workload split)
#                                                        = 150 vCPU / 400 GiB
#   total:         ~175 vCPU req / ~440 GiB              → fits 7× PRO2-L
#                                                          (224 vCPU / 896 GiB)
#                                                          ~78 % CPU, ~49 % memory reservation
#
# Sizing history:
#   - First sketch: 8× PRO2-XXL (256 vCPU / 1024 GiB) @ ~€3.40/hr ≈ $3.00/run.
#     Substantially overprovisioned given measured per-pod CPU on the M11
#     500K runs (115 m steady-state per kwok container; 10× the CRs/cluster
#     scales linearly so ~300 m per container is a comfortable assumption).
#   - 7× PRO2-L: same total CPU/memory order with PRO2-L (32 vCPU / 128 GiB)
#     instead of the bigger PRO2-XXL. ~22 % cheaper. PRO2-L is a different
#     instance-type quota counter from PRO2-M / PRO2-XXL, so the 10/zone
#     PRO2-M quota we've been bumping into for the 500K runs doesn't apply.
#
# Pre-flight before running this profile:
#   1. Confirm PRO2-L quota in the chosen zone is ≥7. Default is 10/zone.
#   2. M12 (multi-shard) must be merged (it is — see commits da15e8d / aa7fe20).
#   3. The runner emits per-shard cycle p99 via max(... by pod ...) so a
#      single overshooting shard breaks the gate; older single-shard runs
#      reduce to the same number under that aggregation.
#   4. Coordinator scrape gap (task #146) is unfixed: coordinatorApplyOpsPerSec
#      will still be -1 in the summary. The ~500-domain assignment workload
#      is covered by integration tests; if the run uncovers a coordinator
#      bottleneck we'll see it as cycle p99 stalls, not as a missing metric.
#
# Provisioning (single zone, fr-par-1 — adjust to whichever has quota):
#
#   scw k8s cluster create name=bigfleet-5m \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=7 pools.0.min-size=7 pools.0.max-size=7 \
#     pools.0.zone=fr-par-1 \
#     region=fr-par project-id=<bigfleet-project-id>
#
# Expected cost: 7× PRO2-L × ~€0.42/hr ≈ €2.94/hr.
# A 30-min run + setup + teardown ≈ 50 min ≈ €2.45 (~$2.60).

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  clusterCount: 500
  apiserverResources:
    requests: { cpu: 150m, memory: 500Mi }
    limits:   { cpu: 2,    memory: 3Gi }
  workloadResources:
    # 10× the CRs per cluster (10K vs 1K). The operator's rollup work
    # scales with CRs; bump the limit so workload-side fan-out has room.
    requests: { cpu: 150m, memory: 400Mi }
    limits:   { cpu: 2,    memory: 1500Mi }

shard:
  # 10 shards at the M11-validated ceiling. Coordinator-scrape gap
  # (-1 for coordinatorApplyOpsPerSec, see task #146) means we won't
  # have explicit coordinator capacity confirmation in summary.json
  # for this run — but the integration tests already cover the
  # ~500-domain assignment workload at a per-FSM-apply level.
  replicas: 10
  seedMachines: 500000
  maxActionsPerCycle: 1000
  executeConcurrency: 128
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 2, memory: 3Gi }
    limits:   { cpu: 6, memory: 12Gi }

coordinator:
  enabled: true
  replicas: 1

loadProfile:
  # 10K CRs per cluster × 500 clusters = 5M total demand (1:1 vs
  # the 5M aggregate inventory). Reprovisioning regime (ADR-0013).
  target: 10000
  churnPerMinute: 0.05
  durationSeconds: 1800
  # M44 explicit opt-out: reprovisioning regime is convergence-rate
  # gated, Pod-mode adds no SLO signal here. Per-cluster shape too
  # heavy for the M44 kwok floor regardless.
  mode: cr

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s

prometheus:
  # 5M-CR fan-out: histogram bucket cardinality scales with kwok pod
  # count × bucket count. 4 GiB → 8 GiB to handle 500-pod histograms
  # without the scraper's TSDB head-block growing past memory.
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 4, memory: 16Gi }

costEstimate:
  vCPU: 224
  memoryGB: 896
  awsSpotUsdPerHour: 3.10
  notes: "7× Scaleway PRO2-L (32 vCPU / 128 GB each). 10 shards × 500K seeded inventory + 500 KWOK clusters × 10K demand = 5M-machine fleet. ~$2.60 for a 50-min run end-to-end. M13 architectural-scale test: validates the multi-shard contract from M12 against the 100ms per-shard cycle SLO at fleet scale. Sized down from the original 8× PRO2-XXL sketch (-22 %): the bigger node type was overprovisioned given measured per-kwok-pod CPU on the 500K M11 runs (115 m steady-state per container)."
