# scaleway-50k — 50K-machine fleet, 5M aggregated Pods coalescing at
# density=100. The original §0.1 framing: in a real production cluster
# with ~100 Pods per Node, 50K Nodes carry ~5M Pods. M45.5 reshapes the
# profile to honour that — 50 kwok clusters × 100K Pods each = 5M
# Pods, density=100 → shard emits ~50K Bootstraps → operator publishes
# 50K UpcomingNodes → pod-shim creates 50K fake-Nodes → multi-Pod-per-
# Node bin-packing places ~100 Pods per fake-Node. internalBindingLatency
# p99 ≤ 15 s SLO active (ADR-0020). 100 Pods-per-Node is the realistic
# upper end for CPU-service workloads; together with the M45.4 cardinality
# reduction (~8 Profile fingerprints per cluster) this gives ~12500 CRs
# per Profile-fingerprint per cluster — the aggregate-demand model
# actually aggregating.
#
# Sizing math (M45.5 reshape):
#   shard:        1 × 2 vCPU / 8 GiB                = 2 vCPU / 8 GiB
#   coordinator:  1 × 500m / 1 GiB                  = 0.5 vCPU / 1 GiB
#   prometheus:   1 × 2 vCPU / 8 GiB                = 2 vCPU / 8 GiB
#   kwok pods:   50 × (2 vCPU + 2 vCPU) / (4 GiB + 4 GiB) reqs
#                                                   = 200 vCPU / 400 GiB
#   total:       ~205 vCPU req / ~417 GiB req       → fits 8 × PRO2-L
#                                                       (256 vCPU / 1024 GiB)
#                                                       ~80 % CPU, ~41 % memory
#
# Provisioning:
#   scw k8s cluster create name=bigfleet-scaletest \
#     project-id=3150379f-d66f-414d-8ca7-3d7d28fbeef6 \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=8 pools.0.min-size=8 pools.0.max-size=8
#
# Cost (Scaleway, May 2026): 8× PRO2-L × ~€0.42/hr ≈ €3.36/hr. Expected
# wall-clock: ~50 min ramp + 30 min soak + ~5 min teardown ≈ 90 min ≈
# €5 / ~$5.50. The 5M Pods + 50K machines exercise is what the
# "scaleway-50k" name originally meant; pre-M45 1-Pod-per-machine
# math made 50K mean "50K Pods AND 50K machines simultaneously",
# which is the same wire shape but a completely unrealistic Pod-per-
# Node density.

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  clusterCount: 50
  # M45.5: 100K Pods per kwok-apiserver. kwok is in-memory; each Pod
  # is ~5 KB JSON + watch/index overhead → conservatively 6-8 GiB per
  # apiserver pod. CPU mostly serves list/watch + Pod create rate
  # (~100K / 3000s ramp ≈ 33/sec/cluster) — modest CPU need but
  # generous to absorb spikes.
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  # 2Gi tmpfs (vs M44 floor 1Gi) — kine's sqlite WAL fsyncs at 100K
  # Pods need more headroom; 1Gi was sized for 1K-Pod clusters.
  sharedVolumeSizeLimit: "2Gi"

# M45.5: bump the pod-shim's reconcile fan-out for the 100K-Pods-per-
# cluster shape. Default 64/8 was sized for 1K-Pod clusters where 64
# parallel binds clear a ramp in ~15 sec. At 100K Pods/cluster the
# bind queue is 100× larger; matching that with 256 parallel binders
# keeps per-cluster bind rate near the apiserver's QPS ceiling (200).
podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 1
  # ADR-0022 / M45.5: density=100, 50K-machine target. Seed slightly
  # above demand for Phase 1 headroom — 60K Idle × density-100 = 6M
  # Pod capacity vs 5M Pod demand (20 % headroom).
  seedMachines: 60000
  seedDensityMultiplier: 100
  # M44.4 Drop H sized maxActionsPerCycle for 50K Needs. M45.5 has
  # the same fingerprint cardinality (~8 fp/cluster × 50 clusters =
  # 400 fp) and the same Bootstrap-per-fingerprint shape; 4096 still
  # comfortably covers per-cycle emits.
  maxActionsPerCycle: 4096
  executeConcurrency: 256
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 4, memory: 16Gi }

coordinator:
  replicas: 1

loadProfile:
  # M45.5: 100K Pods/cluster × 50 clusters = 5M Pods total.
  target: 100000
  # M44.4 Drop W rationale carried over: 2 %/min × 100K Pods × 50
  # clusters ÷ 60s ≈ 1667 Pod replacements/sec fleet-wide. That's
  # the realistic-shape churn rate for a 5M-Pod production fleet;
  # the chain's Reclaim throughput on Scaleway etcd is expected to
  # cover it (vs kine's 50/sec ceiling on kind).
  churnPerMinute: 0.02
  # M45.5: extended ramp + soak windows.  100K Pods/cluster at
  # 200/sec/cluster (cap below) ramps in ~500 sec; soak length stays
  # at 30 min equivalent.
  durationSeconds: 3600
  # M45.5: per-tick reconcile cap raised so the load-driver can sustain
  # the 33/sec create rate each cluster needs to fill 100K Pods in
  # the ramp window. Default 20/sec/cluster would cap fleet creation
  # at 1000/sec and starve the test for 100+ min just at the
  # apiserver-write step. 200/sec/cluster comfortably absorbs the
  # demand inside the operator's qps=200 budget.
  reconcilePerTickCap: 200

# ADR-0021 + M45.5: 100K Pods/cluster at ~33 binds/sec/cluster ramps in
# ~50 min; add headroom for the operator-handler tail and steady-state
# warmup before soak.
rampBudget: 60m

# Push the operator harder than its production-safe defaults — Scaleway
# Kapsule's apiserver can absorb significantly more than kine+sqlite
# can. Combined with the M11.14 patch-based ack writes (1 RPC per CR
# instead of 2), this should drop ack p99 well below 12 s. M45.5: 5M
# Pods × 0.02 churn/min ÷ 60s ≈ 1667 Pod creates/sec fleet-wide;
# operator qps=200 per cluster × 50 = 10000/sec — comfortable.
operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 1s

# ADR-0014 + ADR-0017 / M44: internalBindingLatency gate active (ADR-0018).
slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 4, memory: 16Gi }

costEstimate:
  vCPU: 256
  memoryGB: 1024
  awsSpotUsdPerHour: 3.36
  notes: "8× Scaleway PRO2-L (32 vCPU / 128 GiB each) at ~€0.42/hr each → ~€3.36/hr cluster. ~$5.50 for a 90-min end-to-end run (50 min ramp + 30 min soak + 5 min install/teardown). M45.5: density=100, 5M aggregated Pods → 50K machines — the architecturally-correct shape of the test."
