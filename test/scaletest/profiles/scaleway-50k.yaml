# scaleway-50k — 50K-CR run on a Scaleway Kapsule cluster.
#
# M44 (Pod-mode by default): 50 kwok clusters × 1000 Pods each =
# 50K Pods exercised through the full Pod → CR → Configured →
# fake-Node → Pod-bound chain. bindingLatency p99 ≤ 5 s SLO is
# active. Pool sized for the M44 Pod-mode kwok floor (1 vCPU req
# per cluster); 2× PRO2-M no longer fits — bumped to 2× PRO2-L.
#
# Sizing math:
#   shard:        1 × 1 vCPU / 2 GiB                = 1 vCPU / 2 GiB
#   coordinator:  1 × 500m / 1 GiB                  = 0.5 vCPU / 1 GiB
#   prometheus:   1 × 1 vCPU / 4 GiB                = 1 vCPU / 4 GiB
#   kwok pods:   50 × 1 vCPU / 2 GiB combined req   = 50 vCPU / 100 GiB
#                  (apiserver 500m/1Gi + workload 500m/1Gi, M44 floor)
#   total:       ~53 vCPU req / ~107 GiB req         → fits 2× PRO2-L
#                                                       (64 vCPU / 256 GiB)
#                                                       ~83 % CPU, ~42 % memory reservation
#
# Provisioning:
#   scw k8s cluster create name=bigfleet-scaletest \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=2 pools.0.min-size=2 pools.0.max-size=2
#
# Cost (Scaleway, May 2026): 2× PRO2-L × ~€0.42/hr ≈ €0.84/hr. A
# 30-min run + ~5min ramp + teardown ≈ 40 min ≈ €0.56 / ~$0.60.
# About 2× the CR-mode cost ($0.30) — buys the user-facing
# binding-latency gate at scale.

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  pullPolicy: IfNotPresent

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: IfNotPresent

kwok:
  clusterCount: 50
  # Per-pod budgets inherited from the chart's M44 Pod-mode floor
  # (500m/1Gi req, 2/2Gi lim, 1Gi tmpfs).

shard:
  replicas: 1
  resources:
    requests: { cpu: 1, memory: 2Gi }
    limits:   { cpu: 4, memory: 8Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

# Push the operator harder than its production-safe defaults — Scaleway
# Kapsule's apiserver can absorb significantly more than kine+sqlite
# can. Combined with the M11.14 patch-based ack writes (1 RPC per CR
# instead of 2), this should drop ack p99 well below 12 s.
operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s

# ADR-0014 + ADR-0017 / M44: bindingLatency gate active. In-process
# tier targets at cloud scale.
slo:
  bindingLatencyP99Seconds: 5
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 2, memory: 8Gi }

costEstimate:
  vCPU: 64
  memoryGB: 256
  awsSpotUsdPerHour: 0.84
  notes: "2× Scaleway PRO2-L (32 vCPU / 128 GB each) at ~€0.42/hr. ~$0.60 for a 40-min run end-to-end. Pod-mode (M44 default) — bindingLatency gate active."
