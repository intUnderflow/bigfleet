# scaleway-50k — 50K-CR run on a Scaleway Kapsule cluster.
#
# Sized for a 2-node PRO2-M Kapsule pool (32 vCPU / 128 GB RAM total).
# Pre-harness-split this fit on 1 node, but the 2-container split per
# kwok pod (apiserver + workload) bumped per-pod CPU req from ~200m
# to ~300m — 50 pods × 300m + shard + coordinator + prometheus
# overflows a single 16-vCPU PRO2-M.
#
# Provisioning:
#   scw k8s cluster create name=bigfleet-scaletest \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-M \
#     pools.0.size=2 pools.0.min-size=2 pools.0.max-size=2
#
# Cost (Scaleway, May 2026): 2× PRO2-M × €0.21/hr ≈ €0.42/hr. A
# 30-min run + ~5min ramp + teardown ≈ 40 min ≈ €0.28 / ~$0.30.

# Scaleway pulls images from a registry (no kind side-load), so point
# at the GHCR-published copies. These are public; the Kapsule cluster
# pulls anonymously.
image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  pullPolicy: IfNotPresent

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: IfNotPresent

kwok:
  clusterCount: 50
  # Two-container split (post-M11.24a harness reshape): apiserver +
  # kine + kwok-controller in one container, operator + load-driver in
  # the other, each with its own cgroup CPU budget so they stop
  # competing for one limit.
  apiserverResources:
    requests: { cpu: 200m, memory: 400Mi }
    limits:   { cpu: 1,    memory: 1Gi }
  workloadResources:
    requests: { cpu: 100m, memory: 200Mi }
    limits:   { cpu: 500m, memory: 512Mi }

shard:
  replicas: 1
  resources:
    requests: { cpu: 1, memory: 2Gi }
    limits:   { cpu: 4, memory: 8Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

# Push the operator harder than its production-safe defaults — Scaleway
# Kapsule's apiserver can absorb significantly more than kine+sqlite
# can. Combined with the M11.14 patch-based ack writes (1 RPC per CR
# instead of 2), this should drop ack p99 well below 12 s.
operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s

prometheus:
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits:   { cpu: 2, memory: 8Gi }

costEstimate:
  vCPU: 60
  memoryGB: 60
  awsSpotUsdPerHour: 0.25
  notes: "1× Scaleway PRO2-M (16 vCPU / 64 GB) at ~€0.21/hr. ~$0.15 for a 40-min run end-to-end."
