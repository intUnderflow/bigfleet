# scaleway-50k — 50K-CR run on a Scaleway Kapsule cluster.
#
# M44 (Pod-mode by default): 50 kwok clusters × 1000 Pods each =
# 50K Pods exercised through the full Pod → CR → Configured →
# fake-Node → Pod-bound chain. bindingLatency p99 ≤ 5 s SLO is
# active. Pool sized for the M44 Pod-mode kwok floor (1 vCPU req
# per cluster); 2× PRO2-M no longer fits — bumped to 2× PRO2-L.
#
# Sizing math:
#   shard:        1 × 1 vCPU / 2 GiB                = 1 vCPU / 2 GiB
#   coordinator:  1 × 500m / 1 GiB                  = 0.5 vCPU / 1 GiB
#   prometheus:   1 × 1 vCPU / 4 GiB                = 1 vCPU / 4 GiB
#   kwok pods:   50 × 1 vCPU / 2 GiB combined req   = 50 vCPU / 100 GiB
#                  (apiserver 500m/1Gi + workload 500m/1Gi, M44 floor)
#   total:       ~53 vCPU req / ~107 GiB req         → fits 2× PRO2-L
#                                                       (64 vCPU / 256 GiB)
#                                                       ~83 % CPU, ~42 % memory reservation
#
# Provisioning:
#   scw k8s cluster create name=bigfleet-scaletest \
#     project-id=3150379f-d66f-414d-8ca7-3d7d28fbeef6 \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=2 pools.0.min-size=2 pools.0.max-size=2
#
# Cost (Scaleway, May 2026): 2× PRO2-L × ~€0.42/hr ≈ €0.84/hr. A
# 30-min run + ~5min ramp + teardown ≈ 40 min ≈ €0.56 / ~$0.60.
# About 2× the CR-mode cost ($0.30) — buys the user-facing
# binding-latency gate at scale.

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  clusterCount: 50
  # Per-pod budgets inherited from the chart's M44 Pod-mode floor
  # (500m/1Gi req, 2/2Gi lim, 1Gi tmpfs).

shard:
  replicas: 1
  # 60K Idle headroom over the 50K Pod demand so Phase 1 actually
  # binds, the pod-shim closes the loop, and internalBindingLatency
  # is measured. Without a seed every Pod is a shortfall, the chain
  # stays open at the unsatisfied-burst step, and the test only
  # validates rollup + Phase 1 attempt — not the M44 user-facing
  # default we want.
  seedMachines: 60000
  # M44.4 Drop H: bumped from 256 → 4096. At 50 K demand × M35 unique
  # fingerprints = ~50 K Needs, Phase 1's per-cycle emit ceiling
  # caps how fast the chain processes new churn. Drop G snapshot
  # showed 5,359 actions deferred per cycle — Phase 1 wanted ~5,600
  # but only 256 fit. Cap at 4096 covers the steady-state demand
  # comfortably (churn 67/sec × cycle 0.4 s ≈ 27 new Needs/cycle,
  # plus accumulated backlog) without making any single cycle
  # arbitrarily expensive. executeConcurrency stays at 256 — workers
  # run async and the queue absorbs bursts above their drain rate.
  maxActionsPerCycle: 4096
  executeConcurrency: 256
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 1, memory: 2Gi }
    limits:   { cpu: 4, memory: 8Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

# ADR-0021: post-pool throughput is ~50-85 binds/sec; 50 K-Pod ramp
# drains in ~10-17 min depending on operator-handler tail. 25 min
# floor leaves plenty of headroom and ensures the gate's 99 %
# bootstraps requirement clears before soak starts (so steady-state
# Pods aren't queued behind unfinished ramp).
rampBudget: 25m

# Push the operator harder than its production-safe defaults — Scaleway
# Kapsule's apiserver can absorb significantly more than kine+sqlite
# can. Combined with the M11.14 patch-based ack writes (1 RPC per CR
# instead of 2), this should drop ack p99 well below 12 s.
operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  # 1s rollup tick — at 50 K demand × 0.05 churn/min/Pod ≈ 41 churns/sec
  # in steady state, the binary's 10 s default would alone burn half the
  # 15 s SLO. Kapsule's apiserver QPS budget easily absorbs 50× listed
  # CRs every second; the rollup itself is ~10 ms p99 in this profile.
  rollupInterval: 1s

# ADR-0014 + ADR-0017 / M44: internalBindingLatency gate active (ADR-0018). In-process
# tier targets at cloud scale.
slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 2, memory: 8Gi }

costEstimate:
  vCPU: 64
  memoryGB: 256
  awsSpotUsdPerHour: 0.84
  notes: "2× Scaleway PRO2-L (32 vCPU / 128 GB each) at ~€0.42/hr. ~$0.60 for a 40-min run end-to-end. Pod-mode (M44 default) — internalBindingLatency gate active (ADR-0018)."
