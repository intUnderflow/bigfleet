# scaleway-5k — 5K-machine fleet, 500K aggregated Pods at density=100.
#
# M45.5 convention: "5k" is the machine count; ~500K aggregated Pods
# coalesce onto them at production-realistic density. 5 kwok clusters
# × 100K Pods each = 500K total. Same per-cluster shape as
# scaleway-50k, 10× fewer clusters. Smallest cloud profile that's
# honest scale (dev-500 is the kind-runnable cousin for laptop
# iteration; this is the cheapest run that actually exercises etcd
# at density=100).
#
# Sizing math (M45.5):
#   shard:        1 × 1 vCPU / 4 GiB                = 1 vCPU / 4 GiB
#   coordinator:  1 × 500m / 1 GiB                  = 0.5 vCPU / 1 GiB
#   prometheus:   1 × 1 vCPU / 4 GiB                = 1 vCPU / 4 GiB
#   kwok pods:    5 × (2 vCPU + 2 vCPU) / (4 GiB + 4 GiB) reqs
#                                                   = 20 vCPU / 40 GiB
#   total:       ~22 vCPU req / ~49 GiB req          → fits 1 × PRO2-L
#                                                       (32 vCPU / 128 GiB)
#                                                       ~70 % CPU, ~38 % memory
#
# Provisioning:
#   scw k8s cluster create name=bigfleet-scaletest \
#     project-id=3150379f-d66f-414d-8ca7-3d7d28fbeef6 \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=1 pools.0.min-size=1 pools.0.max-size=1
#
# Cost (Scaleway, May 2026): 1× PRO2-L × ~€0.42/hr. Expected wall-clock:
# ~10 min ramp + 30 min soak + ~5 min install/teardown ≈ 45 min ≈ €0.32
# (~$0.35). Cheapest path to honest density=100 validation; runs in
# parallel scale up cleanly into scaleway-50k+ once shape is verified.

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  clusterCount: 5
  # M45.5: 100K Pods per kwok-apiserver. Same per-cluster shape as
  # scaleway-50k; only the cluster count differs.
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 1
  # 6000 Idle × density-100 = 600K Pod capacity vs 500K demand (20 % headroom).
  seedMachines: 6000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 4096
  executeConcurrency: 256
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 2, memory: 8Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 100000
  churnPerMinute: 0.02
  durationSeconds: 1800
  reconcilePerTickCap: 200

rampBudget: 15m

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 2, memory: 8Gi }

costEstimate:
  vCPU: 32
  memoryGB: 128
  awsSpotUsdPerHour: 0.42
  notes: "1× Scaleway PRO2-L (32 vCPU / 128 GiB). M45.5: 5K machines, 500K aggregated Pods at density=100 — smallest cloud profile under the new convention. ~$0.35 for a 45-min end-to-end run."
