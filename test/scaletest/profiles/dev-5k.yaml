# dev-5k — smallest sensible profile, runs free on a laptop.
# 5 simulated clusters × 1K Pods each = 5K total demand.
#
# M44: Pod-mode + realistic archetype catalog are the chart defaults.
# This profile inherits both — kwok floor (500m/1Gi req, 2/2Gi lim,
# 1Gi tmpfs) and the 6-archetype realistic catalog (GPU training,
# GPU inference, CPU batch, CPU service, memory-DB, critical-realtime).
# The shard's seed reads the same catalog (M34) so seed and demand
# match by archetype.
#
# Pod-mode requires inventory for binding to actually happen; without
# a seed every Pod becomes a shortfall and the chain isn't exercised.
#
# ADR-0022 / M45.4: seedDensityMultiplier=10 — each seeded machine
# carries Allocatable = 10 × Profile.Resources, so one fake-Node hosts
# up to 10 Pods of its profile (the realistic multi-Pod-per-Node shape
# real Kubernetes uses). With ~8 distinct profiles per cluster and 1000
# Pods/cluster, this means each profile's ~125 Pods aggregate into ~13
# machines instead of 125 — exercising both the M45.1 shard-side vector
# math AND the pod-shim's bin-packing path. seedMachines is reduced
# proportionally (600 vs the pre-M45 6000) so total Pod-capacity stays
# at ~6000 (a hair above the 5000 demand for Phase 1 headroom).

kwok:
  clusterCount: 5

shard:
  replicas: 1
  # 300 Idle machines × density-10 = 3000 Pod capacity, slightly above
  # the 2500 Pod demand. Distributed across the realistic archetypes by
  # weight (M34).
  seedMachines: 300
  # ADR-0022 / M45.4: see header comment.
  seedDensityMultiplier: 10

loadProfile:
  # ADR-0022 / M45.4: target halved to 500 Pods/cluster (2500 total)
  # because kind's kine sqlite apiserver writes at ~50/sec, and the
  # realistic archetype mix at 1000 Pods/cluster layers churn +
  # lifetime-aging at >25 deletes/sec by end of ramp. The load-driver's
  # replacement creates compete for the same write budget and
  # `loadgenCRsActive` falls below the 99.9 % sustain threshold during
  # soak. The chain itself is healthy at the larger target (v6 ran at
  # 17.5× density ratio with 263 s p99 provisioning), so this is
  # purely the apiserver budget on laptop kind. Cloud profiles
  # (scaleway-50k+) keep target=1000 since production-grade etcd
  # handles the load fine. churnPerMinute stays at 0.05 — the
  # archetype-lifetime aging is the real churn signal anyway.
  target: 500
  churnPerMinute: 0.05
  durationSeconds: 600
  # archetypes inherits the chart's realistic catalog default.

operator:
  qps: 50
  burst: 100
  ackConcurrency: 16
  rollupInterval: 10s
  # M37: route owner-grouped CRs through Same(rack) — required by
  # the realistic catalog's gpu-training and memory-db archetypes
  # which set sameRack: true.
  coLocationKey: topology.bigfleet/rack

# ADR-0014 in-process tier on kind: binding-latency p99 ≤ 10 s. The
# realistic archetype mix has more fingerprint diversity than a
# single-archetype run, so rollup carries more variation; raise to 2 s.
slo:
  internalBindingLatencyP99Seconds: 10
  shardCycleDurationP99Seconds: 5
  operatorRollupP99Seconds: 2

costEstimate:
  vCPU: 10
  memoryGB: 10
  awsSpotUsdPerHour: 0.20
  notes: "Free on M5 Max kind. ~10 min run. M45.4: 5 clusters × 500 Pods (target halved from 1000 to fit kind kine-apiserver write budget under realistic churn). Density=10 means 300 seed machines × 10 fake-Pod capacity covers the 2500-Pod demand; the multi-Pod-per-Node pod-shim bin-packs replacements onto existing fake-Nodes during soak."
