# cloud-5m — aspirational ceiling. 5,000 clusters × 1K CRs = 5M machines.
# Quarterly cadence; roughly $35-40 per run on EKS spot.

kwok:
  clusterCount: 5000

shard:
  replicas: 50
  resources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 8, memory: 16Gi }

coordinator:
  replicas: 3
  resources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }

loadProfile:
  target: 1000
  churnPerMinute: 0.02
  durationSeconds: 3600
  # M44 explicit opt-out: 5000 clusters × 1 vCPU Pod-mode floor =
  # 5000 vCPU req. The realistic-shape Pod-mode test already lives
  # in scaleway-{50k,500k}.yaml; this profile gates on aggregate
  # algorithmic SLOs at 5M scale, which Pod-mode doesn't change.
  mode: cr

prometheus:
  retentionDays: 1
  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 8, memory: 32Gi }

costEstimate:
  vCPU: 2800
  memoryGB: 2800
  awsSpotUsdPerHour: 35.00
  notes: "EKS spot tier. Quarterly cadence. ~60 min run = ~$35-40. Use --yes to skip confirmation."
