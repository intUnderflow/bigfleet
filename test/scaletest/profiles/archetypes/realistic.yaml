# Production-realistic workload archetypes for the scaletest harness.
#
# ADR-0050: this catalog is calibrated to a realistic MACHINE fleet, not
# a realistic pod-count distribution. BigFleet allocates machines; the
# cloud realism baseline (M78) measures machine-allocation SLOs, so the
# fleet's *machine* mix is the calibration target and the pod-count
# distribution is now a DERIVED property. The reason a pod-realistic
# catalog can't double as machine-realistic: for a whole-machine GPU
# gang, pod-share IS machine-share (1 pod/node), while commodity pods
# pack ~100/node — a 100x spread that means a realistic ~7% GPU *pod*
# share mechanically implies a ~90% GPU *machine* fleet, which no
# production fleet resembles. See the ADR for the full derivation.
#
# Weights are back-solved from a target machine mix:
#     weight  proportional to  machineShare x podsPerNode / E[replicas]
# where podsPerNode is the per-archetype node-packing density (the
# podsPerNode field, ADR-0050) and E[replicas] is the mean workload-
# object size (21.375 for non-gang from the service-size distribution in
# pkg/scaletest/archetype/sizing.go; mean(groupSizeRange) for gangs).
# The spread is large by construction (tiny-stateless ~16000 :
# gpu-training-large 1) — that is expected, not a bug: a whole-machine
# gang needs a tiny object frequency to occupy a few percent of the
# fleet. The chosen normalization keeps gpu-training-medium and
# gpu-training-large representable as positive integers (large = 1, its
# coarsest representable weight).
#
# Target machine mix vs realized (the regression pin
# TestRealisticCatalog_MachineMix in pkg/scaletest/archetype asserts the
# realized column stays within tolerance of target). gpu-training-large
# is now burstOnly (#327) so it contributes 0 to the steady mix; the
# remaining shares renormalize up slightly:
#
#   archetype             podsPerNode  weight   target%   realized%
#   tiny-stateless           100       16073     66.4       66.4
#   cpu-service              100        2755      11.4       11.4
#   cpu-batch                100        1378       5.7        5.7
#   critical-realtime        100         230       0.95       0.95
#   memory-cache             100        2000       1.5        1.5
#   stateful-db              100        2000       1.5        1.5
#   gpu-inference              8         100       5.2        5.2
#   gpu-training-small         1          32       3.1        3.1
#   gpu-training-medium        1          18       4.2        4.2
#   gpu-training-large         1           — burstOnly: 0 steady share —
#   ----------------------------------------------------------------
#   general compute (tiny+service+batch+critical) ~84%; gang DBs ~3%;
#   GPU (inference + training-small + training-medium) ~12.4% machine-
#   share. The DERIVED pod mix that falls out is ~75% tiny-stateless and
#   <1% GPU pods — the ADR-0050 divergence made concrete.
#
# gpu-training-large was the lumpy term (ADR-0050 Consequences): at a
# 64-256-machine atomic gang its expected count in a 5,000-machine fleet
# is ~1 gang, so a probabilistic weighted draw gave 0/1/2 gangs
# (~+/-100% variance, bimodal baseline). #327 moves it OUT of the steady
# baseline: it is now burstOnly (see its block below), modelled as an
# occasional burst event in the 5k.yaml realism profile rather than a
# steady-catalog archetype. Foundation-model training is rare and
# bursty, so a burst is the realistic shape.
#
# Calibrated against industry production workload patterns: bottom-
# heavy long tail of tiny stateless services, smaller "interesting"
# tier of GPU / stateful / critical work.
#
# Both the load-driver (which creates CRs / Pods) and the shard's
# Configured seed read this same file so the seeded inventory
# matches the demand the load-driver creates. Drift between the two
# = Phase 3 reclaims the seed every cycle and the test measures
# reprovisioning, not steady-state.
#
# Calibration history:
#
#   * ADR-0015 (M33) introduced the catalog with six archetypes
#     biased toward "interesting" workloads (GPU, batch, critical).
#   * the scale-test review (2026-05-17) re-calibrated against
#     industry production workload patterns. Findings:
#     - Long-tail tiny services (200m-500m CPU, 256Mi-512Mi) are
#       ~60-70% of production Pods, not 0% as the original catalog
#       had. The "modal Pod" is small and stateless. Now modelled
#       by `tiny-stateless` at 70% weight.
#     - Sidecars are containers within a Pod, not separate Pods.
#       Their resource overhead (~150-200m CPU, ~200-300Mi) is
#       inflated into the archetype's per-Pod request, not modelled
#       as a separate archetype.
#     - True atomic gang scheduling (where partial fills are
#       failure) is rare: ~1-3% by Pod count, dominated by ML
#       training. Most other "co-located" workloads (DBs, caches)
#       tolerate partial fills — they want rack affinity for
#       replication latency but replicas join independently. The
#       new `allowPartial` flag distinguishes these.
#     - GPU training has three realistic gang-size tiers
#       (hyperparameter sweeps 2-8, standard training 16-32,
#       foundation models 64-256), not one.
#     - Topology spread is missing entirely from the prior catalog
#       even though it's on ~30-50% of production Pods. Added as
#       a probabilistic per-archetype field.
#     - Priority distribution skews heavily to default (~85%);
#       the prior catalog's "everything at 1000+" was wrong.
#     - Profile fingerprint cardinality is ~30-60/cluster in
#       steady state (vs prior ~8-10). Long-tail label variety
#       drives this.
#
# Schema (per-archetype):
#   name                  : human-readable label
#   weight                : relative workload-object frequency. NOT a
#                           machine-share and NOT a pod-share directly;
#                           back-solved from the target machine mix per
#                           ADR-0050 (see the table above).
#   podsPerNode           : ADR-0050 node-packing density — how many of
#                           this archetype's Pods one real node of its
#                           class holds. The seed machine = per-Pod
#                           resources x podsPerNode for ALL resources
#                           (GPU included). Unset/0 falls back to the
#                           global density for core-only shapes and 1 for
#                           extended-resource shapes (pre-ADR-0050).
#   instanceTypes         : `node.kubernetes.io/instance-type In [...]`
#   zones                 : `topology.kubernetes.io/zone In [...]`
#   sizeBuckets           : per-CR resources picked weighted-random.
#                           Resource shape includes typical sidecar
#                           overhead for archetypes that carry them
#                           (everything except cpu-batch and gpu-*).
#   priorityClasses       : driver picks one uniformly per CR
#   interruptionPenalty   : float64 dollars
#   reclamationPenalty    : float64 dollars
#   meanLifetimeSeconds   : exponential-mean lifetime. 0 = immortal.
#   sameRack              : when true, CR carries co-location term
#                           on `topology.bigfleet/rack` (per ADR-0024)
#   allowPartial          : when true, the archetype is "co-located
#                           but not gang" — workload tolerates partial
#                           fills. Memory caches and stateful DBs
#                           carry this; GPU training does not. (Forward-
#                           compat for ADR-0029's mode classifier; today
#                           every Need is partial-fill-tolerant by
#                           default.)
#   groupSizeRange        : [min, max] machines per Same-rack group
#   burstOnly             : when true (#327), the archetype is excluded
#                           from the steady model entirely — steady demand
#                           draw, steady seed allocation, AND its gang
#                           floor — and exists only to be referenced by
#                           name from a burst event (load-driver
#                           bursts[].archetype). Its full definition is
#                           kept so the burst's live-filled machines size
#                           from it. Use for rare/bursty workloads whose
#                           steady presence would be lumpy/bimodal (e.g.
#                           a 64-256-node foundation-training gang).
#   spreadConstraintProb  : probability that a per-CR draw carries
#                           the SpreadConstraint below. 0.0 = never.
#   spreadConstraint      : topologyKey + maxSkew + whenUnsatisfiable.

archetypes:
  # ===== Long tail: tiny stateless services =====
  # Modal production Pod. Tiny resource shape (app container ~200m /
  # 256Mi plus ~150-200m / ~200-300Mi of typical mesh+observability
  # sidecars baked in). Default priority, no co-location. Default-
  # spread-from-template templates apply zone-spread to ~45% of
  # them — best-effort spread, since these are commodity replicas.
  - name: tiny-stateless
    # ADR-0050: podsPerNode unset → global density (100). weight
    # back-solved for ~64.5% machine-share (82% general-compute split
    # 70:12:6:1 across the four cpu archetypes).
    weight: 16073
    instanceTypes: [m6i.large, m6i.xlarge]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 60, resources: { cpu: "400m", memory: "500Mi" } }
      - { weight: 40, resources: { cpu: "300m", memory: "384Mi" } }
    priorityClasses: [100]
    interruptionPenalty: 32
    reclamationPenalty: 64
    meanLifetimeSeconds: 0
    spreadConstraintProb: 0.45
    spreadConstraint:
      topologyKey: topology.kubernetes.io/zone
      maxSkew: 2
      whenUnsatisfiable: ScheduleAnyway

  # ===== Medium services =====
  # HPA-driven and fixed-replica deployments at meaningful but not
  # critical priority. Per-Pod request includes sidecar overhead but
  # the overhead is a smaller relative bump on a 2-CPU app container.
  # Spread on 75% — most production services explicitly spread for HA.
  - name: cpu-service
    # ADR-0050: podsPerNode unset → global density (100). ~11.1% share.
    weight: 2755
    instanceTypes: [m6i.xlarge, m6i.2xlarge]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 70, resources: { cpu: "2200m", memory: "8500Mi" } }
      - { weight: 30, resources: { cpu: "4200m", memory: "16500Mi" } }
    priorityClasses: [1000]
    interruptionPenalty: 1024
    reclamationPenalty: 8192
    meanLifetimeSeconds: 0
    spreadConstraintProb: 0.75
    spreadConstraint:
      topologyKey: topology.kubernetes.io/zone
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule

  # ===== Batch jobs =====
  # Resumable, short-lived, low priority. Don't run the mesh/
  # observability sidecar stack typical of long-lived services — so
  # no sidecar inflation on their resource shape. Only ~15% carry
  # spread; most batch is spread-tolerant.
  - name: cpu-batch
    # ADR-0050: podsPerNode unset → global density (100). ~5.5% share.
    weight: 1378
    instanceTypes: [c6i.4xlarge, c6i.8xlarge, n2-standard-32]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 60, resources: { cpu: "4", memory: "8Gi" } }
      - { weight: 40, resources: { cpu: "8", memory: "16Gi" } }
    priorityClasses: [100]
    interruptionPenalty: 64
    reclamationPenalty: 256
    meanLifetimeSeconds: 600  # ~10-min batch
    spreadConstraintProb: 0.15
    spreadConstraint:
      topologyKey: topology.kubernetes.io/zone
      maxSkew: 2
      whenUnsatisfiable: ScheduleAnyway

  # ===== Stateful: memory-bound caches =====
  # In-memory caches with peer chatter (gossip, replication). Want
  # rack affinity for latency, but tolerate partial fills: 3 of 5
  # replicas start and the cache rebalances incrementally. Hence
  # allowPartial: true. Spread is N/A because Same(rack) and
  # zone-spread on the same key are contradictory per bigfleet.md §8.
  - name: memory-cache
    # ADR-0050: podsPerNode unset → global density (100); density-packed
    # cpu/mem gang. weight back-solved for ~1.5% machine-share (E =
    # mean(groupSizeRange) = 4).
    weight: 2000
    instanceTypes: [r6i.xlarge, r6i.2xlarge]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 100, resources: { cpu: "2", memory: "16Gi" } }
    priorityClasses: [1000]
    interruptionPenalty: 4096
    reclamationPenalty: 16384
    meanLifetimeSeconds: 0
    sameRack: true
    allowPartial: true
    groupSizeRange: [3, 5]

  # ===== Stateful: databases =====
  # Persistent-storage-backed databases. Same rack-affinity reasoning
  # as memory-cache; replicas can join an existing cluster
  # incrementally. (Cross-shard spread is operator-emergent — the
  # operator picks different anchor racks per shard during emission;
  # we don't model that here, see scale-test follow-on.)
  - name: stateful-db
    # ADR-0050: podsPerNode unset → global density (100); ~1.5% share
    # (E = mean(groupSizeRange) = 4).
    weight: 2000
    instanceTypes: [r6i.2xlarge, r6i.4xlarge]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 100, resources: { cpu: "8", memory: "32Gi" } }
    priorityClasses: [1000]
    interruptionPenalty: 8192
    reclamationPenalty: 32768
    meanLifetimeSeconds: 0
    sameRack: true
    allowPartial: true
    groupSizeRange: [3, 5]

  # ===== GPU inference =====
  # Latency-sensitive single-GPU inference servers. Long-lived. ~50%
  # carry zone-spread (replicas distributed for capacity-zone
  # resilience).
  #
  # ADR-0050: podsPerNode 8 — gpu:1 inference Pods packed onto an 8-GPU
  # node (MIG / time-slice / multi-GPU box). The seed machine becomes
  # gpu:8, cpu:64, mem:256 (8 x the per-Pod shape, GPU scaled too). This
  # is the ONE GPU tier where pod-realism and machine-realism reconcile:
  # a realistic inference pod-share maps to 1/8 the machines. instanceTypes
  # are therefore 8-GPU nodes (a3/a2-highgpu-8g) — the previous 1-GPU
  # nodes (a3/a2-highgpu-1g, 1 Pod/node) were the un-densified model this
  # replaces, which forced ~1 machine per inference Pod and inflated the
  # GPU machine-share.
  - name: gpu-inference
    weight: 100
    podsPerNode: 8
    instanceTypes: [a3-highgpu-8g, a2-highgpu-8g]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 100, resources: { cpu: "8", memory: "32Gi", nvidia.com/gpu: "1" } }
    priorityClasses: [1000]
    interruptionPenalty: 4096
    reclamationPenalty: 8192
    meanLifetimeSeconds: 0
    spreadConstraintProb: 0.5
    spreadConstraint:
      topologyKey: topology.kubernetes.io/zone
      maxSkew: 2
      whenUnsatisfiable: ScheduleAnyway

  # ===== GPU training: small (hyperparameter sweeps) =====
  # Atomic gang. Small-scale experiments and parameter sweeps —
  # 2-8 GPUs is the dominant gang size for ad-hoc training. Not
  # marked allowPartial: partial fills break gang scheduling.
  - name: gpu-training-small
    # ADR-0050: podsPerNode 1 — a gpu:8 Pod takes a whole 8-GPU node
    # (node = the Pod). Genuinely whole-machine: pod-share IS
    # machine-share, so calibrated in machine terms. ~3% machine-share
    # (E = mean(groupSizeRange) = 5).
    weight: 32
    podsPerNode: 1
    instanceTypes: [a3-highgpu-8g]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 100, resources: { cpu: "64", memory: "256Gi", nvidia.com/gpu: "8" } }
    priorityClasses: [1000]
    interruptionPenalty: 16384
    reclamationPenalty: 32768
    meanLifetimeSeconds: 0
    sameRack: true
    groupSizeRange: [2, 8]

  # ===== GPU training: medium (standard training jobs) =====
  # Atomic gang, larger. M66.2 (complexity audit Action 2): rack-
  # coherent gang sizes are capped at realistic rack occupancy — a
  # rack holds ~50 GPU nodes shared across tenants, so a single gang
  # claiming up to 16 co-resident nodes is the realistic ceiling for
  # rack-scope placement; anything larger goes zone-scope (see
  # gpu-training-large). Still disproportionate OCC conflict impact:
  # one single-machine conflict aborts the whole proposal.
  - name: gpu-training-medium
    # ADR-0050: podsPerNode 1 — whole-machine gang, ~4% machine-share
    # (E = mean(groupSizeRange) = 12).
    weight: 18
    podsPerNode: 1
    instanceTypes: [a3-highgpu-8g]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 100, resources: { cpu: "64", memory: "256Gi", nvidia.com/gpu: "8" } }
    priorityClasses: [1000]
    interruptionPenalty: 32768
    reclamationPenalty: 65536
    meanLifetimeSeconds: 0
    sameRack: true
    groupSizeRange: [8, 16]

  # ===== GPU training: large (foundation models) =====
  # Atomic gang, very large. Rare but high-impact; a single 64-256-
  # machine gang dominates Phase 1's worst-case conflict cost. M66.2:
  # ZONE-scope co-location, not rack — no physical rack holds 64-256
  # GPU nodes (measured occupancy ~50), so real fleets place these
  # gangs within a zone/pod and rely on the fabric, which is exactly
  # what Same(zone) expresses. The previous sameRack form demanded
  # physically impossible placement and fabricated the perpetual
  # structurally-unsatisfiable gang population behind the ADR-0042
  # layer (complexity audit §3 pool 2).
  #
  # #327 (ADR-0050 follow-up): now burstOnly. At a 64-256-machine atomic
  # gang this is ~1 concurrent gang in a 5,000-machine fleet, so a
  # probabilistic weighted draw realized 0/1/2 gangs — a bimodal,
  # ~±100%-variance steady share that made the realistic machine mix
  # lumpy (ADR-0050 Consequences; bigfleet-uber #71/#72). Foundation-
  # model training is rare and bursty, so it is now modelled as an
  # OCCASIONAL BURST, not a steady-catalog archetype: a burst event (see
  # the 5k.yaml realism profile, loadProfile.bursts) injects one gang
  # mid-run, live-filled from the Speculative pool — a job arriving and
  # BigFleet provisioning its gang from spare capacity. burstOnly: true
  # keeps the full definition here (so the burst sizes its machines from
  # these resources) but excludes it from the steady draw, the steady
  # seed, AND its gang floor. weight:0 alone would NOT suffice — the
  # per-gang floor (max(groupSizeRange) × zones) is applied regardless of
  # weight, so a weight-0 gang would still seed ~768 Configured
  # machines/cluster the steady demand never asks for (a seed-vs-demand
  # mismatch → Phase 3 reclaims the seed every cycle; see the header
  # drift warning).
  - name: gpu-training-large
    # ADR-0050: podsPerNode 1 — whole-machine gang (PodsPerMachine stays
    # 1 by definition; only burstOnly changes). weight is retained for
    # documentation but is moot under burstOnly (it never enters the
    # steady draw or seed share).
    weight: 1
    burstOnly: true
    podsPerNode: 1
    instanceTypes: [a3-highgpu-8g]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 100, resources: { cpu: "128", memory: "512Gi", nvidia.com/gpu: "8" } }
    priorityClasses: [1000]
    interruptionPenalty: 65536
    reclamationPenalty: 131072
    meanLifetimeSeconds: 0
    sameZone: true
    groupSizeRange: [64, 256]

  # ===== Critical realtime =====
  # Top priority — control plane, telemetry hot path, safety-critical
  # services. Always carries strict zone-spread (HA-critical).
  - name: critical-realtime
    # ADR-0050: podsPerNode unset → global density (100). ~0.9% share
    # (the "1" slice of the 70:12:6:1 general-compute split).
    weight: 230
    instanceTypes: [c6i.4xlarge, m6i.2xlarge]
    zones: [zone-a, zone-b, zone-c]
    sizeBuckets:
      - { weight: 100, resources: { cpu: "4", memory: "8Gi" } }
    priorityClasses: [1000000]
    interruptionPenalty: 65536
    reclamationPenalty: 65536
    meanLifetimeSeconds: 0
    spreadConstraintProb: 1.0
    spreadConstraint:
      topologyKey: topology.kubernetes.io/zone
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule
