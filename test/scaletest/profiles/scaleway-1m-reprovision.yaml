# scaleway-1m-reprovision — 1M-machine fleet **reprovisioning regime**
# test on Scaleway, two shards.
#
# Aggregate-named: 2 shards × 500K seeded inventory each = 1M total
# under management. Demand sized at the **reprovisioning regime**
# (ADR-0013): 100 KWOK clusters × 10K demand each = 1M total demand,
# a 1:1 demand-to-inventory ratio. Per-shard: 500K demand × 500K
# inventory — every machine in the fleet has demand pending against
# it simultaneously. Realistic for: cluster migration, full disaster
# recovery, mass spot eviction. Steady-state operation: never.
#
# Per ADR-0013 this profile is **NOT gated on the cycle-p99 SLO**.
# The 100 ms cycle SLO is a burst-regime guarantee (see scaleway-1m
# for that shape). At 1:1 the system promises a convergence-rate
# guarantee instead: ≥5K bindings per cycle until the demand backlog
# drains. v1 doesn't yet have runner-side automated convergence-rate
# gating — operators interpret bigfleet_shard_actions_total{kind=
# "Bootstrap"} rate from the snapshot manually. Future work to wire
# the gate into pass(). Until then, runs at this profile that
# "fail" the cycle-p99 SLO are expected — what's NOT expected is
# loadgenCRsActive failing the 99.9 % sustained gate (the system
# must keep ramping toward the 1M target throughout the soak).
#
# Sized for 2× PRO2-L Kapsule (32 vCPU / 128 GiB each):
#   shards:       2 × 2 vCPU / 3 GiB                =  4 vCPU / 6 GiB
#   coordinator:  1 × default                        =  ~0.5 vCPU / 0.5 GiB
#   prometheus:   1 × 1 vCPU / 4 GiB                 =  1 vCPU / 4 GiB
#   kwok pods:    100 × 0.3 vCPU / 0.8 GiB           = 30 vCPU / 80 GiB
#                                                       (apiserver + workload split)
#   total:        ~36 vCPU req / ~91 GiB             → fits 2× PRO2-L
#                                                       (64 vCPU / 256 GiB)
#                                                       ~56 % CPU, ~36 % memory reservation
#
# PRO2-L is a separate per-zone instance-type quota counter from
# PRO2-M. Default 10/zone, so 2 fits comfortably.
#
# Provisioning:
#
#   scw k8s cluster create name=bigfleet-1m \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=2 pools.0.min-size=2 pools.0.max-size=2 \
#     region=fr-par project-id=<bigfleet-project-id>
#
# Expected cost: 2× PRO2-L × ~€0.42/hr ≈ €0.84/hr.
# A 30-min run + setup + teardown ≈ 50 min ≈ €0.70 (~$0.74).

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  # 100 clusters × 10K demand each = 1M total demand (1:1 vs the
  # 1M aggregate inventory).
  clusterCount: 100
  apiserverResources:
    requests: { cpu: 150m, memory: 500Mi }
    limits:   { cpu: 2,    memory: 3Gi }
  workloadResources:
    requests: { cpu: 150m, memory: 400Mi }
    limits:   { cpu: 2,    memory: 1500Mi }

shard:
  # 2 shards: kwok-cluster-N → bigfleet-shard-(N % 2). Each shard
  # sees ~50K demand (100K / 2) against 500K inventory — the same
  # 1:10 burst ratio M11 validated, now at 2-shard fleet scale.
  replicas: 2
  seedMachines: 500000
  maxActionsPerCycle: 1000
  executeConcurrency: 128
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 2, memory: 3Gi }
    limits:   { cpu: 6, memory: 12Gi }

coordinator:
  enabled: true
  replicas: 1

loadProfile:
  # 10K CRs per cluster × 100 clusters = 1M total demand (1:1 vs
  # the 1M aggregate inventory). Reprovisioning regime.
  target: 10000
  churnPerMinute: 0.05
  durationSeconds: 1800
  # M44 explicit opt-out: 10K Pods/cluster doesn't fit the M44
  # Pod-mode kwok floor. The reprovisioning regime is gated on
  # convergence rate, not bindingLatency, so Pod-mode adds nothing.
  mode: cr

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 4, memory: 12Gi }

costEstimate:
  vCPU: 64
  memoryGB: 256
  awsSpotUsdPerHour: 0.84
  notes: "2× Scaleway PRO2-L (32 vCPU / 128 GB each). 2 shards × 500K seeded inventory + 100 KWOK clusters × 10K demand = 1M-machine fleet at 1:1 demand-to-inventory ratio. ~$0.74 for a 50-min run end-to-end. Same shape as scaleway-5m, just one-fifth the fleet."
