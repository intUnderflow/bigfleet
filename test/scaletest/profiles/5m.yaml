# 5m — 5M machines, 500M aggregated Pods at density-100.
# 10 shards × 500K (per-shard ceiling from bigfleet.md §16).
#
# Substrate-agnostic. See 5k.yaml for the runner invocation.

apiVersion: bigfleet.io/scaletest/v1
kind: Profile

metadata:
  name: "5m"
  description: "5M machines, 500M aggregated Pods at density=100 (10 shards)."

scale:
  machines: 5000000
  density: 100

catalog:
  archetypes: realistic

seed:
  configuredFraction: 1.0
  preBindFraction: 1.0
  speculativeMultiplier: 3
  idleHeadroomFraction: 0.2

loadProfile:
  rampSeconds: 7200
  soakSeconds: 3600
  churnPerMinute: 0.02

rampBudget: 240m

slo:
  internalBindingLatencyP99Seconds: 90
  shardCycleDurationP99Seconds: 100
