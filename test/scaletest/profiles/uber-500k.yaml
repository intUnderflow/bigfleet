# uber-500k — 500K-machine fleet, 50M aggregated Pods at density=100.
#
# Production-realistic per-cluster shape mirroring scaleway-500k
# exactly (1K machines/cluster × density 100 = 100K Pods/cluster).
# Each cluster runs on its own dedicated host. 500K machines is the
# per-shard ceiling from M11.x — the largest single-shard
# configuration BigFleet can hold under the 100 ms cycle p99 SLO.
#
# Topology: 500 hosts × 1 cluster each, single shard.
#   - 500 cluster→shard streams converge on the primary's shard —
#     exercises the per-shard fan-out at its documented ceiling.
#   - Primary host: shard + coordinator + 1 kwok cluster + crossHost
#     NodePort exposure.
#   - Satellite hosts (499 of them): 1 kwok cluster each; operators
#     dial the primary's shard through an SSH/TCP tunnel.
#
# Per-host deployment: one Helm release per host. 500 hosts is a
# substantial infrastructure commitment — coordinate availability
# before kicking off. Satellite-side overrides (host N = 2..500):
#   --set shard.skip=true \
#   --set coordinator.skip=true \
#   --set shard.overrideAddr=<tunnel-endpoint:30780> \
#   --set kwok.clusterIdPrefix=h${N}-

namespace: bigfleet-scaletest

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  storage: etcd
  clusterCount: 1   # per host; 500 hosts × 1 = 500 clusters total
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 8, memory: 16Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 1
  # 600K Idle × density-100 = 60M Pod capacity vs 50M demand (20 % headroom).
  seedMachines: 600000
  seedSpeculative: 1000000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 8192
  executeConcurrency: 512
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 16, memory: 32Gi }

coordinator:
  replicas: 1

harness:
  scheduler: kube-scheduler

crossHost:
  expose: true
  shardNodePort: 30780
  coordinatorNodePort: 30790

loadProfile:
  # per-cluster; with clusterCount=1, equals per-host total. 100 000
  # per cluster × 500 hosts = 50M total CRs = 500K machines at density 100.
  target: 100000
  churnPerMinute: 0.02
  durationSeconds: 1800
  reconcilePerTickCap: 200

rampBudget: 60m

operator:
  qps: 800
  burst: 1600
  ackConcurrency: 256
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 8, memory: 32Gi }

costEstimate:
  vCPU: 16
  memoryGB: 40
  notes: "500 dedicated Uber-infra hosts (primary + 499 satellites); free at run-time. Per-host footprint above; 500× for total. M45.5: 500K machines, 50M aggregated Pods at density=100. Each cluster on its own host — per-shard ceiling from M11.x at production-realistic per-cluster shape, matching scaleway-500k exactly."
