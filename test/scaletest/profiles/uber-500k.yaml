# uber-500k — 500K-machine fleet, 50M aggregated Pods at density=100.
#
# Topology: 200 hosts × 10 kwok clusters per host = 2000 clusters
# total, single shard at per-shard ceiling. Per-cluster target 25K
# Pods × density 100 = 250 machines; 2000 clusters × 250 = 500K
# machines / 50M Pods total.
#
# Mirror of scaleway-500k's total scale, sized for Uber-infra per-
# cluster shape (4× more clusters at 1/4 the per-cluster size, since
# Uber's per-cluster kube-scheduler bind rate is ~30/sec vs Scaleway's
# ~110/sec). 500K machines is the per-shard ceiling from M11.x — the
# largest single-shard configuration BigFleet holds under the 100 ms
# cycle p99 SLO.
#
# Per-host deployment: one Helm release per host. **200 hosts is a
# substantial infrastructure commitment** — coordinate host
# availability before kicking off. Satellite-side overrides
# (host N, N = 2..200):
#   --set shard.skip=true \
#   --set coordinator.skip=true \
#   --set shard.overrideAddr=<tunnel-endpoint:30780> \
#   --set kwok.clusterIdPrefix=h${N}-
#
# Validation status: aspirational pending uber-50k SLO-pass. New
# validation surfaces: shard fan-out at 2000 streams (10× uber-50k's
# 200, 4× scaleway-500k's 500); per-shard 500K-machine ceiling on
# Uber infra under the post-ADR-0027 resource-vector engine.

namespace: bigfleet-scaletest

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  storage: etcd
  clusterCount: 10   # per host; 200 hosts × 10 = 2000 clusters total
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 8, memory: 8Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 1
  # 600K Idle × density-100 = 60M Pod capacity vs 50M demand (20 % headroom).
  # Mirrors scaleway-500k exactly — at the per-shard ceiling.
  seedMachines: 600000
  seedSpeculative: 1000000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 8192
  executeConcurrency: 512
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 16, memory: 32Gi }

coordinator:
  replicas: 1

harness:
  scheduler: kube-scheduler

crossHost:
  expose: true
  shardNodePort: 30780
  coordinatorNodePort: 30790

loadProfile:
  target: 25000   # per-cluster; 2000 clusters × 25K = 50M total CRs.
  churnPerMinute: 0.02
  durationSeconds: 3600
  reconcilePerTickCap: 200

# Regime-aware envelope (ADR-0028): this is the **scale-proof point** —
# a single shard under the realistic catalog at the per-shard 500K
# ceiling. Ramp scales linearly with total CR count vs uber-5k (100×
# CRs → 4× ramp budget; the 4× is conservative given per-cluster bind
# work is the same shape). Cycle p99 ceiling scales linearly with
# projected NeedsTable cardinality × 1.5 safety factor (~776K Needs ×
# 200 µs/Need × 1.5 ≈ 233 s). Internal binding (15 s) and ack (12 s)
# stay constant — BigFleet-property bars, not workload-property
# envelopes. Whether the burst-into-empty binding latency (bounded
# by cycle p99 ≈ 250 s) is acceptable at this scale is part of what
# this run determines; OCC's value is revisited after this data lands.
rampBudget: 240m

operator:
  qps: 800
  burst: 1600
  ackConcurrency: 256
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  # ADR-0028: workload-property envelope, scales with NeedsTable.
  shardCycleDurationP99Seconds: 250

prometheus:
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 8, memory: 32Gi }

costEstimate:
  vCPU: 80
  memoryGB: 160
  notes: "200 Uber-infra hosts (primary + 199 satellites); free at run-time. M45.5: 500K machines, 50M aggregated Pods at density=100. Per-shard ceiling from M11.x at Uber-infra per-cluster shape (2000 clusters × 25K Pods)."
