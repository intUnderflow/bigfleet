# dev-500 — smallest profile under the M45.5 naming convention.
# "500" is the machine count; ~50K aggregated Pods coalesce onto them at
# density=100 (the real K8s shape). 5 kwok clusters × 10K Pods each =
# 50K total Pods, density=100 → 500 fake-Nodes / machines.
#
# Targets a Mac M5 Max running kind. An earlier dev-5k (500K Pods) tried
# to honour the convention literally but hit kine sqlite throughput
# ceilings on the laptop (observed ~2 binds/sec fleet vs theoretical
# 250/sec ceiling) and would have taken hours to ramp. dev-500 is the
# kind-runnable cousin: same density=100 model, 10× smaller, exercises
# the M45 chain on laptop hardware in minutes.
#
# Sizing math (M5 Max kind, Docker Desktop 18 vCPU / 48 GiB cap):
#   shard:        1 × 1 vCPU / 4 GiB                = 1 vCPU / 4 GiB
#   coordinator:  1 × 500m / 1 GiB                  = 0.5 vCPU / 1 GiB
#   prometheus:   1 × 1 vCPU / 4 GiB                = 1 vCPU / 4 GiB
#   kwok pods:    5 × (500m + 500m) / (1 GiB + 1 GiB) reqs
#                                                   = 5 vCPU / 10 GiB
#   total:       ~8 vCPU req / ~19 GiB req           → fits the laptop VM
#                                                       with room to spare;
#                                                       limits stay generous
#                                                       so ramp burst can
#                                                       grow into spare CPU.

# ADR-0023: dev-500 is the canary for the kube-scheduler harness flow.
# Replaces pod-shim's Pod-binding role with a real kube-scheduler
# running inside each kwok apiserver container; pod-shim shrinks to a
# node-creator. The 102 s pod-shim bind p99 we observed in
# scaleway-5k iterations should disappear under this path because
# kube-scheduler is the production-grade binder.
harness:
  scheduler: kube-scheduler

kwok:
  clusterCount: 5
  # M45.5: storage knob exists (etcd or kine), but etcd integration
  # needs more debugging — kwok apiserver wedges with controller-runtime
  # cache.sync timeouts. Sticking with kine + _sync=OFF (default) for
  # the kind validation; cloud profiles use real K8s apiservers so the
  # backend is etcd by default there.
  # storage: etcd
  # M45.5: 10K Pods per kwok-apiserver fits etcd comfortably on
  # laptop kind. Requests match the M44 floor that historically schedules
  # cleanly. Limits stay generous so per-Pod ramp bursts don't OOM.
  apiserverResources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 4, memory: 8Gi }
  workloadResources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

# Pod-shim reconcile fan-out unchanged from binary defaults (64 / 8) —
# kine on laptop sqlite is the limiting factor, raising pod-shim
# concurrency above what kine can ingest just amplifies contention.
# Cloud profiles override these knobs.
podShim:
  # M45.5: pprof on for laptop debugging — port 8774 on each kwok pod.
  # `kubectl -n bigfleet-scaletest port-forward kwok-cluster-0 8774`
  # then `go tool pprof http://localhost:8774/debug/pprof/profile?seconds=15`.
  pprofAddr: ":8774"

shard:
  replicas: 1
  # 600 Idle × density-100 = 60K Pod capacity vs 50K demand (20 %
  # headroom). Same density math as scaleway-50k, 100× fewer machines.
  seedMachines: 600
  # ADR-0026: the elastic-procurement tier. 1800 Speculative slots
  # (3× the Idle seed) is generous slack — Phase 1 prefers the cheaper
  # owned Idle pool and only Creates from Speculative for demand that
  # drifts/fragments off the fixed Idle shapes (co-location groups,
  # rare sizeBuckets). Most of it stays as unused quota, which is the
  # realistic shape: a cloud has far more available capacity than any
  # one tenant's demand.
  seedSpeculative: 1800
  seedDensityMultiplier: 100
  maxActionsPerCycle: 4096
  executeConcurrency: 256
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 2, memory: 8Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 10000
  churnPerMinute: 0.02
  durationSeconds: 1800
  # 50 creates/sec/cluster sits near the M1/M2 kine ceiling; M5 Max
  # plausibly absorbs more. Bumping this is the first thing to try
  # if a run finishes too slowly.

# Generous ramp budget: at 50 binds/sec/cluster × 5 = 250 binds/sec
# fleet (theoretical), 50K Pods ramps in ~3 min. Observed in practice
# closer to 10-30/sec due to chain serialization (~5 cluster-apiserver
# writes per Pod through the mark→CR→Bootstrap→fake-Node→bind
# pipeline) so 30 min budget gives plenty of headroom.
rampBudget: 30m

operator:
  # M45.5: bumped from 50/100 to 200/400. The 50-QPS M44 default starves
  # the chain — pod-shim must do both "mark Unschedulable" patches AND
  # /binding RPCs out of the same client-go budget, and at 50/sec/cluster
  # the per-Pod end-to-end pipeline (5 cluster-apiserver writes) takes
  # tens of minutes to clear 50K Pods. CPU on M5 Max native-arm64 sits
  # at ~37 % at the M44 floor; the headroom is what justifies the bump.
  # Observed instantaneous bind rate jumped from ~3 binds/sec fleet to
  # ~47/sec when the new QPS landed via helm upgrade during a run.
  qps: 200
  burst: 400
  ackConcurrency: 16
  rollupInterval: 1s
  # ADR-0024: co-location comes from each sameRack archetype's real
  # podAffinity term, not an operator-wide key.

slo:
  # Loosened from cloud's 15 s: kine on laptop adds ~5-15 s of write
  # tail compared to Scaleway etcd. 30 s leaves room for kine without
  # silencing real chain regressions. operatorAckP99 is the same
  # write-path class — markAcknowledged is a status Patch per CR, so
  # kine's serial WAL fsync gives it the same tail; loosened to match
  # (the runner default of 12 s is an etcd-shaped number).
  internalBindingLatencyP99Seconds: 30
  operatorAckP99Seconds: 30
  shardCycleDurationP99Seconds: 5
  operatorRollupP99Seconds: 2

costEstimate:
  vCPU: 8
  memoryGB: 19
  awsSpotUsdPerHour: 0
  notes: "Free on M5 Max kind. M45.5: 500 machines, 50K aggregated Pods at density=100 — kind-runnable validation of the new convention. Expected wall-clock: ~5-10 min ramp + 30 min soak ≈ 40-min total run."
