# dev-5k — smallest profile under the M45.5 naming convention.
# "5k" is the machine count; ~500K aggregated Pods coalesce onto them at
# density=100 (the real K8s shape). 5 kwok clusters × 100K Pods each =
# 500K total Pods, density=100 → 5K fake-Nodes / machines.
#
# Targets a Mac M5 Max running kind. Memory fits comfortably (~50 GiB
# total kwok footprint, M5 Max has 64-128 GiB available). The bottleneck
# is kine sqlite WAL throughput inside each kwok apiserver — roughly
# 50 writes/sec/cluster on M1/M2-era hardware, faster on M5 Max but not
# measured. At ~50/sec/cluster and 3 writes per Pod-bind, 5 clusters
# stream the chain at ~83 binds/sec fleet-wide; 500K Pods then ramps in
# roughly 60-100 min. Long for iteration, but honest scale for kind.
#
# For fast iteration on chain code, override per run:
#   make scaletest PROFILE=dev-5k DURATION=10m   # short soak
#   # or run a one-off helm install with target lowered manually.
#
# Sizing math (M5 Max kind):
#   shard:        1 × 1 vCPU / 4 GiB                = 1 vCPU / 4 GiB
#   coordinator:  1 × 500m / 1 GiB                  = 0.5 vCPU / 1 GiB
#   prometheus:   1 × 1 vCPU / 4 GiB                = 1 vCPU / 4 GiB
#   kwok pods:    5 × (2 vCPU + 2 vCPU) / (4 GiB + 4 GiB) reqs
#                                                   = 20 vCPU / 40 GiB
#   total:       ~22 vCPU / ~49 GiB                  → fits an M5 Max
#                                                       Docker Desktop VM
#                                                       sized to ≥ 16 vCPU
#                                                       / 64 GiB.

kwok:
  clusterCount: 5
  # M45.5: 100K Pods per kwok-apiserver. kine in-memory plus list/
  # watch caches need ~6-8 GiB per apiserver pod.
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

# Pod-shim reconcile fan-out unchanged from binary defaults (64 / 8) —
# kine on laptop sqlite is the limiting factor, raising pod-shim
# concurrency above what kine can ingest just amplifies contention.
# Cloud profiles override these knobs.

shard:
  replicas: 1
  # 6000 Idle × density-100 = 600K Pod capacity vs 500K demand (20 %
  # headroom). Same density math as scaleway-50k, 10× fewer machines.
  seedMachines: 6000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 4096
  executeConcurrency: 256
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 2, memory: 8Gi }

coordinator:
  replicas: 1

loadProfile:
  target: 100000
  churnPerMinute: 0.02
  # 100-min ramp + 30-min soak window. Aggressive: kine on M5 Max may
  # let us do better, but the conservative budget avoids fail-fast on
  # first contact. Drop DURATION=Nm at the make-line to shorten soak
  # for iterative debug.
  durationSeconds: 1800
  # 50 creates/sec/cluster sits right at the historical M1/M2 kine
  # ceiling; M5 Max plausibly absorbs more. Bumping this is the
  # first thing to try if a run finishes too slowly.
  reconcilePerTickCap: 50

# Generous ramp budget: at 50 binds/sec/cluster × 5 = 250 binds/sec,
# 500K Pods ramps in ~33 min in the best case; kine-throttled 50 % of
# that case gives ~60-100 min. 120 min budget keeps fail-fast off the
# critical path while we measure where the real ceiling lands.
rampBudget: 120m

operator:
  qps: 50
  burst: 100
  ackConcurrency: 16
  rollupInterval: 1s
  # M37: realistic archetype catalog uses sameRack on gpu-training /
  # memory-db, so the operator translates owner-grouped CRs to
  # Same(topology.bigfleet/rack).
  coLocationKey: topology.bigfleet/rack

slo:
  # Loosened from cloud's 15 s: kine on laptop adds ~5-15 s of write
  # tail compared to Scaleway etcd. 30 s leaves room for kine without
  # silencing real chain regressions.
  internalBindingLatencyP99Seconds: 30
  shardCycleDurationP99Seconds: 5
  operatorRollupP99Seconds: 2

costEstimate:
  vCPU: 22
  memoryGB: 49
  awsSpotUsdPerHour: 0
  notes: "Free on M5 Max kind (Docker Desktop VM sized ≥16 vCPU / 64 GiB). M45.5: 5K machines, 500K aggregated Pods at density=100 — honest cloud-shape scale on a laptop. Ramp ~60-100 min depending on kine throughput; total run 90-150 min. Use cloud profiles (scaleway-50k+) for iteration; this profile validates the convention end-to-end without paying for cluster time."
