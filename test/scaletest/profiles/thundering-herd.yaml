# thundering-herd — 100 clusters that burst from 0 → 5K CRs at start,
# then drain back to 1K and churn. Stresses Phase 1 throughput, the
# operator's bulk Acknowledged status writes, and rollup coalescing
# on simultaneous reconnects.

kwok:
  clusterCount: 100

shard:
  replicas: 2
  resources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 8, memory: 16Gi }

loadProfile:
  target: 1000
  burstAtStart: 4000     # +4000 above target = 5K CRs each at peak
  churnPerMinute: 0.10
  durationSeconds: 1800
  # M44 explicit opt-out: peak 5K Pods/cluster × 100 clusters = 500K
  # Pod objects across the kwok apiservers — exceeds the M44 kine
  # budget. This profile stresses Phase 1 throughput / coalescing,
  # which is shard-side work and unaffected by Pod-mode.
  mode: cr

costEstimate:
  vCPU: 150
  memoryGB: 180
  awsSpotUsdPerHour: 8.00
  notes: "Homelab tier. Peak ~500K CRs across the fleet. ~30 min run."
