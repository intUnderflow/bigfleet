# uber-5m — 5,000,000-machine fleet, 500M aggregated Pods at density=100.
#
# Production-realistic per-cluster shape mirroring scaleway-5m exactly
# (1K machines/cluster × density 100 = 100K Pods/cluster). Each
# cluster runs on its own dedicated host. 10 shards × 500K under
# management — the per-shard ceiling from M11.x. The largest profile
# in the family; reserve for once-per-release validation.
#
# Topology: 5000 hosts × 1 cluster each, 10 shards.
#   - 5000 cluster→shard streams split 500-per-shard across 10 shards
#     by ordinal (per M12.5: cluster-N routed to shard-(N % 10)).
#   - Primary host: shard-0 + coordinator + 1 kwok cluster + crossHost
#     NodePort exposure.
#   - 9 shard hosts (one per remaining shard): each runs its shard +
#     1 kwok cluster + crossHost exposure; reaches coordinator via
#     tunnel.
#   - Other satellite hosts (4990 of them): 1 kwok cluster each;
#     operators route to their shard-(N % 10) through the appropriate
#     tunnel.
#
# Per-host deployment: one Helm release per host. 5000 hosts is the
# largest infrastructure commitment in the family; coordinate
# availability well in advance. Satellite-side override pattern is
# the same as uber-1m, generalised over 10 shards instead of 2.

namespace: bigfleet-scaletest

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  storage: etcd
  clusterCount: 1   # per host; 5000 hosts × 1 = 5000 clusters total
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 8, memory: 16Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 10   # 10 shards × 500K = 5M aggregate, per-shard ceiling from M11.x
  # 600K Idle × density-100 per shard = 60M Pod capacity per shard
  # vs 50M demand per shard (20 % headroom).
  seedMachines: 600000   # per shard
  seedSpeculative: 1000000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 8192
  executeConcurrency: 512
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 16, memory: 32Gi }

coordinator:
  replicas: 1

harness:
  scheduler: kube-scheduler

crossHost:
  expose: true
  shardNodePort: 30780
  coordinatorNodePort: 30790

loadProfile:
  # per-cluster; with clusterCount=1, equals per-host total. 100 000
  # per cluster × 5000 hosts = 500M total CRs = 5M machines at density 100.
  target: 100000
  churnPerMinute: 0.02
  durationSeconds: 3600
  reconcilePerTickCap: 200

rampBudget: 120m

operator:
  qps: 3200
  burst: 6400
  ackConcurrency: 1024
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 16, memory: 64Gi }
    limits:   { cpu: 32, memory: 128Gi }

costEstimate:
  vCPU: 16
  memoryGB: 40
  notes: "5000 dedicated Uber-infra hosts (1 primary + 9 shard hosts + 4990 satellites); free at run-time. Per-host footprint above; 5000× for total. M45.5: 5M machines, 500M aggregated Pods at density=100. 10 shards × 500K — production-realistic per-cluster shape matching scaleway-5m exactly, once-per-release exercise."
