# scaleway-5m — fleet-scale realism test, ten shards, Pod-mode.
#
# Aggregate-named: 10 shards × 500K under management each = 5M total.
# Demand: 500 kwok clusters × 1K Pods/cluster = 500K Pods through the
# full M43 chain. Inherits Pod-mode + the realistic 6-archetype
# catalog from the chart defaults.
#
# Per-shard shape mirrors scaleway-500k: 450K Configured (M29 seed)
# + 50K Idle headroom + 50K demand from 50 owned clusters. Each shard
# runs at its M11-validated 500K burst-regime ceiling while the fleet
# aggregates 5M. ADR-0013 1:10 burst regime; cycle p99 ≤ 5s gated.
#
# Sized for 16× PRO2-L Kapsule (32 vCPU / 128 GiB each):
#   shards:       10 × 2 vCPU / 3 GiB              =  20 vCPU / 30 GiB
#   coordinator:   1 × default                      =  ~1 vCPU / 1 GiB
#   prometheus:    1 × 4 vCPU / 16 GiB              =   4 vCPU / 16 GiB
#                  (5M demand → big histogram fan-out)
#   kwok pods:   500 × 1 vCPU / 2 GiB combined req  = 500 vCPU / 1 TiB
#                   (M44 Pod-mode floor)
#   total:        ~525 vCPU req / ~1050 GiB          → fits 16× PRO2-L
#                                                        (512 vCPU / 2048 GiB)
#                                                        ~quota: PRO2-L 10/zone
#                                                        default — needs quota
#                                                        bump or split across
#                                                        2 zones (8 + 8).
#
# Pre-flight: confirm PRO2-L quota in chosen zones is ≥16 (or split
# 8+8 across two zones). M12 multi-shard merged. Coordinator scrape
# gap (task #146) means coordinatorApplyOpsPerSec stays -1 in summary
# — algorithmic SLOs gate the run.
#
# Provisioning (single zone if quota allows):
#
#   scw k8s cluster create name=bigfleet-5m \
#     version=1.35.3 cni=cilium type=kapsule \
#     pools.0.name=default pools.0.node-type=PRO2-L \
#     pools.0.size=16 pools.0.min-size=16 pools.0.max-size=16 \
#     pools.0.zone=fr-par-1 \
#     region=fr-par project-id=<bigfleet-project-id>
#
# Cost: 16× PRO2-L × ~€0.42/hr ≈ €6.72/hr. ~50 min run ≈ €5.60/$6.

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: dev
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: dev
    pullPolicy: Always

kwok:
  clusterCount: 500

shard:
  replicas: 10
  seedMachines: 50000        # 50K Idle per shard, 500K aggregate
  seedConfiguredPerCluster: 9000   # M29: 450K Configured per shard, 4.5M aggregate
  maxActionsPerCycle: 1000
  executeConcurrency: 128
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 2, memory: 3Gi }
    limits:   { cpu: 6, memory: 12Gi }

coordinator:
  enabled: true
  replicas: 1

loadProfile:
  target: 1000
  churnPerMinute: 0.05
  durationSeconds: 1800

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 0s
  coLocationKey: topology.bigfleet/rack

slo:
  internalBindingLatencyP99Seconds: 5
  shardCycleDurationP99Seconds: 5

prometheus:
  # 5M-CR / 500K-Pod fan-out: histogram bucket cardinality scales
  # with kwok pod count × bucket count. 16 GiB request gives the
  # head block room.
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 8, memory: 32Gi }

costEstimate:
  vCPU: 512
  memoryGB: 2048
  awsSpotUsdPerHour: 6.72
  notes: "16× Scaleway PRO2-L (32 vCPU / 128 GB each). 10 shards × 500K under management (450K Configured + 50K Idle) = 5M aggregate; 500K Pod-mode demand through the full M43 chain. internalBindingLatency p99 ≤ 5s (ADR-0018) gated per shard. ~$6 for a 50-min run end-to-end. Watch PRO2-L zone quota."
