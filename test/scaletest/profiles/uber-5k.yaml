# uber-5k — 5K-machine fleet, 500K aggregated Pods at density=100.
#
# Topology: 2 hosts × 10 kwok clusters per host = 20 clusters total,
# single shard. Per-cluster target 25K Pods × density 100 = 250
# machines; 20 clusters × 250 = 5K machines / 500K Pods total.
#
# Per-cluster object count ~25K — comfortably under the per-cluster
# kube-scheduler write-amplification curve (where bind rate degrades
# sharply at ~30K objects/cluster). This shape validated at 96.7%
# ramp in 30 min during cross-host substrate work; this profile makes
# that shape canonical.
#
# Why not 5 clusters × 100K Pods/cluster (production-realistic
# K8s SIG-scalability cluster size): kube-scheduler at 100K
# objects/cluster binds ~25 Pods/sec regardless of host isolation
# (validated by running both single-host and dedicated-host-per-
# cluster shapes — both stuck at ~25% ramp in 15m). 100K objects/
# cluster is a steady-state production property; reaching it inside
# a test ramp budget takes hours. uber-5k tests BigFleet's ramp
# behaviour, so it sizes per-cluster demand to what kube-scheduler
# can bind in budget.
#
# Per-host deployment: one Helm release per host. Satellite-side
# overrides (the second host, prefixed h2):
#   --set shard.skip=true \
#   --set coordinator.skip=true \
#   --set shard.overrideAddr=<tunnel-endpoint:30780> \
#   --set kwok.clusterIdPrefix=h2-
#
# `loadProfile.target` is **per-cluster** CR demand; runner
# multiplies by clusterCount on each host. 25 000 per cluster × 10
# clusters/host × 2 hosts = 500K total CRs = 5K machines at
# density 100.

namespace: bigfleet-scaletest

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  storage: etcd
  clusterCount: 10   # per host; 2 hosts × 10 = 20 clusters total
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    # 8 GiB comfortably holds 25K objects/cluster (per-cluster
    # apiserver OOM threshold is ~90K on this limit).
    limits:   { cpu: 8, memory: 8Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 1
  # 6000 Idle × density-100 = 600K Pod capacity vs 500K demand (20 % headroom).
  seedMachines: 6000
  seedSpeculative: 15000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 4096
  executeConcurrency: 256
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }

coordinator:
  replicas: 1

harness:
  scheduler: kube-scheduler

crossHost:
  expose: true
  shardNodePort: 30780
  coordinatorNodePort: 30790

loadProfile:
  target: 25000   # per-cluster; 20 clusters × 25K = 500K total CRs.
  churnPerMinute: 0.02
  durationSeconds: 1800

# Uniform 60 m rampBudget across the uber-* family — the SLO is the
# SLO, and if BigFleet can't clear at this budget that's signal about
# scaling rather than a budget-tuning issue. 60 m gives ~2× #14
# demo 1's "got to 96.7 % at 30 m" time for SLO compliance margin
# (99.9 % sustained) on the smallest rung.
rampBudget: 60m

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 2, memory: 8Gi }

costEstimate:
  vCPU: 80
  memoryGB: 160
  notes: "2 Uber-infra hosts (primary + 1 satellite); free at run-time. M45.5: 5K machines, 500K aggregated Pods at density=100. 20 clusters × 25K Pods each — sized for kube-scheduler bind rate inside a 30-min ramp budget, not for K8s SIG-scalability per-cluster capacity. The 25K objects/cluster shape validated cleanly at 96.7% in cross-host substrate work; uber-50k+ will likely need scaleway-style 1:10 burst regime (lots of inventory, small demand per ramp) — addressed after this rung lands."
