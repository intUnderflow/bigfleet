# uber-5k — 5K-machine fleet, 500K aggregated Pods at density=100.
#
# Production-realistic per-cluster shape mirroring scaleway-5k exactly
# (1K machines/cluster × density 100 = 100K Pods/cluster). Each
# cluster runs on its own dedicated host — no kwok-apiserver
# co-tenancy, no etcd-disk contention, no per-host CPU sharing.
# Per-cluster shape sits inside K8s SIG-scalability's tested
# production limits (5K nodes / 150K pods / 300K containers).
#
# Topology: 5 hosts × 1 cluster each, single shard.
#   - 5 cluster→shard streams converge on the primary's shard.
#   - Primary host: shard + coordinator + 1 kwok cluster + crossHost
#     NodePort exposure.
#   - Satellite hosts (4 of them): 1 kwok cluster each, no shard, no
#     coordinator; operators dial the primary's shard through an
#     SSH/TCP tunnel.
#
# Per-host deployment: one Helm release per host with these values.
# Satellite-side overrides (host N where N = 2..5):
#   --set shard.skip=true \
#   --set coordinator.skip=true \
#   --set shard.overrideAddr=<tunnel-endpoint:30780> \
#   --set kwok.clusterIdPrefix=h${N}-
#
# `loadProfile.target` is **per-cluster** CR demand; with clusterCount=1
# the per-host total equals target. 100 000 per cluster × 5 hosts =
# 500 000 total CRs = 5K machines at density 100.

namespace: bigfleet-scaletest

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  storage: etcd
  clusterCount: 1   # per host; 5 hosts × 1 = 5 clusters total
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    # 16 GiB holds 100K-object/cluster comfortably (per-cluster
    # apiserver hit OOM at ~90K on the previous 8 GiB limit).
    limits:   { cpu: 8, memory: 16Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 1
  # 6000 Idle × density-100 = 600K Pod capacity vs 500K demand (20 % headroom).
  seedMachines: 6000
  seedSpeculative: 15000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 4096
  executeConcurrency: 256
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }

coordinator:
  replicas: 1

harness:
  scheduler: kube-scheduler

crossHost:
  expose: true
  shardNodePort: 30780
  coordinatorNodePort: 30790

loadProfile:
  target: 100000   # per-cluster; matches scaleway-5k exactly.
  churnPerMinute: 0.02
  durationSeconds: 1800
  reconcilePerTickCap: 200

rampBudget: 15m

operator:
  qps: 200
  burst: 400
  ackConcurrency: 64
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits:   { cpu: 2, memory: 8Gi }

costEstimate:
  # Per-host. 5 hosts × this footprint.
  vCPU: 16
  memoryGB: 40
  notes: "5 dedicated Uber-infra hosts (primary + 4 satellites); free at run-time. M45.5: 5K machines, 500K aggregated Pods at density=100. Each cluster on its own host — production-realistic per-cluster shape matching scaleway-5k exactly."
