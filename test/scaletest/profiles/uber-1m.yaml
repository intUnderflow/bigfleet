# uber-1m — 1,000,000-machine fleet, 100M aggregated Pods at density=100.
#
# Topology: 400 hosts × 10 kwok clusters per host = 4000 clusters
# total, 2 shards × 500K each (per-shard ceiling from M11.x).
# Per-cluster target 25K Pods × density 100 = 250 machines;
# 4000 clusters × 250 = 1M machines / 100M Pods total. Aggregate-
# named: `shard.replicas: 2` reflects how we test, not what the name
# reports.
#
# Mirror of scaleway-1m's total scale, sized for Uber-infra per-
# cluster shape. Where scaleway-1m uses 1000 clusters × 100K Pods on
# PRO2-L Kapsule, uber-1m uses 4000 clusters × 25K Pods on Uber hosts
# — 4× more clusters at 1/4 the per-cluster size to fit the same
# 75-min budget on Uber's per-cluster bind throughput.
#
# Per-host deployment: one Helm release per host. **400 hosts is a
# meaningful infrastructure commitment** — coordinate host
# availability well in advance. Satellite-side overrides for the
# cluster-only hosts (N = 3..400):
#   --set shard.skip=true \
#   --set coordinator.skip=true \
#   --set shard.overrideAddr=<shard-(N%2)-tunnel-endpoint:30780> \
#   --set kwok.clusterIdPrefix=h${N}-
# Shard-1 host's overrides (host 2):
#   --set shard.skip=false \
#   --set coordinator.skip=true \
#   --set shard.overrideId=shard-1 \
#   --set shard.overrideAdvertise=<host-2-tunnel-endpoint:7780> \
#   --set coordinator.overrideAddr=<primary-tunnel-endpoint:30790> \
#   --set kwok.clusterIdPrefix=h2-
#
# Validation status: aspirational pending uber-500k SLO-pass.
# Validates: M12 multi-shard architecture on Uber infra at meaningful
# scale (scaleway-1m's M13.gate was the pre-ADR-0027 reference; this
# is the post-ADR-0027 mirror with Uber-shaped per-cluster size).

namespace: bigfleet-scaletest

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  storage: etcd
  clusterCount: 10   # per host; 400 hosts × 10 = 4000 clusters total
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 8, memory: 8Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 2   # 2 shards × 500K = 1M aggregate, per-shard ceiling from M11.x
  # 600K Idle × density-100 per shard = 60M Pod capacity per shard
  # vs 50M demand per shard (20 % headroom). Matches scaleway-1m.
  seedMachines: 600000   # per shard
  seedSpeculative: 1000000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 8192
  executeConcurrency: 512
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 16, memory: 32Gi }

coordinator:
  replicas: 1

harness:
  scheduler: kube-scheduler

crossHost:
  expose: true
  shardNodePort: 30780
  coordinatorNodePort: 30790

loadProfile:
  target: 25000   # per-cluster; 4000 clusters × 25K = 100M total CRs.
  churnPerMinute: 0.02
  durationSeconds: 3600

# Uniform 60 m rampBudget across the uber-* family — the SLO is the
# SLO, and if BigFleet can't clear at this budget that's signal about
# scaling rather than a budget-tuning issue. Per-cluster bind work is
# the same as uber-5k (25K binds at ~30/sec ≈ 14 min); what's new at
# this scale is 2000 cluster→shard streams per shard. If that fans
# out cleanly, 60 m clears. If not, the data tells us where the
# shard's fan-out wall is.
rampBudget: 60m

operator:
  qps: 1600
  burst: 3200
  ackConcurrency: 512
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 8, memory: 32Gi }
    limits:   { cpu: 16, memory: 64Gi }

costEstimate:
  vCPU: 80
  memoryGB: 160
  notes: "400 Uber-infra hosts (1 primary + 1 shard-1 host + 398 satellites); free at run-time. M45.5: 1M machines, 100M aggregated Pods at density=100. 2 shards × 500K — Uber-infra mirror of scaleway-1m at Uber-shaped per-cluster size."
