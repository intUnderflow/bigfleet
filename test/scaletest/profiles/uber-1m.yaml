# uber-1m — 1,000,000-machine fleet, 100M aggregated Pods at density=100.
#
# Production-realistic per-cluster shape mirroring scaleway-1m exactly
# (1K machines/cluster × density 100 = 100K Pods/cluster). Each
# cluster runs on its own dedicated host. 2 shards × 500K under
# management — the per-shard ceiling from M11.x. Aggregate-named:
# `shard.replicas: 2` reflects how we test, not what the name reports.
#
# Topology: 1000 hosts × 1 cluster each, 2 shards.
#   - 1000 cluster→shard streams split 500/500 across shards by
#     ordinal (per M12.5: cluster-N routed to shard-(N % 2)).
#   - Primary host: shard-0 + coordinator + 1 kwok cluster + crossHost
#     NodePort exposure for both shard-0 and the coordinator.
#   - Shard-1 host: shard-1 + 1 kwok cluster + crossHost NodePort
#     exposure for shard-1; reaches coordinator via tunnel.
#   - Other satellite hosts (998 of them): 1 kwok cluster each;
#     operators route to shard-0 or shard-1 by their cluster ordinal,
#     through an SSH/TCP tunnel to the appropriate shard host.
#
# Per-host deployment: one Helm release per host. Satellite-side
# overrides for the 998 cluster-only hosts (N = 3..1000):
#   --set shard.skip=true \
#   --set coordinator.skip=true \
#   --set shard.overrideAddr=<shard-N%2-tunnel-endpoint:30780> \
#   --set kwok.clusterIdPrefix=h${N}-
# Shard-1 host's overrides (host 2):
#   --set shard.skip=false \
#   --set coordinator.skip=true \
#   --set shard.overrideId=shard-1 \
#   --set shard.overrideAdvertise=<host-2-tunnel-endpoint:7780> \
#   --set coordinator.overrideAddr=<primary-tunnel-endpoint:30790> \
#   --set kwok.clusterIdPrefix=h2-

namespace: bigfleet-scaletest

image:
  repository: ghcr.io/intunderflow/bigfleet-scaletest
  tag: main
  pullPolicy: Always

bigfleet:
  image:
    repository: ghcr.io/intunderflow/bigfleet
    tag: main
    pullPolicy: Always

kwok:
  storage: etcd
  clusterCount: 1   # per host; 1000 hosts × 1 = 1000 clusters total
  apiserverResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 8, memory: 16Gi }
  workloadResources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { cpu: 4, memory: 8Gi }
  sharedVolumeSizeLimit: "2Gi"

podShim:
  binderConcurrency: 256
  upcomingNodeConcurrency: 32

shard:
  replicas: 2   # 2 shards × 500K = 1M aggregate, per-shard ceiling from M11.x
  # 600K Idle × density-100 per shard = 60M Pod capacity per shard vs
  # 50M demand per shard (20 % headroom).
  seedMachines: 600000   # per shard
  seedSpeculative: 1000000
  seedDensityMultiplier: 100
  maxActionsPerCycle: 8192
  executeConcurrency: 512
  incrementalReconcile: true
  metricsWarmupCycles: 5
  resources:
    requests: { cpu: 4, memory: 16Gi }
    limits:   { cpu: 16, memory: 32Gi }

coordinator:
  replicas: 1

harness:
  scheduler: kube-scheduler

crossHost:
  expose: true
  shardNodePort: 30780
  coordinatorNodePort: 30790

loadProfile:
  # per-cluster; with clusterCount=1, equals per-host total. 100 000
  # per cluster × 1000 hosts = 100M total CRs = 1M machines at density 100.
  target: 100000
  churnPerMinute: 0.02
  durationSeconds: 1800
  reconcilePerTickCap: 200

rampBudget: 90m

operator:
  qps: 1600
  burst: 3200
  ackConcurrency: 512
  rollupInterval: 1s

slo:
  internalBindingLatencyP99Seconds: 15
  shardCycleDurationP99Seconds: 5

prometheus:
  resources:
    requests: { cpu: 8, memory: 32Gi }
    limits:   { cpu: 16, memory: 64Gi }

costEstimate:
  vCPU: 16
  memoryGB: 40
  notes: "1000 dedicated Uber-infra hosts (1 primary + 1 shard-1 + 998 satellites); free at run-time. Per-host footprint above; 1000× for total. M45.5: 1M machines, 100M aggregated Pods at density=100. 2 shards × 500K — production-realistic per-cluster shape matching scaleway-1m exactly."
