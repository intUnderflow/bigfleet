# dev-50 — the fast per-milestone laptop integration gate, V2 format
# (substrate-agnostic, ADR-0034) with the realistic-dev coverage
# catalog (M59).
#
# History, for the archaeology: the catalog gate was built as
# dev-50-v2 (M59) and PARKED on its first day — its live fills stalled
# at ~96 % while Phase 3 reclaimed machines under pending demand. That
# was a real engine gap (gross-Allocatable crediting / dual
# attribution), fixed by M67 / ADR-0045: capacity counts for a cluster
# iff it is bound, Phase 3 is shrinkage-only and inert at steady
# demand. M77a swapped this profile in as the single gate and
# redefined the runner's steady-state gate around that contract.
#
# Invocation (the gate pairing is the kind laptop substrate; both are
# the `make scaletest` defaults):
#
#   make scaletest PROFILE=dev-50 SUBSTRATE=example-kind-laptop DURATION=3m
#
# Purpose: prove the *real* Pod-mode chain wires up end to end —
#   Pod → kube-scheduler marks Unschedulable → unschedulable-pod-
#   controller → CapacityRequest → operator roll-up → shard NeedsTable
#   → Phase 1/2/3 → provider → Bootstrap → fake-Node → kube-scheduler
#   binds the Pod —
# and, since M59, that the CATALOG demand path works at gate speed:
# archetype draws, sub-machine folding (ADR-0041), Same(rack) and
# Same(zone) gangs, gang anchoring. The realistic-dev catalog exists
# for exactly this (see its header): same archetype names and shapes
# as realistic.yaml, gang sizes proportionate to a 50-machine fleet,
# weights flattened so every path is drawn every run.
#
# What the runner gates on (M77a / ADR-0045 — BigFleet promises demand
# covered by bound capacity, NOT pod placement):
#   - steady state = shard shortfalls == 0 with demand at target and
#     acquisitions quiescent (waitForSteadyStateV2);
#   - zero Reclaim actions across the steady window (Phase 3 inert at
#     steady demand — the M67 contract);
#   - the ADR-0035 steady-state SLOs below.
# Pod-bind progress is reported throughout but never gated: satisfied-
# but-stuck is the cluster's problem (ADR-0045 §4).
#
# This is a correctness gate, not a scale test and not a realism
# instrument: no measurement taken here feeds a mechanism decision
# (ADR-0043 — that is the cloud profiles' job, on realistic.yaml).
#
# Seed: Configured-hosted fill with preBind, the ADR-0035 posture the
# cloud profiles use — the gate's job is chain wiring + the churn →
# controller-recreate → re-bind path the SLOs measure; the fill is
# setup tax, not the subject (live-fill mechanism classes climb to the
# cloud profiles, see docs/scaletest.md). Idle 1.2× / Speculative 5×
# keep an acquisition pool for churn and bursts, drawn from the same
# catalog as demand (ADR-0044 effective-machine sizing).

apiVersion: bigfleet.io/scaletest/v1
kind: Profile

metadata:
  name: "dev-50"
  description: "Laptop kind integration gate: 50 machines, 5K Pods at density=100, catalog/gang/fold coverage."

scale:
  machines: 50
  density: 100

catalog:
  archetypes: realistic-dev

seed:
  configuredFraction: 1.0
  preBind: true
  speculativeMultiplier: 5
  idleHeadroomFraction: 1.2

loadProfile:
  # 5,000 Pods over 300s = 16.7 binds/s demand vs the kind substrate's
  # declared 2 × 15/s supply.
  rampSeconds: 300
  # Short soak: correctness gate. The runner sizes its SLO rate
  # windows to the soak (M60 sloWindow).
  soakSeconds: 180
  # Fraction of target per minute: 0.024 × 2,500/cluster = 1 evict/s
  # per cluster, the evict → controller-recreate → re-bind loop the
  # bind-latency SLO measures.
  churnPerMinute: 0.024

rampBudget: 10m

slo:
  # Laptop-loosened posture inherited from the legacy gate; tighten
  # toward runner defaults once the V2 gate has green baselines.
  internalBindingLatencyP99Seconds: 30
  operatorAckP99Seconds: 30
  shardCycleDurationP99Seconds: 5
  operatorRollupP99Seconds: 2
