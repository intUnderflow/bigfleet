# preemption-5k — Phase-2 preemption (engine-correctness).
#
# A near-zero-headroom fleet of LOW-priority incumbents, then a HIGH-priority
# burst arrives that can ONLY bind by preempting them. This is the Phase-2
# path: a higher-priority Need that no Idle/Speculative machine can satisfy
# drives the engine to drain (Preempt) a Configured machine held by a
# lower-priority workload and hand it to the preemptor
# (pkg/decision/phase2_inversions.go, ActionKindPreempt).
#
# VALIDATED CONSTRUCTION (bigfleet-uber #89, run 2026-06-20-inverted-gates-5k):
# the original `configuredFraction 1.0` construction did NOT work — the
# realistic catalog's per-zone gang floor over-seeds the configured pool to
# ~5140 machines vs ~4147 natural bound demand, leaving ~993 idle headroom a
# burst binds into WITHOUT preempting. The "zero headroom" it assumed did not
# exist. The construction below was hand-validated to drive 845 Phase-2
# preempts with the high-priority burst fully satisfied (critical shortfall 0)
# and the residual confined to the displaced lower tiers:
#
#   - seed.speculativeCount ≈ natural bound demand (NOT speculativeMultiplier:
#     that is integer-only, 1×machinesEffective overshoots demand and
#     reintroduces headroom). The elastic pool IS the supply; the incumbents
#     provision from it (Phase 1: Speculative → Configured), leaving near-zero
#     spare. speculativeCount is the new absolute per-shard seed knob.
#   - configuredFraction 0 + idleHeadroomFraction 0 — no pre-bound configured
#     seed, no idle buffer. The only supply is the demand-sized elastic pool.
#   - preBind false — the fill binds through the REAL capacity path
#     (Unschedulable → UPC → CapacityRequest → engine provisions from the
#     Speculative pool), so the pool is genuinely the supply ceiling. (preBind
#     true fast-binds to fake-Nodes and bypasses that path.)
#
# THE BURST: critical-realtime (priorityClasses [1000000], the catalog top vs
# the incumbents' 100). A TRANSIENT burst (held, then drains) of open-loop
# high-priority demand that exceeds the tiny headroom — the engine must
# preempt priority-100 incumbents to place it. Transient (not held-to-end) so
# the end-of-soak sample lands AFTER the burst drains: critical demand is gone,
# so a residual shortfall there would mean the burst was never satisfied.
#
# BURST TIMING (⚠ confirm on the runner): the burst must fire AFTER the fleet
# has filled. With preBind=false the fill goes through the slow capacity path;
# the hand-deploy needed ~1800s. atSeconds below is set conservatively
# post-fill, but the exact fill time at uber-5k is the one empirical unknown —
# a runner-path run must confirm the burst lands post-fill (else it binds into
# the still-filling pool and never preempts). Tune atSeconds to the measured
# fill time if needed. (A burst-anchored-to-fill-complete signal would remove
# this fragility — tracked as a separate harness improvement.)
#
# SLO POSTURE — THE INVERSION: the run PASSES only if the engine actually
# preempted:
#   - expectPreemptions: true — asserts bigfleet_shard_actions_total
#     {kind="Preempt"} > 0 (the counter EXISTS as an engine metric).
#   - shardShortfalls == 0 (the default, UN-inverted) is the "burst ends
#     satisfied" assertion — checked after the burst drains.

apiVersion: bigfleet.io/scaletest/v1
kind: Profile

metadata:
  name: "preemption-5k"
  description: "Phase-2 preemption: near-zero-headroom low-priority fleet (elastic pool sized to demand), transient high-priority burst forces Preempt (uber-5k, validated bigfleet-uber #89)."

scale:
  machines: 5000
  density: 100

catalog:
  archetypes: realistic

seed:
  # Near-zero headroom: the elastic pool is sized to ≈ natural bound demand
  # (~4147 machines + a tiny margin), so the incumbents consume essentially
  # all of it and a high-priority burst must Preempt to bind. 4300 reproduces
  # the #89-validated construction. NO configured/idle seed.
  configuredFraction: 0
  speculativeCount: 4300
  idleHeadroomFraction: 0
  preBind: false

loadProfile:
  rampSeconds: 1800
  # Long enough to cover the post-fill burst + its 600s life + drain +
  # ~10 min observe of the settled, burst-satisfied fleet.
  soakSeconds: 2400
  churnPerMinute: 0.02
  # HIGH-priority transient burst against the near-zero-headroom fleet.
  # extraTarget 1500/cluster (the #89-validated slug) exceeds the headroom so
  # binding it requires preempting the priority-100 incumbents. atSeconds is
  # post-fill (see BURST TIMING above — confirm on the runner). durationSeconds
  # 600 = transient (drains before the end-of-soak satisfied-check).
  bursts:
    - atSeconds: 2400
      archetype: critical-realtime
      extraTarget: 1500
      durationSeconds: 600
      selectivity: 1.0

rampBudget: 60m

slo:
  # THE INVERSION: the engine must actually preempt.
  expectPreemptions: true
  # Shortfall gate NOT inverted: after the burst drains the fleet must be back
  # to satisfied, so the default shardShortfalls == 0 holds at end of soak.
  # ADR-0054 capacity-delivery gates — must hold across the preemption.
  shardCycleDurationP99Seconds: 5
  shardConfigurePhaseP99Seconds: 15
  bootstrapSuccessRatio: 0.99
  operatorNodeStateUpdateP99Seconds: 1.5
  endToEndPodBindP50Seconds: 10
