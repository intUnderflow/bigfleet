# failover-soak — combined belt-and-braces static-stability regression.
#
# Ported to the BYO profileV2 contract (ADR-0034): the realistic.yaml catalog
# + ADR-0054 gates, on a TWO-shard deploy (topology.shardReplicas: 2). A
# longer 60-min soak with three disturbances — two coordinator-leader-kills
# (t=600s, t=1200s) and one shard-pod-kill (t=1800s). Each runnerAction has an
# asserted outcome in scaletest-runner; the run fails if any assertion misses
# or if the SLO gates breach across the disturbances. Use for one belt-and-
# braces failover regression before a release; for targeted dev regressions
# the dedicated single-disturbance profiles are faster and cheaper:
#
#   failover-leader-kill.yaml  — single coordinator kill, single shard
#   failover-shard-kill.yaml   — single shard pod kill, 2 shards
#   failover-partition.yaml    — coordinator↔shard partition, 2 shards

apiVersion: bigfleet.io/scaletest/v1
kind: Profile

metadata:
  name: "failover-soak"
  description: "Belt-and-braces static-stability regression: 2 leader-kills + 1 shard-kill over a 60-min realistic soak."

scale:
  machines: 5000
  density: 100

catalog:
  archetypes: realistic

seed:
  configuredFraction: 1.0
  preBind: true
  speculativeMultiplier: 3
  idleHeadroomFraction: 0.2

loadProfile:
  rampSeconds: 1800
  soakSeconds: 3600
  churnPerMinute: 0.02

rampBudget: 60m

topology:
  shardReplicas: 2

runnerActions:
  - atSeconds: 600
    action: kill-coordinator-leader
  - atSeconds: 1200
    action: kill-coordinator-leader
  - atSeconds: 1800
    action: kill-shard-bigfleet-shard-1

slo:
  shardCycleDurationP99Seconds: 5
  shardConfigurePhaseP99Seconds: 15
  bootstrapSuccessRatio: 0.99
  operatorNodeStateUpdateP99Seconds: 1.5
  endToEndPodBindP50Seconds: 10
