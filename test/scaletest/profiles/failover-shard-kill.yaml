# failover-shard-kill — static-stability regression for a shard pod restart.
#
# Ported to the BYO profileV2 contract (ADR-0034): the realistic.yaml catalog
# + ADR-0054 gates, on a TWO-shard deploy (topology.shardReplicas: 2). The
# size-derived shard count is 1 for any realistic profile (perShardMachineCeiling
# = 500k), so the explicit override is what stands up the second shard. Clusters
# fan across the two shards (N % 2). At t=600s the runner deletes bigfleet-shard-1;
# the runnerAction asserts the StatefulSet reschedules it and it resumes
# publishing cycle metrics within the query window, AND the surviving shard
# (bigfleet-shard-0) holds its SLOs throughout — operator-to-shard binding
# survives the restart and reconnects to the same ordinal.

apiVersion: bigfleet.io/scaletest/v1
kind: Profile

metadata:
  name: "failover-shard-kill"
  description: "Static-stability regression: shard pod kill on a 2-shard realistic deploy."

scale:
  machines: 5000
  density: 100

catalog:
  archetypes: realistic

seed:
  configuredFraction: 1.0
  preBind: true
  speculativeMultiplier: 3
  idleHeadroomFraction: 0.2

loadProfile:
  rampSeconds: 1800
  soakSeconds: 1200
  churnPerMinute: 0.02

rampBudget: 60m

# Two shards so killing ordinal 1 leaves ordinal 0 serving (the actual
# static-stability check: the survivor keeps its SLOs while shard-1 restarts).
topology:
  shardReplicas: 2

runnerActions:
  - atSeconds: 600
    action: kill-shard-bigfleet-shard-1

slo:
  shardCycleDurationP99Seconds: 5
  shardConfigurePhaseP99Seconds: 15
  bootstrapSuccessRatio: 0.99
  operatorNodeStateUpdateP99Seconds: 1.5
  endToEndPodBindP50Seconds: 10
