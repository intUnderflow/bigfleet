# reclaim-cycle — scale-down / Phase-3-reclaim drill (depth campaign).
#
# The inverse of the steady-state soak. At t=600s into the soak the
# load-driver sheds half its demand (loadProfile.scaleDowns: a SUSTAINED
# drop to Target×0.5 — steady workload objects are deleted and not
# refilled). The shard's roll-up then sees ~half the needs, so Phase 3
# reclaims the now-excess Configured machines (paper §13 scale-down:
# CR GC'd → fewer needs → Phase 3 reclaims → per-CapacityType idle hold /
# Delete, ADR-0049).
#
# SPECULATIVE QUOTA TRACKS DEMAND DOWN (Run-1 fix): the same scale-down
# also right-sizes the shard's Speculative (elastic-procurement burst)
# quota — the runner derives a speculative-shed from this scaleDowns block
# (same atSeconds + targetMultiplier) and the shard sheds that fraction of
# its Speculative pool when demand drops. Without it the pool stayed seeded
# at its PRE-shed peak (speculativeMultiplier × machines, sized to PRE-shed
# demand), ~1/targetMultiplier× oversized after the halving; the over-sized
# pool fed a sustained post-shed reclaim floor ~3× the pre-shed floor that
# made the reclaim count window-sensitive. A real fleet right-sizes burst
# quota to its current footprint (ADR-0026); holding the fixed peak pool is
# the ADR-0043 fabricated-demand trap. Pure harness supply bookkeeping on
# the fake provider — NOT an engine change (the engine never sizes the
# Speculative pool; it treats whatever exists as available supply).
#
# SLO POSTURE — THE INVERSION: the steady-state gate asserts Phase 3 is
# INERT (maxReclaimActionsDuringSoak ~0, the M67 oscillation guard). Here
# reclaim is the EXPECTED, healthy outcome, so maxReclaimActionsDuringSoak
# is set GENEROUS — sized to a half-fleet reclaim of a ~5,000-machine
# fleet (~2,500 machines shed → ~thousands of reclaim actions) plus churn
# margin. The bound still catches PATHOLOGICAL runaway (oscillation would
# drive reclaim well past the fleet size); it just doesn't fail the drill
# for doing exactly what it is designed to do. The remaining ADR-0054
# capacity-delivery gates MUST still hold — reclaim is normal Phase 3 work,
# not an SLO violation. Conservation / no-over-reclaim / no-oscillation are
# read from the Phase-3 action counts + the demand/inventory time-series by
# the operator, not a single threshold. With the Speculative-tracks-demand
# fix the post-shed reclaim floor now scales with the REDUCED demand (no
# fixed-peak-pool re-buy churn), so the measured count is no longer
# window-sensitive; the generous bound is unchanged pending a re-measure.

apiVersion: bigfleet.io/scaletest/v1
kind: Profile

metadata:
  name: "reclaim-cycle"
  description: "Scale-down/reclaim drill: shed half the demand mid-soak and assert Phase 3 reclaims the excess cleanly (realistic uber-5k shape)."

scale:
  machines: 5000
  density: 100

catalog:
  archetypes: realistic

seed:
  configuredFraction: 1.0
  preBind: true
  speculativeMultiplier: 3
  idleHeadroomFraction: 0.2

loadProfile:
  rampSeconds: 1800
  # 40-min soak: drop fires 10 min in, leaving ~30 min to watch Phase 3
  # reclaim the excess down and settle (no oscillation).
  soakSeconds: 2400
  churnPerMinute: 0.02
  # Sustained demand drop to 50% of target, 10 min into the soak.
  scaleDowns:
    - atSeconds: 600
      targetMultiplier: 0.5

rampBudget: 60m

slo:
  # Reclaim is EXPECTED here — generous bound (≈ the half-fleet shed of a
  # 5,000-machine fleet + churn margin); still catches runaway oscillation.
  maxReclaimActionsDuringSoak: 6000
  # ADR-0054 capacity-delivery gates — must hold across the scale-down.
  shardCycleDurationP99Seconds: 5
  shardConfigurePhaseP99Seconds: 15
  bootstrapSuccessRatio: 0.99
  operatorNodeStateUpdateP99Seconds: 1.5
  endToEndPodBindP50Seconds: 10
