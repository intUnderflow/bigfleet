        cpu: '2'
        memory: 16Gi
    priorityClasses:
    - 1000
    interruptionPenalty: 4096
    reclamationPenalty: 16384
    meanLifetimeSeconds: 0
    sameRack: true
    allowPartial: true
    groupSizeRange:
    - 3
    - 5
