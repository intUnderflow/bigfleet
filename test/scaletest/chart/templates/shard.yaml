# M12: shard runs as a StatefulSet with stable per-pod DNS via the
# `bigfleet-shard-headless` Service. kwok-cluster pods derive their
# shard endpoint as `bigfleet-shard-(N % shard.replicas)` from
# POD_NAME so cluster→shard binding survives a rollout-restart.
apiVersion: v1
kind: Service
metadata:
  name: bigfleet-shard-headless
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
    app.kubernetes.io/component: shard
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: shard
    app.kubernetes.io/part-of: bigfleet-scaletest
  ports:
    - { name: grpc,    port: 7780, targetPort: grpc }
    - { name: metrics, port: 8780, targetPort: metrics }
---
apiVersion: v1
kind: Service
metadata:
  name: bigfleet-shard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
    app.kubernetes.io/component: shard
spec:
  selector:
    app.kubernetes.io/component: shard
    app.kubernetes.io/part-of: bigfleet-scaletest
  ports:
    - { name: grpc,    port: 7780, targetPort: grpc }
    - { name: metrics, port: 8780, targetPort: metrics }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bigfleet-shard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
    app.kubernetes.io/component: shard
spec:
  serviceName: bigfleet-shard-headless
  replicas: {{ .Values.shard.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/component: shard
      app.kubernetes.io/part-of: bigfleet-scaletest
  template:
    metadata:
      labels:
        {{- include "scaletest.labels" . | nindent 8 }}
        app.kubernetes.io/component: shard
    spec:
      containers:
        - name: shard
          image: "{{ .Values.bigfleet.image.repository }}:{{ .Values.bigfleet.image.tag }}"
          imagePullPolicy: {{ .Values.bigfleet.image.pullPolicy }}
          args:
            - shard
            - --listen=:7780
            - --metrics-addr=:8780
            - --id=$(POD_NAME)
            - --data-dir=/var/lib/bigfleet
            - --advertise-addr=$(POD_NAME).bigfleet-shard-headless.{{ .Values.namespace }}.svc:7780
            {{- if .Values.coordinator.enabled }}
            - --coordinator-addr=bigfleet-coordinator.{{ .Values.namespace }}.svc:7790
            {{- end }}
            - --seed-machines={{ .Values.shard.seedMachines | default 0 }}
            {{- if .Values.shard.seedConfiguredPerCluster }}
            - --seed-configured-per-cluster={{ .Values.shard.seedConfiguredPerCluster }}
            - --seed-cluster-total={{ .Values.kwok.clusterCount | default 0 }}
            - --seed-cluster-stride={{ .Values.shard.replicas | default 1 }}
            {{- if .Values.loadProfile.archetypes }}
            - --archetypes=/etc/loadgen/profile.yaml
            {{- end }}
            {{- end }}
            - --max-actions-per-cycle={{ .Values.shard.maxActionsPerCycle | default 0 }}
            - --execute-concurrency={{ .Values.shard.executeConcurrency | default 1 }}
            {{- if .Values.shard.localBootstrap }}
            - --local-bootstrap
            {{- end }}
            {{- if .Values.shard.incrementalReconcile }}
            - --incremental-reconcile
            {{- end }}
            {{- if .Values.shard.availableCapacityInterval }}
            - --available-capacity-interval={{ .Values.shard.availableCapacityInterval }}
            {{- end }}
            {{- if .Values.shard.metricsWarmupCycles }}
            - --metrics-warmup-cycles={{ .Values.shard.metricsWarmupCycles }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { name: grpc,    containerPort: 7780 }
            - { name: metrics, containerPort: 8780 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/bigfleet }
            {{- if .Values.loadProfile.archetypes }}
            - { name: loadgen, mountPath: /etc/loadgen, readOnly: true }
            {{- end }}
          resources:
            {{- toYaml .Values.shard.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
        {{- if .Values.loadProfile.archetypes }}
        # M31: shard reads the archetype catalog from the same
        # ConfigMap the load-driver uses, so demand and Configured
        # seed describe the same fleet shape. Mounting the same
        # CM ensures the catalog can never drift between the two.
        - name: loadgen
          configMap:
            name: kwok-load-profile
        {{- end }}
