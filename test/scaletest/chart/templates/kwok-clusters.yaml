{{/*
N replicas of the harness pod. Each pod runs ONE simulated KWOK
cluster split across two containers that share the pod's network
namespace and an emptyDir at /var/scaletest:

  - apiserver:  kine + kube-apiserver + kwok-controller
  - workload:   bigfleet-operator + load-driver

Splitting the bundle into two containers gives each side its own
cgroup CPU budget. The pre-split design pinned the apiserver+kine
under the same 1-core limit as the operator+load-driver, and the
operator-side write fan-in (CR ack writes, AC upserts, NodeStateUpdate
upserts) starved the apiserver. This was the dominant tail in the
M11.24a cloud run.

Coordination: the apiserver container writes the kubeconfig +
admin certs to the shared volume and touches `apiserver-ready` once
serving; the workload container blocks on that file before starting
operator/load-driver.

Deployment vs StatefulSet: still Deployment — POD_NAME provides a
unique cluster ID per replica and state is scrubbed on restart.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kwok-load-profile
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
data:
  profile.yaml: |
    {{- toYaml .Values.loadProfile | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwok-cluster
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
    app.kubernetes.io/component: kwok-cluster
spec:
  replicas: {{ .Values.kwok.clusterCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: kwok-cluster
      app.kubernetes.io/part-of: bigfleet-scaletest
  template:
    metadata:
      labels:
        {{- include "scaletest.labels" . | nindent 8 }}
        app.kubernetes.io/component: kwok-cluster
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8770"
    spec:
      containers:
        - name: apiserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint-apiserver.sh"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: shared, mountPath: /var/scaletest }
          resources:
            {{- toYaml .Values.kwok.apiserverResources | nindent 12 }}
        - name: workload
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint-workload.sh"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: BIGFLEET_SHARD_ADDR
              value: {{ include "scaletest.shardAddr" . | quote }}
            - name: LOAD_PROFILE
              value: /etc/loadgen/profile.yaml
            - name: OPERATOR_QPS
              value: "{{ .Values.operator.qps }}"
            - name: OPERATOR_BURST
              value: "{{ .Values.operator.burst }}"
            - name: OPERATOR_ACK_CONCURRENCY
              value: "{{ .Values.operator.ackConcurrency }}"
            - name: OPERATOR_ROLLUP_INTERVAL
              value: "{{ .Values.operator.rollupInterval }}"
          ports:
            - { name: operator-met, containerPort: 8770 }
            - { name: loadgen-met,  containerPort: 8771 }
          volumeMounts:
            - { name: profile, mountPath: /etc/loadgen, readOnly: true }
            - { name: shared,  mountPath: /var/scaletest }
          resources:
            {{- toYaml .Values.kwok.workloadResources | nindent 12 }}
      volumes:
        - name: profile
          configMap:
            name: kwok-load-profile
        - name: shared
          # tmpfs (RAM-backed) emptyDir so kine's sqlite WAL fsyncs
          # land in memory rather than the node's local disk. The
          # per-cluster apiserver is the long-pole when load-driver
          # ramps; disk-backed kine produced 4.6s ack p99 at 155
          # CR/sec/fleet (M11.24a + snap-walk-removal cloud run).
          # Memory cost: sized to 512Mi per pod; 50 pods × 512Mi =
          # 25 GiB cluster-wide on a 320 GB Kapsule, fine.
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.kwok.sharedVolumeSizeLimit | default "512Mi" }}
