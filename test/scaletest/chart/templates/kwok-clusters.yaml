{{/*
N replicas of the harness pod. Each pod runs ONE simulated KWOK
cluster split across two containers that share the pod's network
namespace and an emptyDir at /var/scaletest:

  - apiserver:  kine + kube-apiserver + kwok-controller
  - workload:   bigfleet-operator + load-driver

Splitting the bundle into two containers gives each side its own
cgroup CPU budget. The pre-split design pinned the apiserver+kine
under the same 1-core limit as the operator+load-driver, and the
operator-side write fan-in (CR ack writes, AC upserts, NodeStateUpdate
upserts) starved the apiserver. This was the dominant tail in the
M11.24a cloud run.

Coordination: the apiserver container writes the kubeconfig +
admin certs to the shared volume and touches `apiserver-ready` once
serving; the workload container blocks on that file before starting
operator/load-driver.

StatefulSet (M12): predictable pod ordinals (kwok-cluster-N) so the
workload entrypoint can derive a deterministic shard ordinal
(`N % shard.replicas`) and the same kwok cluster always lands on the
same shard across pod restarts. Required for the multi-shard test —
the Deployment's randomised pod names would re-bind clusters to
different shards on every restart and violate the
"clusters-permanently-bound-on-first-contact" hard rule.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kwok-load-profile
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
data:
  profile.yaml: |
    {{- toYaml .Values.loadProfile | nindent 4 }}
---
# Stub headless Service required by StatefulSet `serviceName`. Nothing
# dials kwok pods externally; the Service exists only to give the
# StatefulSet a value for spec.serviceName.
apiVersion: v1
kind: Service
metadata:
  name: kwok-cluster-headless
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
    app.kubernetes.io/component: kwok-cluster
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: kwok-cluster
    app.kubernetes.io/part-of: bigfleet-scaletest
  ports:
    - name: operator-met
      port: 8770
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kwok-cluster
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
    app.kubernetes.io/component: kwok-cluster
spec:
  serviceName: kwok-cluster-headless
  replicas: {{ .Values.kwok.clusterCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/component: kwok-cluster
      app.kubernetes.io/part-of: bigfleet-scaletest
  template:
    metadata:
      labels:
        {{- include "scaletest.labels" . | nindent 8 }}
        app.kubernetes.io/component: kwok-cluster
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8770"
    spec:
      containers:
        - name: apiserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint-apiserver.sh"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- if .Values.kwok.storage }}
            - name: KWOK_STORAGE
              value: "{{ .Values.kwok.storage }}"
            {{- end }}
            # ADR-0023: pod-shim (legacy) does scheduling itself; kube-
            # scheduler (new) means the apiserver container launches a
            # real Kubernetes scheduler with MostAllocated scoring.
            - name: KWOK_SCHEDULER
              value: "{{ .Values.harness.scheduler | default "pod-shim" }}"
          volumeMounts:
            - { name: shared, mountPath: /var/scaletest }
          resources:
            {{- toYaml .Values.kwok.apiserverResources | nindent 12 }}
        - name: workload
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint-workload.sh"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # Multi-shard endpoint resolution. The workload entrypoint
            # picks an ordinal as `N % BIGFLEET_SHARD_REPLICAS` from
            # POD_NAME and dials the per-pod headless DNS. Stable
            # across pod restarts — required for cluster-to-shard
            # binding to survive a StatefulSet rollout-restart.
            - name: BIGFLEET_SHARD_HEADLESS_DNS
              value: "bigfleet-shard-headless.{{ .Values.namespace }}.svc"
            - name: BIGFLEET_SHARD_PORT
              value: "7780"
            - name: BIGFLEET_SHARD_REPLICAS
              value: "{{ .Values.shard.replicas | default 1 }}"
            - name: LOAD_PROFILE
              value: /etc/loadgen/profile.yaml
            - name: OPERATOR_QPS
              value: "{{ .Values.operator.qps }}"
            - name: OPERATOR_BURST
              value: "{{ .Values.operator.burst }}"
            - name: OPERATOR_ACK_CONCURRENCY
              value: "{{ .Values.operator.ackConcurrency }}"
            - name: OPERATOR_ROLLUP_INTERVAL
              value: "{{ .Values.operator.rollupInterval }}"
            {{- if .Values.operator.coLocationKey }}
            - name: OPERATOR_CO_LOCATION_KEY
              value: "{{ .Values.operator.coLocationKey }}"
            {{- end }}
            {{- if .Values.loadProfile.mode }}
            - name: POD_MODE
              value: "{{ .Values.loadProfile.mode }}"
            {{- end }}
            # ADR-0023: tells the workload entrypoint whether to launch
            # pod-shim (legacy, default) or node-creator (new). Must
            # match the KWOK_SCHEDULER setting on the apiserver
            # container; the chart wires both from the same value.
            - name: HARNESS_SCHEDULER
              value: "{{ .Values.harness.scheduler | default "pod-shim" }}"
            {{- if .Values.podShim.binderConcurrency }}
            - name: PODSHIM_BINDER_CONCURRENCY
              value: "{{ .Values.podShim.binderConcurrency }}"
            {{- end }}
            {{- if .Values.podShim.upcomingNodeConcurrency }}
            - name: PODSHIM_UPCOMING_NODE_CONCURRENCY
              value: "{{ .Values.podShim.upcomingNodeConcurrency }}"
            {{- end }}
            {{- if .Values.podShim.pprofAddr }}
            - name: PODSHIM_PPROF_ADDR
              value: "{{ .Values.podShim.pprofAddr }}"
            {{- end }}
          ports:
            - { name: operator-met, containerPort: 8770 }
            - { name: loadgen-met,  containerPort: 8771 }
            - { name: podshim-met,  containerPort: 8772 }
            - { name: upc-met,      containerPort: 8773 }
          volumeMounts:
            - { name: profile, mountPath: /etc/loadgen, readOnly: true }
            - { name: shared,  mountPath: /var/scaletest }
          resources:
            {{- toYaml .Values.kwok.workloadResources | nindent 12 }}
      volumes:
        - name: profile
          configMap:
            name: kwok-load-profile
        - name: shared
          # tmpfs (RAM-backed) emptyDir so kine's sqlite WAL fsyncs
          # land in memory rather than the node's local disk. The
          # per-cluster apiserver is the long-pole when load-driver
          # ramps; disk-backed kine produced 4.6s ack p99 at 155
          # CR/sec/fleet (M11.24a + snap-walk-removal cloud run).
          # Memory cost: sized to 512Mi per pod; 50 pods × 512Mi =
          # 25 GiB cluster-wide on a 320 GB Kapsule, fine.
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.kwok.sharedVolumeSizeLimit | default "512Mi" }}
