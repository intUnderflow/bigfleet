{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: bigfleet
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [{{ .Values.namespace }}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
            regex: bigfleet-scaletest
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__address__, __meta_kubernetes_pod_container_port_number]
            regex: (.+);(8770|8771|8780|8790)
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            target_label: metrics_port
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scaletest-prometheus-{{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scaletest-prometheus-{{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scaletest-prometheus-{{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
      app.kubernetes.io/part-of: bigfleet-scaletest
  template:
    metadata:
      labels:
        {{- include "scaletest.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retentionDays }}d
            - --web.enable-admin-api
            - --web.listen-address=:9090
          ports:
            - { name: web, containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data,   mountPath: /prometheus }
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
        # Sidecar exists solely so the runner can `kubectl exec` curl
        # commands against localhost:9090 — the prom/prometheus image
        # is distroless and ships no shell or HTTP client. Negligible
        # resource cost.
        - name: tools
          image: curlimages/curl:8.10.1
          command: ["sleep", "infinity"]
          volumeMounts:
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scaletest.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  selector:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: bigfleet-scaletest
  ports:
    - { name: web, port: 9090, targetPort: web }
{{- end }}
