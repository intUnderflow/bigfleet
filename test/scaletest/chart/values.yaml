# Defaults shared across all profiles. Profile-specific values files
# under ../profiles/values-*.yaml override these.

namespace: bigfleet-scaletest

# The combined harness image (kine + apiserver + kwok + operator + load-driver).
# Built from test/scaletest/image/Dockerfile.
image:
  repository: bigfleet-scaletest
  tag: dev
  pullPolicy: IfNotPresent

# The bigfleet binary (cmd/bigfleet) image used for the coordinator,
# shards, and fake provider running in-cluster. For kind/dev runs, this
# is built locally and side-loaded with `kind load docker-image`.
bigfleet:
  image:
    repository: bigfleet
    tag: dev
    pullPolicy: IfNotPresent

coordinator:
  # The scaletest chart always renders a coordinator (the template
  # isn't gated). `enabled` controls whether the *shards* dial it via
  # --coordinator-addr; turning this off in a profile produces a
  # static-stability test (shards run, coordinator runs, but no
  # registration / heartbeats fire). Keep `true` for normal runs;
  # without it the shards skip ReportShard and Apply is never called,
  # so bigfleet_coordinator_apply_total + pending_instructions
  # never appear in /metrics (only the always-on raft_term gauge does).
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2,    memory: 4Gi }
  # Stress runs use emptyDir to avoid storage class quirks across
  # targets. HA + persistence is exercised separately.
  persistence:
    enabled: false
    size: 10Gi

shard:
  replicas: 1
  resources:
    requests: { cpu: 1, memory: 2Gi }
    limits:   { cpu: 4, memory: 8Gi }
  # Pre-seed the in-process fake provider with N synthetic idle
  # machines spread across instance types. Used by larger profiles
  # (e.g. scaleway-500k) to populate the inventory without a real
  # provider; 0 = no seeding.
  seedMachines: 0
  # M29: pre-seed N Configured machines per kwok cluster owned by this
  # shard. Models the production-realistic shape where most fleet
  # inventory is workloads-already-bound, not Idle headroom. Profile
  # is hardcoded to a3-highgpu-8g (zone rotated) to MATCH the
  # load-driver's CR profile — otherwise Phase 3 reclaims the seed
  # every cycle as "no need wants this profile". 0 disables.
  seedConfiguredPerCluster: 0
  # Cap per-cycle execute work so a ramp burst doesn't blow past the
  # cycle SLO. 0 = unlimited (production default). Larger profiles
  # bump this to bound the cycle wall-clock at the expense of taking
  # more cycles to fully converge after a burst.
  maxActionsPerCycle: 0
  # Number of action executors running in parallel per cycle. 1 =
  # serial (historical default). Each Bootstrap action blocks on a
  # per-cluster gRPC RTT, so serial = N × stream RTT. Raise for
  # ramp-burst workloads.
  executeConcurrency: 1
  # Render bootstrap blobs locally instead of round-tripping through
  # the operator stream. Decouples shard cycle benchmarks from
  # cluster-stream RTT serialization. Production must leave this
  # false; only set true in scaletest profiles measuring shard work.
  localBootstrap: false
  # Opt into delta-only provider.List polling. Off = full List per
  # cycle (works for any provider). On = trust the provider to honour
  # SinceRevision (plan §10.6 above-conformance-threshold). The
  # in-process fake provider this scaletest harness ships with does
  # honour it; real-provider deployments must verify before enabling.
  incrementalReconcile: false
  # Minimum interval between AvailableCapacityUpdate emits per
  # (cluster, fingerprint). Empty = use the shard's default (5s).
  # Below the cycle interval is wasteful (operator-side apiserver
  # writes); much above 30s starts to feel stale to humans watching
  # `kubectl get availablecapacity`.
  availableCapacityInterval: ""
  # Skip cycle-duration + per-phase histogram observations for the
  # first N cycles. 0 = record everything. Set to a small positive
  # value (e.g., 5) to exclude the cold-start full-List cycle from
  # the steady-state p99.
  metricsWarmupCycles: 0
  # M38 (Item 5): per-second per-machine probability of an unsolicited
  # provider failure (spot reclaim / hardware fault). 0 disables.
  # Real fleets see ~0.1-1%/day → ~1.16e-8 to 1.16e-7 per second per
  # machine. The realistic profile opts in; other profiles default off
  # to keep behaviour deterministic.
  failureRatePerSec: 0

provider:
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: 2,    memory: 2Gi }

# The defining knobs: how many simulated clusters and how big each.
kwok:
  clusterCount: 5
  # The shared emptyDir between the apiserver and workload containers
  # is tmpfs-backed so kine sqlite WAL fsyncs go to RAM instead of the
  # node's local disk. Sized per pod; counts against the pod's memory
  # request/limit so don't oversize on small nodes.
  sharedVolumeSizeLimit: "512Mi"
  # Per-container resource budgets. The pod splits the harness across
  # two containers (apiserver-side and workload-side) sharing a single
  # emptyDir; each gets its own cgroup CPU budget so neither side can
  # starve the other under load.
  apiserverResources:
    requests: { cpu: 200m, memory: 400Mi }
    limits:   { cpu: 1,    memory: 1Gi }
  workloadResources:
    requests: { cpu: 100m, memory: 200Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# Operator tunables. Profiles override to push the apiserver budget
# higher when the underlying apiserver can absorb more (Scaleway PRO2
# vs M5 Max kine, for example). Defaults match cmd/operator's
# production-safe defaults.
operator:
  qps: 50
  burst: 100
  ackConcurrency: 16
  rollupInterval: 0s    # 0 means use the operator binary's default (10s)
  # M37: topology key the operator uses to translate owner-grouped
  # CRs into Same() requirements during rollup. Empty → use the
  # operator binary's default (topology.kubernetes.io/zone). Set to
  # `topology.bigfleet/rack` for profiles whose archetypes use
  # sameRack — that's the key the seeded Configured machines
  # carry as Profile.Labels.
  coLocationKey: ""

# Load profile injected into each KWOK pod via a ConfigMap. See
# test/scaletest/cmd/load-driver/main.go for the schema.
loadProfile:
  target: 1000
  churnPerMinute: 0.05
  burstAtStart: 0
  priorityClasses: [100, 1000, 1000000]
  durationSeconds: 600

prometheus:
  enabled: true
  retentionDays: 1
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits:   { cpu: 2,    memory: 8Gi }

# In-cluster Grafana for live monitoring during long soaks. The runner
# prints a `kubectl port-forward` command at startup so the dashboard
# is reachable at http://localhost:3000 without any extra setup.
# Disable to skip the deployment (e.g., for CPU-constrained targets).
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "10.4.7"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# Cost-model annotations used by the runner. Not enforced at chart
# render time; informational so `helm get values` surfaces them.
costEstimate:
  vCPU: 3
  memoryGB: 9
  awsSpotUsdPerHour: 0.20
  notes: "dev-5k baseline; runs free on M5 Max kind"
