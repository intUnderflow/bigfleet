# Defaults shared across all profiles. Profile-specific values files
# under ../profiles/values-*.yaml override these.

namespace: bigfleet-scaletest

# The combined harness image (kine + apiserver + kwok + operator + load-driver).
# Built from test/scaletest/image/Dockerfile.
image:
  repository: bigfleet-scaletest
  tag: dev
  pullPolicy: IfNotPresent

# The bigfleet binary (cmd/bigfleet) image used for the coordinator,
# shards, and fake provider running in-cluster. For kind/dev runs, this
# is built locally and side-loaded with `kind load docker-image`.
bigfleet:
  image:
    repository: bigfleet
    tag: dev
    pullPolicy: IfNotPresent

coordinator:
  # The scaletest chart always renders a coordinator (the template
  # isn't gated). `enabled` controls whether the *shards* dial it via
  # --coordinator-addr; turning this off in a profile produces a
  # static-stability test (shards run, coordinator runs, but no
  # registration / heartbeats fire). Keep `true` for normal runs;
  # without it the shards skip ReportShard and Apply is never called,
  # so bigfleet_coordinator_apply_total + pending_instructions
  # never appear in /metrics (only the always-on raft_term gauge does).
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2,    memory: 4Gi }
  # Stress runs use emptyDir to avoid storage class quirks across
  # targets. HA + persistence is exercised separately.
  persistence:
    enabled: false
    size: 10Gi

shard:
  replicas: 1
  resources:
    requests: { cpu: 1, memory: 2Gi }
    limits:   { cpu: 4, memory: 8Gi }
  # Pre-seed the in-process fake provider with N synthetic idle
  # machines spread across instance types. Used by larger profiles
  # (e.g. scaleway-500k) to populate the inventory without a real
  # provider; 0 = no seeding.
  seedMachines: 0
  # ADR-0026: pre-seed N Speculative quota slots — the elastic-
  # procurement tier Phase 1 falls back to (Create + bootstrap) when
  # the owned Idle pool can't satisfy a Need. Drawn from the demand
  # archetype catalog, CapacityType OnDemand with a non-zero price.
  # Every profile that sets seedMachines should also set this — the
  # paper's capacity model is two-tier; an Idle-only harness only
  # exercises half of BigFleet. 0 = no Speculative tier (not advised).
  seedSpeculative: 0
  # Each seeded machine carries Allocatable = N × Profile.Resources —
  # one machine has the real capacity of N replicas of its Profile
  # (CPU services pack ~10/machine, GPU inference ~8/machine). N=1 (or
  # unset) keeps the legacy 1 Pod = 1 machine math. Under ADR-0027's
  # resource-vector model this is just per-machine capacity: Phase 1
  # diffs aggregate demand against the machine's true Allocatable, so
  # one machine absorbs up to N replicas of aggregated demand without
  # any per-Pod density reconstruction. Per-profile knob; larger
  # profiles set higher density.
  seedDensityMultiplier: 0
  # M29: pre-seed N Configured machines per kwok cluster owned by this
  # shard. Models the production-realistic shape where most fleet
  # inventory is workloads-already-bound, not Idle headroom. Profile
  # is hardcoded to a3-highgpu-8g (zone rotated) to MATCH the
  # load-driver's CR profile — otherwise Phase 3 reclaims the seed
  # every cycle as "no need wants this profile". 0 disables.
  seedConfiguredPerCluster: 0
  # Cap per-cycle execute work so a ramp burst doesn't blow past the
  # cycle SLO. 0 = unlimited (production default). Larger profiles
  # bump this to bound the cycle wall-clock at the expense of taking
  # more cycles to fully converge after a burst.
  maxActionsPerCycle: 0
  # Number of action executors running in parallel per cycle. 1 =
  # serial (historical default). Each Bootstrap action blocks on a
  # per-cluster gRPC RTT, so serial = N × stream RTT. Raise for
  # ramp-burst workloads.
  executeConcurrency: 1
  # Render bootstrap blobs locally instead of round-tripping through
  # the operator stream. Decouples shard cycle benchmarks from
  # cluster-stream RTT serialization. Production must leave this
  # false; only set true in scaletest profiles measuring shard work.
  localBootstrap: false
  # Opt into delta-only provider.List polling. Off = full List per
  # cycle (works for any provider). On = trust the provider to honour
  # SinceRevision (plan §10.6 above-conformance-threshold). The
  # in-process fake provider this scaletest harness ships with does
  # honour it; real-provider deployments must verify before enabling.
  incrementalReconcile: false
  # Minimum interval between AvailableCapacityUpdate emits per
  # (cluster, fingerprint). Empty = use the shard's default (5s).
  # Below the cycle interval is wasteful (operator-side apiserver
  # writes); much above 30s starts to feel stale to humans watching
  # `kubectl get availablecapacity`.
  availableCapacityInterval: ""
  # Skip cycle-duration + per-phase histogram observations for the
  # first N cycles. 0 = record everything. Set to a small positive
  # value (e.g., 5) to exclude the cold-start full-List cycle from
  # the steady-state p99.
  metricsWarmupCycles: 0
  # M38 (Item 5): per-second per-machine probability of an unsolicited
  # provider failure (spot reclaim / hardware fault). Real fleets see
  # ~0.1-1%/day → ~1.16e-8 to 1.16e-7 per second per machine. ADR-0019
  # rewrote the injector after finding the original 32-sample heuristic
  # would never fire at these rates; the new implementation uses
  # ConfiguredCount × Poisson and lands at the requested mean. Default
  # is the upper-realism end (1%/day): in a 30-min soak with ~50K
  # Configured machines that's ~10 induced failures — enough to
  # exercise the recovery path, low enough not to dominate.
  failureRatePerSec: 0.000000116

provider:
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: 2,    memory: 2Gi }

# The defining knobs: how many simulated clusters and how big each.
kwok:
  clusterCount: 5
  # M45.5: storage backend for the kwok apiserver. "" or "kine" uses
  # the legacy kine + sqlite path (lightweight, no separate process,
  # but sqlite WAL fsyncs serialise writes inside one connection).
  # "etcd" launches real etcd — parallel writes via BoltDB MVCC,
  # removes the kine-side write tail on throughput-heavy laptop
  # scaletests. Cloud profiles can leave this unset since etcd is
  # already the default backend in Kubernetes (kwok-on-cloud doesn't
  # use kine).
  storage: ""
  # The shared emptyDir between the apiserver and workload containers
  # is tmpfs-backed so kine sqlite WAL fsyncs go to RAM instead of the
  # node's local disk. 1Gi is the M44 Pod-mode floor — at 5K Pods on
  # kind, the pod-shim's binding traffic plus per-Pod + per-Node
  # apiserver writes pushed kine warnings under the previous 512Mi.
  # CR-mode profiles can drop back to 512Mi via override.
  sharedVolumeSizeLimit: "1Gi"
  # Per-container resource budgets. The pod splits the harness across
  # two containers (apiserver-side and workload-side) sharing a single
  # emptyDir; each gets its own cgroup CPU budget so neither side can
  # starve the other under load. Defaults are the M44 Pod-mode floor
  # — proven by dev-5k-pods-loopback as the minimum where kine sqlite
  # stops warning under combined CR + Pod + UpcomingNode + Node
  # write load. CR-mode profiles can downsize via apiserverResources
  # / workloadResources overrides.
  apiserverResources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2,    memory: 2Gi }
  workloadResources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2,    memory: 2Gi }

# Operator tunables. Profiles override to push the apiserver budget
# higher when the underlying apiserver can absorb more (Scaleway PRO2
# vs M5 Max kine, for example). Defaults match cmd/operator's
# production-safe defaults.
operator:
  qps: 50
  burst: 100
  ackConcurrency: 16
  rollupInterval: 0s    # 0 means use the operator binary's default (10s)
  # ADR-0024: co-location is no longer an operator-wide key. The
  # operator derives the Same topology key per-Need from each CR's
  # Spec.CoLocation (the source pod's required podAffinity). sameRack
  # archetypes set a real podAffinity term on their Pods; everything
  # else aggregates freely by Profile fingerprint.

# M45.5: per-pod-shim reconcile concurrency overrides. Empty/0 keeps
# the pod-shim binary's defaults (binder=64, upcomingNode=8). High-Pod
# profiles (e.g. 100K Pods/cluster) bump these so the chain isn't
# throttled by reconciler fan-out.
podShim:
  binderConcurrency: 0
  upcomingNodeConcurrency: 0
  # M45.5: enable net/http/pprof on the pod-shim. Empty disables;
  # set to e.g. ":8774" to expose CPU/heap/goroutine profiles on
  # each kwok pod's workload container, then port-forward 8774
  # and use `go tool pprof http://localhost:8774/debug/pprof/profile`.
  pprofAddr: ""

# ADR-0023: which binary performs the "scheduler" role inside each
# kwok cluster.
#   - "pod-shim" (default, legacy): the bigfleet-scaletest-pod-shim
#     binary marks Pods Unschedulable, creates fake Nodes from
#     UpcomingNodes, and binds Pods. One binary doing three jobs.
#   - "kube-scheduler" (ADR-0023): a real kube-scheduler process runs
#     inside the apiserver container with MostAllocated scoring (to
#     preserve density-100 bin-packing). A small node-creator binary
#     replaces the UpcomingNode→fake-Node half of pod-shim; the Pod-
#     marking and Pod-binding halves are taken over by the real
#     scheduler. Produces credible binding-latency numbers.
#
# Both paths are mutually exclusive: setting kube-scheduler implies
# node-creator on the workload side and kube-scheduler on the
# apiserver side; setting pod-shim leaves both off.
harness:
  scheduler: pod-shim

# Load profile injected into each KWOK pod via a ConfigMap. See
# test/scaletest/cmd/load-driver/main.go for the schema.
loadProfile:
  target: 1000
  churnPerMinute: 0.05
  burstAtStart: 0
  # Legacy fallback when archetypes is empty; with the M44 archetypes
  # default below the per-archetype priorityClasses takes precedence.
  priorityClasses: [100, 1000, 1000000]
  durationSeconds: 600
  # Driver mode (M43a / M44 default flip). "" or "pods" emits Pods
  # through the full M43 chain (Pod → Unschedulable → CR → Configured
  # → fake Node → Pod-bound) — the realistic path. "cr" is the
  # opt-in legacy shape that emits CRs directly and skips the Pod
  # layer; the internal-binding-latency gate (ADR-0018) becomes a
  # no-op on those runs (pass() skips via -1 sentinel per ADR-0017).
  mode: ""
  # M44 / ADR-0015 realism extras — defaulted on across every profile
  # so we don't have a separate "realistic" variant. Production
  # apiserver write patterns aren't smooth: per-tick churn jitters
  # by Poisson, occasional minute-scale micro-bursts (deploy ramps,
  # CI queue drains) push 5× the normal rate for a single tick.
  # Without these the p99.9 tail in summary.json is artificially flat.
  jitteredChurn: true
  microBurstRatePerMinute: 1.0
  microBurstFactor: 5.0
  # ADR-0015 §5 (M36): cluster-size skew is available as a profile
  # opt-in via clusterSizeDistribution. Not defaulted because the
  # runner's totalCRs / steady-state gate is computed as
  # kwok.ClusterCount × loadProfile.Target (no weighting); profiles
  # that opt in must pick a distribution whose weighted-mean
  # multiplier ≈ 1.0, or accept gate-cleared shifts. M44 follow-up
  # to teach the runner to compute the weighted total.
  # M44 default: production-realistic archetype catalog (M31/ADR-0015).
  # Six archetypes (GPU training, GPU inference, CPU batch, CPU service,
  # memory-DB, critical-realtime) with multi-instance-type pools, zone
  # spreads, priority diversity, sameRack groups, and short-lived batch
  # mixed with long-lived services. Profiles that want a simpler shape
  # (dev-5k-pods-loopback uses one cpu-small archetype for deterministic
  # binding-loopback validation) override this list.
  #
  # Mirrors test/scaletest/profiles/archetypes/realistic.yaml. Inlined
  # so the chart's ConfigMap renders without a separate -f file.
  archetypes:
    - name: gpu-training
      weight: 5
      instanceTypes: [a3-highgpu-8g]
      zones: [zone-a, zone-b, zone-c]
      sizeBuckets:
        - { weight: 70, resources: { nvidia.com/gpu: "8" } }
        - { weight: 30, resources: { nvidia.com/gpu: "16" } }
      priorityClasses: [1000]
      interruptionPenalty: 65536
      reclamationPenalty: 65536
      meanLifetimeSeconds: 0
      sameRack: true
      groupSizeRange: [2, 8]
    - name: gpu-inference
      weight: 15
      instanceTypes: [a3-highgpu-1g, a2-highgpu-1g]
      zones: [zone-a, zone-b, zone-c]
      sizeBuckets:
        - { weight: 60, resources: { nvidia.com/gpu: "1" } }
        - { weight: 40, resources: { nvidia.com/gpu: "2" } }
      priorityClasses: [100, 1000]
      interruptionPenalty: 4096
      reclamationPenalty: 8192
      meanLifetimeSeconds: 0
    - name: cpu-batch
      weight: 35
      instanceTypes: [c6i.4xlarge, c6i.8xlarge, n2-standard-32]
      zones: [zone-a, zone-b, zone-c]
      sizeBuckets:
        - { weight: 30, resources: { cpu: "4",  memory: "8Gi"  } }
        - { weight: 35, resources: { cpu: "8",  memory: "16Gi" } }
        - { weight: 25, resources: { cpu: "16", memory: "32Gi" } }
        - { weight: 10, resources: { cpu: "32", memory: "64Gi" } }
      priorityClasses: [100]
      interruptionPenalty: 64
      reclamationPenalty: 256
      meanLifetimeSeconds: 600
    - name: cpu-service
      weight: 30
      instanceTypes: [m6i.large, m6i.xlarge, m6i.2xlarge]
      zones: [zone-a, zone-b, zone-c]
      sizeBuckets:
        - { weight: 40, resources: { cpu: "2",  memory: "8Gi"  } }
        - { weight: 35, resources: { cpu: "4",  memory: "16Gi" } }
        - { weight: 20, resources: { cpu: "8",  memory: "32Gi" } }
        - { weight: 5,  resources: { cpu: "16", memory: "64Gi" } }
      priorityClasses: [1000]
      interruptionPenalty: 1024
      reclamationPenalty: 8192
      meanLifetimeSeconds: 0
    - name: memory-db
      weight: 10
      instanceTypes: [r6i.xlarge, r6i.2xlarge]
      zones: [zone-a, zone-b]
      sizeBuckets:
        - { weight: 50, resources: { cpu: "4", memory: "32Gi"  } }
        - { weight: 30, resources: { cpu: "4", memory: "64Gi"  } }
        - { weight: 20, resources: { cpu: "8", memory: "128Gi" } }
      priorityClasses: [1000]
      interruptionPenalty: 4096
      reclamationPenalty: 32768
      meanLifetimeSeconds: 0
      sameRack: true
      groupSizeRange: [3, 5]
    - name: critical-realtime
      weight: 5
      instanceTypes: [c6i.4xlarge, m6i.2xlarge]
      zones: [zone-a, zone-b, zone-c]
      sizeBuckets:
        - { weight: 70, resources: { cpu: "8",  memory: "16Gi" } }
        - { weight: 30, resources: { cpu: "16", memory: "32Gi" } }
      priorityClasses: [1000000]
      interruptionPenalty: 65536
      reclamationPenalty: 65536
      meanLifetimeSeconds: 0

prometheus:
  enabled: true
  retentionDays: 1
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits:   { cpu: 2,    memory: 8Gi }

# In-cluster Grafana for live monitoring during long soaks. The runner
# prints a `kubectl port-forward` command at startup so the dashboard
# is reachable at http://localhost:3000 without any extra setup.
# Disable to skip the deployment (e.g., for CPU-constrained targets).
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "10.4.7"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# Cost-model annotations used by the runner. Not enforced at chart
# render time; informational so `helm get values` surfaces them.
costEstimate:
  vCPU: 3
  memoryGB: 9
  awsSpotUsdPerHour: 0.20
  notes: "dev-5k baseline; runs free on M5 Max kind"
