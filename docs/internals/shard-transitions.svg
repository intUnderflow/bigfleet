<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="The four transition flows the shard executes: Provision (Speculative to Creating to Idle), Bootstrap (Idle to Configuring to Configured), Reclaim or Preempt (Configured to Draining to Idle), and Delete (Idle to Deleting to Speculative), each edge labelled by the provider RPC that drives it." font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#f7f8fa;stroke:#cfd5dc;} .accent{fill:#e6efff;stroke:#2c5fb8;} .pool{fill:#f0ece4;stroke:#b8a672;}
    .label{fill:#1a1d21;} .muted{fill:#5a6168;} .accentText{fill:#1f4488;}
    .arrow{stroke:#5a6168;fill:none;} .arrowhead{fill:#5a6168;} .annot{fill:#5a6168;font-style:italic;}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1f2226;stroke:#4a525c;} .accent{fill:#1d2c4a;stroke:#6e9bdc;} .pool{fill:#2a261d;stroke:#7a6e4b;}
      .label{fill:#e6e8eb;} .muted{fill:#9aa3ad;} .accentText{fill:#9bbef0;}
      .arrow{stroke:#9aa3ad;} .arrowhead{fill:#9aa3ad;} .annot{fill:#9aa3ad;}
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead" stroke="none"/></marker></defs>

  <!-- ===== Row 1: Provision (Speculative -> Creating -> Idle) ===== -->
  <text class="muted" x="20" y="48" font-size="13" font-weight="600">Provision</text>
  <text class="muted" x="20" y="66" font-size="11">Speculative→Configured</text>

  <rect class="accent" x="200" y="26" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="255" y="53" text-anchor="middle" font-size="12" font-weight="600">Speculative</text>

  <path class="arrow" d="M 312 48 L 396 48" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="annot" x="354" y="40" text-anchor="middle" font-size="11">Create</text>

  <rect class="bg" x="398" y="26" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="label" x="453" y="53" text-anchor="middle" font-size="12" font-weight="600">Creating</text>

  <path class="arrow" d="M 510 48 L 594 48" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="accent" x="596" y="26" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="651" y="53" text-anchor="middle" font-size="12" font-weight="600">Idle</text>

  <path class="arrow" d="M 708 48 L 746 48" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="annot" x="754" y="44" text-anchor="start" font-size="11">hand off to</text>
  <text class="annot" x="754" y="58" text-anchor="start" font-size="11">Bootstrap</text>

  <!-- ===== Row 2: Bootstrap (Idle -> Configuring -> Configured) ===== -->
  <text class="muted" x="20" y="138" font-size="13" font-weight="600">Bootstrap</text>
  <text class="muted" x="20" y="156" font-size="11">Idle→Configured</text>

  <rect class="accent" x="200" y="116" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="255" y="143" text-anchor="middle" font-size="12" font-weight="600">Idle</text>

  <path class="arrow" d="M 312 138 L 396 138" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="bg" x="398" y="116" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="label" x="453" y="143" text-anchor="middle" font-size="12" font-weight="600">Configuring</text>

  <path class="arrow" d="M 510 138 L 594 138" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="annot" x="552" y="130" text-anchor="middle" font-size="11">Configure</text>
  <text class="annot" x="552" y="160" text-anchor="middle" font-size="11">[blob fetch]</text>

  <rect class="accent" x="596" y="116" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="651" y="143" text-anchor="middle" font-size="12" font-weight="600">Configured</text>

  <!-- ===== Row 3: Reclaim/Preempt (Configured -> Draining -> Idle) ===== -->
  <text class="muted" x="20" y="228" font-size="13" font-weight="600">Reclaim / Preempt</text>
  <text class="muted" x="20" y="246" font-size="11">Configured→Idle</text>

  <rect class="accent" x="200" y="206" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="255" y="233" text-anchor="middle" font-size="12" font-weight="600">Configured</text>

  <path class="arrow" d="M 312 228 L 396 228" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="annot" x="354" y="220" text-anchor="middle" font-size="11">notify</text>
  <text class="annot" x="354" y="248" text-anchor="middle" font-size="11">operator</text>

  <rect class="bg" x="398" y="206" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="label" x="453" y="233" text-anchor="middle" font-size="12" font-weight="600">Draining</text>

  <path class="arrow" d="M 510 228 L 594 228" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="annot" x="552" y="220" text-anchor="middle" font-size="11">Drain</text>

  <rect class="accent" x="596" y="206" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="651" y="233" text-anchor="middle" font-size="12" font-weight="600">Idle</text>

  <!-- ===== Row 4: Delete (Idle -> Deleting -> Speculative) ===== -->
  <text class="muted" x="20" y="318" font-size="13" font-weight="600">Delete</text>
  <text class="muted" x="20" y="336" font-size="11">Idle→Speculative</text>
  <text class="muted" x="20" y="354" font-size="11">(M73 §7)</text>

  <rect class="accent" x="200" y="296" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="255" y="323" text-anchor="middle" font-size="12" font-weight="600">Idle</text>

  <path class="arrow" d="M 312 318 L 396 318" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="bg" x="398" y="296" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="label" x="453" y="323" text-anchor="middle" font-size="12" font-weight="600">Deleting</text>

  <path class="arrow" d="M 510 318 L 594 318" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="annot" x="552" y="310" text-anchor="middle" font-size="11">Delete</text>

  <rect class="accent" x="596" y="296" width="110" height="44" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="651" y="323" text-anchor="middle" font-size="12" font-weight="600">Speculative</text>

  <!-- legend -->
  <rect class="accent" x="200" y="382" width="18" height="14" rx="4" stroke-width="1.5"/>
  <text class="muted" x="226" y="394" font-size="11">stable state</text>
  <rect class="bg" x="360" y="382" width="18" height="14" rx="4" stroke-width="1.5"/>
  <text class="muted" x="386" y="394" font-size="11">transitional state</text>
  <text class="annot" x="560" y="394" font-size="11">edge labels are the provider RPC that drives the step</text>
</svg>
