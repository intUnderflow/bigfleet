<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1314" role="img" aria-label="End-to-end data flow across three lanes — Kubernetes cluster, the autonomous BigFleet shard, and the out-of-tree provider — from a pod becoming a CapacityRequest through the rollup, the shard cycle's three phases, provider Create/Configure, and node state and reclaim flowing back." font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#f7f8fa;stroke:#cfd5dc;} .accent{fill:#e6efff;stroke:#2c5fb8;} .pool{fill:#f0ece4;stroke:#b8a672;}
    .label{fill:#1a1d21;} .muted{fill:#5a6168;} .accentText{fill:#1f4488;}
    .arrow{stroke:#5a6168;fill:none;} .arrowhead{fill:#5a6168;} .annot{fill:#5a6168;font-style:italic;}
    .lane{fill:none;stroke:#cfd5dc;stroke-dasharray:4 4;}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1f2226;stroke:#4a525c;} .accent{fill:#1d2c4a;stroke:#6e9bdc;} .pool{fill:#2a261d;stroke:#7a6e4b;}
      .label{fill:#e6e8eb;} .muted{fill:#9aa3ad;} .accentText{fill:#9bbef0;}
      .arrow{stroke:#9aa3ad;} .arrowhead{fill:#9aa3ad;} .annot{fill:#9aa3ad;} .lane{stroke:#4a525c;}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead" stroke="none"/>
    </marker>
  </defs>

  <!-- Lane separators (dashed verticals) -->
  <line class="lane" x1="368" y1="16" x2="368" y2="1298" stroke-width="1.5"/>
  <line class="lane" x1="728" y1="16" x2="728" y2="1298" stroke-width="1.5"/>

  <!-- Lane headers -->
  <rect class="bg"     x="16"  y="20" width="336" height="46" rx="8" stroke-width="1.5"/>
  <text class="label"  x="184" y="48" text-anchor="middle" font-size="14" font-weight="600">Kubernetes cluster</text>
  <rect class="accent" x="384" y="20" width="328" height="46" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="548" y="48" text-anchor="middle" font-size="14" font-weight="600">BigFleet shard (autonomous)</text>
  <rect class="pool"   x="744" y="20" width="300" height="46" rx="8" stroke-width="1.5"/>
  <text class="label"  x="894" y="48" text-anchor="middle" font-size="14" font-weight="600">Provider (out-of-tree)</text>

  <!-- ================= LANE 1: pod -> CR -> rollup ================= -->
  <rect class="bg" x="44" y="92" width="280" height="48" rx="8" stroke-width="1.5"/>
  <text class="label" x="184" y="115" text-anchor="middle" font-size="13" font-weight="600">Pod created</text>
  <text class="muted" x="184" y="132" text-anchor="middle" font-size="11">(UPC controller, 1 CR / Pod)</text>
  <path class="arrow" d="M 184 140 L 184 162" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="bg" x="44" y="166" width="280" height="36" rx="8" stroke-width="1.5"/>
  <text class="label" x="184" y="189" text-anchor="middle" font-size="13" font-weight="600">CapacityRequest CR</text>
  <path class="arrow" d="M 184 202 L 184 224" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="bg" x="44" y="228" width="280" height="80" rx="8" stroke-width="1.5"/>
  <text class="label" x="184" y="251" text-anchor="middle" font-size="13" font-weight="600">operator.rollupLoop (every 10s)</text>
  <text class="muted" x="184" y="271" text-anchor="middle" font-size="11">list CRs → aggregate → build</text>
  <text class="muted" x="184" y="288" text-anchor="middle" font-size="11">ClusterCapacityNeeds</text>
  <text class="muted" x="184" y="303" text-anchor="middle" font-size="10">(full replacement, ~2KB)</text>

  <!-- corridor: L1 -> L2 rollup over the stream (clear band y=320..400) -->
  <text class="annot" x="324" y="338" text-anchor="middle" font-size="10">Shard.Session stream (operator dials OUT, one bidi stream)</text>
  <text class="annot" x="324" y="356" text-anchor="middle" font-size="10">OperatorMessage{rollup}</text>
  <path class="arrow" d="M 324 380 L 400 380" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= LANE 2: recv ================= -->
  <rect class="accent" x="404" y="404" width="288" height="84" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="548" y="426" text-anchor="middle" font-size="13" font-weight="600">Session recv → rollupWorker</text>
  <text class="muted" x="548" y="447" text-anchor="middle" font-size="11">NeedsFromRollup</text>
  <text class="muted" x="548" y="463" text-anchor="middle" font-size="11">→ NeedsTable.Replace</text>
  <text class="muted" x="548" y="479" text-anchor="middle" font-size="11">→ triggerCycle()</text>
  <path class="arrow" d="M 548 488 L 548 512" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- runCycle -->
  <rect class="accent" x="404" y="516" width="288" height="158" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="548" y="538" text-anchor="middle" font-size="13" font-weight="600">runCycle (~1s cadence)</text>
  <text class="muted" x="548" y="562" text-anchor="middle" font-size="11">reconcile  ◀── List (inventory truth)</text>
  <text class="muted" x="424" y="604" font-size="11">Phase 1 (assign)</text>
  <text class="muted" x="424" y="624" font-size="11">Phase 2 (preempt)</text>
  <text class="muted" x="424" y="644" font-size="11">Phase 3 (reclaim)</text>
  <path class="arrow" d="M 532 598 L 566 598 L 566 638 L 532 638" stroke-width="1.5" fill="none"/>
  <text class="label" x="578" y="623" font-size="12" font-weight="600">→ []Action</text>
  <path class="arrow" d="M 548 674 L 548 698" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- corridor: L3 -> L2 reconcile List (clear band, arrives at runCycle right edge) -->
  <text class="annot" x="724" y="546" text-anchor="end" font-size="10">List (reconcile)</text>
  <path class="arrow" d="M 744 558 L 694 558" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- executeWorker pool -->
  <rect class="accent" x="404" y="702" width="288" height="40" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="548" y="727" text-anchor="middle" font-size="13" font-weight="600">executeWorker pool</text>
  <path class="arrow" d="M 548 742 L 548 800" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- corridor: L2 -> L1 BootstrapRequest (clear band y=748..790) -->
  <text class="annot" x="384" y="760" text-anchor="middle" font-size="10">BootstrapRequest</text>
  <path class="arrow" d="M 400 778 L 324 778" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="bg" x="44" y="794" width="280" height="40" rx="8" stroke-width="1.5"/>
  <text class="label" x="184" y="819" text-anchor="middle" font-size="12" font-weight="600">operator renders bootstrap blob</text>

  <!-- corridor: L1 -> L2 BootstrapBlobResponse (label sits in the gap left of the box) -->
  <text class="annot" x="398" y="858" text-anchor="end" font-size="10">BootstrapBlobResponse</text>
  <path class="arrow" d="M 324 874 L 400 874" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- executeBootstrap block -->
  <rect class="accent" x="404" y="804" width="288" height="148" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="548" y="826" text-anchor="middle" font-size="13" font-weight="600">executeBootstrap</text>
  <text class="muted" x="548" y="848" text-anchor="middle" font-size="11">Idle → Configuring</text>
  <text class="muted" x="548" y="900" text-anchor="middle" font-size="11">Create  ───────────▶</text>
  <text class="muted" x="548" y="932" text-anchor="middle" font-size="11">Configure(blob)  ──▶</text>

  <!-- L2 -> L3 : Create (provider box title is the label) -->
  <path class="arrow" d="M 692 900 L 740 900" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- L2 -> L3 : Configure -->
  <path class="arrow" d="M 692 932 L 740 932" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= LANE 3: provider state transitions ================= -->
  <rect class="pool" x="744" y="878" width="300" height="44" rx="8" stroke-width="1.5"/>
  <text class="label" x="894" y="895" text-anchor="middle" font-size="12" font-weight="600">Create</text>
  <text class="muted" x="894" y="913" text-anchor="middle" font-size="10">Speculative → Creating → Idle</text>

  <rect class="pool" x="744" y="930" width="300" height="44" rx="8" stroke-width="1.5"/>
  <text class="label" x="894" y="947" text-anchor="middle" font-size="12" font-weight="600">Configure(blob)</text>
  <text class="muted" x="894" y="965" text-anchor="middle" font-size="10">Idle → Configuring → Configured</text>

  <!-- Idle->Configuring result + node state up the stream -->
  <path class="arrow" d="M 548 952 L 548 992" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="accent" x="404" y="996" width="288" height="40" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="548" y="1021" text-anchor="middle" font-size="12" font-weight="600">Idle → Configuring</text>

  <!-- corridor: L2 -> L1 NodeStateUpdate (clear band y=1042..1082) -->
  <text class="annot" x="384" y="1056" text-anchor="middle" font-size="10">NodeStateUpdate (per transition)</text>
  <path class="arrow" d="M 400 1074 L 324 1074" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="bg" x="44" y="1090" width="280" height="56" rx="8" stroke-width="1.5"/>
  <text class="label" x="184" y="1112" text-anchor="middle" font-size="12" font-weight="600">UpcomingNode CR</text>
  <text class="muted" x="184" y="1132" text-anchor="middle" font-size="11">kubelet joins, Node Ready</text>

  <!-- ================= demand drops: reclaim half ================= -->
  <line class="lane" x1="44" y1="1178" x2="1044" y2="1178" stroke-width="1"/>
  <text class="annot" x="548" y="1170" text-anchor="middle" font-size="11" font-weight="600">later: demand drops</text>

  <!-- L2 reclaim block -->
  <rect class="accent" x="404" y="1206" width="288" height="78" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="548" y="1230" text-anchor="middle" font-size="13" font-weight="600">Phase 3 (reclaim excess)</text>
  <text class="muted" x="548" y="1252" text-anchor="middle" font-size="11">ReclaimInstruction  → cluster</text>
  <text class="muted" x="548" y="1274" text-anchor="middle" font-size="11">Drain  ───────────▶ provider</text>

  <!-- corridor: L2 -> L1 ReclaimInstruction (label in clear band above both boxes) -->
  <text class="annot" x="362" y="1200" text-anchor="middle" font-size="10">ReclaimInstruction (Phase 3 excess)</text>
  <path class="arrow" d="M 400 1244 L 324 1244" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="bg" x="44" y="1224" width="280" height="40" rx="8" stroke-width="1.5"/>
  <text class="label" x="184" y="1249" text-anchor="middle" font-size="12" font-weight="600">cordon + PDB-evict</text>

  <!-- L2 -> L3 : Drain (provider box title is the label) -->
  <path class="arrow" d="M 692 1274 L 740 1274" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="pool" x="744" y="1252" width="300" height="44" rx="8" stroke-width="1.5"/>
  <text class="label" x="894" y="1269" text-anchor="middle" font-size="12" font-weight="600">Drain</text>
  <text class="muted" x="894" y="1287" text-anchor="middle" font-size="10">Configured → Draining → Idle</text>
</svg>
