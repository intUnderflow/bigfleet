<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Dependency direction: pkg/shard/coordclient imports pkg/shard (and pkg/proto), but pkg/shard never imports coordclient or the coordinator, so the hot path has no coordinator dependency, and cmd/bigfleet wires both in separate goroutines." font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#f7f8fa;stroke:#cfd5dc;} .accent{fill:#e6efff;stroke:#2c5fb8;} .pool{fill:#f0ece4;stroke:#b8a672;}
    .label{fill:#1a1d21;} .muted{fill:#5a6168;} .accentText{fill:#1f4488;}
    .arrow{stroke:#5a6168;fill:none;} .arrowhead{fill:#5a6168;} .annot{fill:#5a6168;font-style:italic;}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1f2226;stroke:#4a525c;} .accent{fill:#1d2c4a;stroke:#6e9bdc;} .pool{fill:#2a261d;stroke:#7a6e4b;}
      .label{fill:#e6e8eb;} .muted{fill:#9aa3ad;} .accentText{fill:#9bbef0;}
      .arrow{stroke:#9aa3ad;} .arrowhead{fill:#9aa3ad;} .annot{fill:#9aa3ad;}
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead" stroke="none"/></marker></defs>

  <!-- coordclient (top-left) -->
  <rect class="bg" x="40" y="40" width="240" height="68" rx="8" stroke-width="1.5"/>
  <text class="label" x="160" y="70" text-anchor="middle" font-size="13" font-weight="600">pkg/shard/coordclient</text>
  <text class="muted" x="160" y="90" text-anchor="middle" font-size="11">off the hot path</text>

  <!-- pkg/shard (top-right) -->
  <rect class="accent" x="440" y="40" width="240" height="68" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="560" y="64" text-anchor="middle" font-size="13" font-weight="600">pkg/shard</text>
  <text class="muted" x="560" y="84" text-anchor="middle" font-size="11">the hot path</text>
  <text class="muted" x="560" y="100" text-anchor="middle" font-size="11">(adapter.go: ViewFromShard(*shard.Shard))</text>

  <!-- coordclient -> pkg/shard : imports -->
  <path class="arrow" d="M 280 66 L 436 66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="annot" x="358" y="56" text-anchor="middle" font-size="11">imports</text>

  <!-- pkg/shard -> back : NON-dependency (blocked) -->
  <path class="arrow" d="M 436 92 L 320 92" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- drawn X over the blocked line, marking it as a NON-dependency -->
  <g stroke="#cc3333" stroke-width="2.5" stroke-linecap="round">
    <line x1="372" y1="84" x2="384" y2="100"/>
    <line x1="384" y1="84" x2="372" y2="100"/>
  </g>
  <!-- blocked-end bar at pkg/shard side -->
  <line x1="316" y1="83" x2="316" y2="101" stroke="#cc3333" stroke-width="3"/>
  <text class="annot" x="430" y="124" text-anchor="middle" font-size="11" fill="#cc3333">never imports coordclient or coordinator</text>

  <!-- pkg/proto (bottom-left) -->
  <rect class="bg" x="40" y="220" width="240" height="68" rx="8" stroke-width="1.5"/>
  <text class="label" x="160" y="250" text-anchor="middle" font-size="13" font-weight="600">pkg/proto</text>
  <text class="muted" x="160" y="270" text-anchor="middle" font-size="11">(Coordinator gRPC)</text>

  <!-- coordclient -> pkg/proto : imports -->
  <path class="arrow" d="M 160 108 L 160 216" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="annot" x="172" y="166" text-anchor="start" font-size="11">imports</text>

  <!-- caption box -->
  <rect class="pool" x="400" y="220" width="280" height="68" rx="8" stroke-width="1.5"/>
  <text class="label" x="540" y="250" text-anchor="middle" font-size="13" font-weight="600">cmd/bigfleet</text>
  <text class="muted" x="540" y="270" text-anchor="middle" font-size="11">wires both, in separate goroutines</text>

  <!-- footer point -->
  <text class="annot" x="360" y="330" text-anchor="middle" font-size="11">coordclient depends on shard, not the reverse — the hot path never imports the coordinator (static stability)</text>
</svg>
