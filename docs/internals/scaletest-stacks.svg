<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" role="img" aria-label="Two scale-test stacks — a fast in-process Go simulator and a slow real-protocol kind/cloud e2e — share exactly one component, the pkg/scaletest/archetype workload catalog, so demand and supply describe the same fleet on both." font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#f7f8fa;stroke:#cfd5dc;} .accent{fill:#e6efff;stroke:#2c5fb8;} .pool{fill:#f0ece4;stroke:#b8a672;}
    .label{fill:#1a1d21;} .muted{fill:#5a6168;} .accentText{fill:#1f4488;}
    .arrow{stroke:#5a6168;fill:none;} .arrowhead{fill:#5a6168;} .annot{fill:#5a6168;font-style:italic;}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1f2226;stroke:#4a525c;} .accent{fill:#1d2c4a;stroke:#6e9bdc;} .pool{fill:#2a261d;stroke:#7a6e4b;}
      .label{fill:#e6e8eb;} .muted{fill:#9aa3ad;} .accentText{fill:#9bbef0;}
      .arrow{stroke:#9aa3ad;} .arrowhead{fill:#9aa3ad;} .annot{fill:#9aa3ad;}
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead" stroke="none"/></marker></defs>

  <!-- TOP box: synthetic Go simulator -->
  <text class="muted" x="16" y="95" font-size="11">synthetic (Go, fast)</text>
  <rect class="bg" x="150" y="16" width="594" height="150" rx="8" stroke-width="1.5"/>
  <text class="label" x="174" y="48" font-size="14" font-weight="600">Go simulator</text>
  <text class="muted" x="174" y="76" font-size="11">in-process — no gRPC, no kube, no time</text>
  <text class="muted" x="174" y="98" font-size="11">cmd/fauxctl + sim/ · pkg/decision/shard/needs/…</text>
  <text class="muted" x="174" y="120" font-size="11">fake provider (pkg/provider/fake), shard.Step driven synchronously</text>
  <text class="muted" x="174" y="142" font-size="11">millions of machines, deterministic</text>

  <!-- arrow from TOP down into the catalog -->
  <g class="arrow" stroke-width="1.5" stroke-linecap="round">
    <path d="M 447 166 L 447 222" marker-end="url(#arrow)"/>
  </g>
  <text class="annot" x="457" y="197" font-size="11">shares</text>

  <!-- MIDDLE box: the catalog hub (accent) -->
  <rect class="accent" x="222" y="224" width="316" height="74" rx="8" stroke-width="1.5"/>
  <text class="accentText" x="380" y="256" text-anchor="middle" font-size="14" font-weight="600">pkg/scaletest/archetype</text>
  <text class="accentText" x="380" y="278" text-anchor="middle" font-size="11">the workload catalog</text>

  <!-- arrow from BOTTOM up into the catalog -->
  <g class="arrow" stroke-width="1.5" stroke-linecap="round">
    <path d="M 447 356 L 447 300" marker-end="url(#arrow)"/>
  </g>
  <text class="annot" x="457" y="333" font-size="11">shares</text>

  <!-- BOTTOM box: real-protocol kind / cloud e2e -->
  <text class="muted" x="16" y="448" font-size="11">real-protocol (kube, slow)</text>
  <rect class="bg" x="150" y="356" width="594" height="172" rx="8" stroke-width="1.5"/>
  <text class="label" x="174" y="388" font-size="14" font-weight="600">kind / cloud e2e</text>
  <text class="muted" x="174" y="416" font-size="11">N Pods per cluster; each cluster a Pod bundling KWOK apiserver</text>
  <text class="muted" x="174" y="438" font-size="11">+ real kube-scheduler + bigfleet operator + load-driver</text>
  <text class="muted" x="174" y="470" font-size="11">real CRD / gRPC / Raft</text>
  <text class="muted" x="174" y="500" font-size="11">test/scaletest/{chart,cmd,image,profiles}</text>
</svg>
