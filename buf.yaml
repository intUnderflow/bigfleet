version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  except:
    # The proto package is `fleet.v1alpha1`; we don't repeat the version in
    # the directory layout. Standard buf rule enforces a redundant suffix.
    - PACKAGE_VERSION_SUFFIX
    # Service names mirror design docs: `Shard`, `CapacityProvider`,
    # `Coordinator`. Adding a `Service` suffix would diverge from the papers.
    - SERVICE_SUFFIX
    # RPCs deliberately share request/response types where the design treats
    # them as one message — e.g., all four CapacityProvider lifecycle RPCs
    # return TransitionAck. Forcing per-RPC types is boilerplate that hides
    # the shared semantics.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
    # M68b: dead-signal fields are deleted with their numbers reserved
    # (the policy in practice since M66.1's AvailableCapacityUpdate
    # cleanup). Strict FIELD_NO_DELETE would forbid that; the
    # UNLESS_NUMBER_RESERVED variant keeps the wire-compat guarantee —
    # a deletion without a reservation still fails the build.
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
  except:
    - FIELD_NO_DELETE
