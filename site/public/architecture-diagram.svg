<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="BigFleet sits one tier above per-cluster autoscalers: each Kubernetes cluster runs an operator that reports capacity needs to BigFleet, which provisions from a fleet-wide capacity pool of bare metal, cloud, and spot machines." font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <style>
    .bg     { fill: #f7f8fa; stroke: #cfd5dc; }
    .accent { fill: #e6efff; stroke: #2c5fb8; }
    .pool   { fill: #f0ece4; stroke: #b8a672; }
    .label  { fill: #1a1d21; }
    .muted  { fill: #5a6168; }
    .accentText { fill: #1f4488; }
    .arrow  { stroke: #5a6168; fill: none; }
    .annot  { fill: #5a6168; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .bg         { fill: #1f2226; stroke: #4a525c; }
      .accent     { fill: #1d2c4a; stroke: #6e9bdc; }
      .pool       { fill: #2a261d; stroke: #7a6e4b; }
      .label      { fill: #e6e8eb; }
      .muted      { fill: #9aa3ad; }
      .accentText { fill: #9bbef0; }
      .arrow      { stroke: #9aa3ad; }
      .annot      { fill: #9aa3ad; }
    }
  </style>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="muted" stroke="none" fill="currentColor" style="fill: var(--arrow-fill, #5a6168);"/>
    </marker>
  </defs>

  <!-- Top row: three clusters -->
  <g>
    <!-- Cluster A -->
    <rect class="bg" x="40"  y="20" width="240" height="130" rx="10" stroke-width="1.5"/>
    <text class="label" x="160" y="46" text-anchor="middle" font-size="14" font-weight="600">Cluster A</text>
    <text class="muted" x="160" y="76" text-anchor="middle" font-size="12">kube-scheduler places pods</text>
    <text class="muted" x="160" y="98" text-anchor="middle" font-size="12">BigFleet operator</text>
    <text class="muted" x="160" y="116" text-anchor="middle" font-size="11" opacity="0.85">writes CapacityRequest CRDs</text>

    <!-- Cluster B -->
    <rect class="bg" x="360" y="20" width="240" height="130" rx="10" stroke-width="1.5"/>
    <text class="label" x="480" y="46" text-anchor="middle" font-size="14" font-weight="600">Cluster B</text>
    <text class="muted" x="480" y="76" text-anchor="middle" font-size="12">kube-scheduler places pods</text>
    <text class="muted" x="480" y="98" text-anchor="middle" font-size="12">BigFleet operator</text>
    <text class="muted" x="480" y="116" text-anchor="middle" font-size="11" opacity="0.85">writes CapacityRequest CRDs</text>

    <!-- Cluster C -->
    <rect class="bg" x="680" y="20" width="240" height="130" rx="10" stroke-width="1.5"/>
    <text class="label" x="800" y="46" text-anchor="middle" font-size="14" font-weight="600">Cluster C</text>
    <text class="muted" x="800" y="76" text-anchor="middle" font-size="12">kube-scheduler places pods</text>
    <text class="muted" x="800" y="98" text-anchor="middle" font-size="12">BigFleet operator</text>
    <text class="muted" x="800" y="116" text-anchor="middle" font-size="11" opacity="0.85">writes CapacityRequest CRDs</text>
  </g>

  <!-- Cluster -> BigFleet arrows (rolled-up needs going down) -->
  <g class="arrow" stroke-width="1.5" stroke-linecap="round">
    <path d="M 160 152 L 160 200 L 360 200 L 360 240" marker-end="url(#arrow)"/>
    <path d="M 480 152 L 480 240"                       marker-end="url(#arrow)"/>
    <path d="M 800 152 L 800 200 L 600 200 L 600 240"  marker-end="url(#arrow)"/>
  </g>

  <!-- Side annotation for the rollup direction -->
  <text class="annot" x="40" y="200" font-size="11">cluster capacity needs (1 protobuf message)</text>

  <!-- Middle: BigFleet -->
  <rect class="accent" x="240" y="240" width="480" height="84" rx="12" stroke-width="2"/>
  <text class="accentText" x="480" y="270" text-anchor="middle" font-size="16" font-weight="700">BigFleet</text>
  <text class="accentText" x="480" y="294" text-anchor="middle" font-size="12">shards + coordinator</text>
  <text class="accentText" x="480" y="312" text-anchor="middle" font-size="11" opacity="0.85">decides which machines go to which cluster</text>

  <!-- BigFleet -> Capacity pool arrow (provisioning) -->
  <g class="arrow" stroke-width="1.5" stroke-linecap="round">
    <path d="M 480 326 L 480 360" marker-end="url(#arrow)"/>
  </g>
  <text class="annot" x="500" y="350" font-size="11">provisions, reclaims, rebalances</text>

  <!-- Bottom row: capacity sources -->
  <g>
    <rect class="pool" x="120" y="370" width="200" height="70" rx="10" stroke-width="1.5"/>
    <text class="label" x="220" y="395" text-anchor="middle" font-size="13" font-weight="600">Bare metal</text>
    <text class="muted" x="220" y="416" text-anchor="middle" font-size="11">reserved · long-lived</text>

    <rect class="pool" x="380" y="370" width="200" height="70" rx="10" stroke-width="1.5"/>
    <text class="label" x="480" y="395" text-anchor="middle" font-size="13" font-weight="600">Cloud on-demand</text>
    <text class="muted" x="480" y="416" text-anchor="middle" font-size="11">elastic · per-hour</text>

    <rect class="pool" x="640" y="370" width="200" height="70" rx="10" stroke-width="1.5"/>
    <text class="label" x="740" y="395" text-anchor="middle" font-size="13" font-weight="600">Spot</text>
    <text class="muted" x="740" y="416" text-anchor="middle" font-size="11">cheap · interruptible</text>
  </g>
</svg>
