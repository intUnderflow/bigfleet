name: Nightly

on:
  schedule:
    # 03:00 UTC every day. Runs the simulator + soak suite.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim-and-soak:
    name: sim + soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile') }}

      - name: Install tools
        run: make tools

      - name: Generate
        run: make generate

      - name: Sim (scenarios + golden verification)
        run: make sim

      - name: Soak
        run: make soak

      - name: Upload golden trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-goldens
          path: sim/golden/
