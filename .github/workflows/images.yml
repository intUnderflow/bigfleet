name: Images

# Builds and publishes the two scaletest container images to GHCR on every
# push to main and on PRs (PR builds skip the push to avoid leaking write
# tokens to fork PRs). Tags applied:
#
#   :main         — moving tag, always points at the latest main build.
#   :sha-<short>  — immutable; the helm chart can pin to it via
#                   --set image.tag=sha-<short>.
#
# Pre-workflow the cloud-test loop was: hand-run docker buildx --platform
# linux/amd64 ... --push twice from a laptop, easy to forget --platform
# (M5 Max defaults to arm64) and easy to overwrite :dev mid-flight from
# parallel work. CI on ubuntu-latest is amd64 by default and tags
# deterministically. See task #128 for context.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bigfleet
            dockerfile: cmd/bigfleet/Dockerfile
          - image: bigfleet-scaletest
            dockerfile: test/scaletest/image/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip the login step (and the push) on fork PRs — they don't have
        # a GHCR write token. The build still runs as a smoke test.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          short_sha=$(git rev-parse --short=12 "$GITHUB_SHA")
          base="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "tags=${base}:main,${base}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${base}:pr-${{ github.event.pull_request.number }}-${short_sha}" >> "$GITHUB_OUTPUT"
            # Only push when the PR head is in the same repo (not a fork).
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
              echo "push=true" >> "$GITHUB_OUTPUT"
            else
              echo "push=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build${{ steps.tags.outputs.push == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
