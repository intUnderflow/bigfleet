name: Images

# Build the two scaletest container images. Behaviour:
#
#   on push to main    — build AND push to GHCR with :main and
#                        :sha-<short> tags.
#   on pull_request    — build only (smoke test that the image still
#                        builds at PR HEAD). Never logs in to GHCR;
#                        never pushes. Avoids any write-token exposure
#                        from fork or compromised-PR contents.
#
# Tags pushed from main:
#   :main          moving — always the latest main build.
#   :sha-<short>   immutable; helm pins via --set image.tag=sha-<short>.

on:
  push:
    branches: [main]
  pull_request:

# Default permissions = none. The push job below grants packages:write
# only for itself; PR builds run with the read-only default.
permissions: {}

jobs:
  build-pr:
    name: build (${{ matrix.image }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bigfleet
            dockerfile: cmd/bigfleet/Dockerfile
          - image: bigfleet-scaletest
            dockerfile: test/scaletest/image/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.image }}:pr
          cache-from: type=gha

  push-main:
    name: push (${{ matrix.image }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bigfleet
            dockerfile: cmd/bigfleet/Dockerfile
          - image: bigfleet-scaletest
            dockerfile: test/scaletest/image/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          short_sha=$(git rev-parse --short=12 "$GITHUB_SHA")
          base="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          echo "tags=${base}:main,${base}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
