name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the buf-breaking step diffs the proto module
          # against the merge-base of main, which a depth-1 clone
          # cannot resolve.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile') }}

      - name: Install tools
        run: make tools

      - name: Generate
        run: make generate

      - name: Verify generated code is up to date
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Generated code is out of date. Run 'make generate' and commit."
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Buf breaking (proto wire compatibility)
        # buf.yaml has configured breaking:FILE since M0; M75 makes it
        # enforced. Compare against the merge-base with main so a PR is
        # only blamed for its own proto reshapes, not for main moving.
        # On pushes to main the merge-base is HEAD itself (no-op); the
        # PR gate is the enforcement point.
        run: |
          git fetch origin main
          make buf-breaking

      - name: Test
        run: make test

  sim:
    name: simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run simulator scenarios
        run: make sim || echo "::warning::sim target not yet populated (M2+)"
