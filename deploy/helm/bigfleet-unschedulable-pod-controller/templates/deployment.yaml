{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bigfleet-cr-controller.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet-cr-controller.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bigfleet-cr-controller.serviceAccountName" . }}
  labels:
    {{- include "bigfleet-cr-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["bigfleet.lucy.sh"]
    resources: ["capacityrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bigfleet-cr-controller.serviceAccountName" . }}
  labels:
    {{- include "bigfleet-cr-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bigfleet-cr-controller.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bigfleet-cr-controller.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
{{- if .Values.priorityClassDefaults }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bigfleet-priority-class-defaults
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet-cr-controller.labels" . | nindent 4 }}
data:
  defaults.yaml: |
    {{- toYaml .Values.priorityClassDefaults | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bigfleet-unschedulable-pod-controller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet-cr-controller.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bigfleet-cr-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bigfleet-cr-controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "bigfleet-cr-controller.serviceAccountName" . }}
      containers:
        - name: controller
          image: {{ include "bigfleet-cr-controller.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-addr=:{{ .Values.metricsPort }}
            {{- if .Values.priorityClassDefaults }}
            - --priority-class-defaults=/etc/bigfleet/priority-class-defaults.yaml
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          {{- if .Values.priorityClassDefaults }}
          volumeMounts:
            - name: priority-class-defaults
              mountPath: /etc/bigfleet
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.priorityClassDefaults }}
      volumes:
        - name: priority-class-defaults
          configMap:
            name: bigfleet-priority-class-defaults
            items:
              - key: defaults.yaml
                path: priority-class-defaults.yaml
      {{- end }}
