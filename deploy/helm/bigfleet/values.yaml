# Default values for the bigfleet control-plane chart.
#
# Renders into a StatefulSet for the coordinator (Raft state on a PVC)
# and a Deployment for the shards. Real production deployments should
# (a) raise replica counts, (b) attach mTLS via a sidecar or a custom
# values overlay, (c) wire ServiceMonitor / PodMonitor for Prometheus.

image:
  repository: ghcr.io/intunderflow/bigfleet
  tag: ""             # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

namespace: bigfleet-system

coordinator:
  enabled: true
  replicas: 3                   # ADR-0002: single Raft group, 3 voters
  # bootstrap stays true for the life of the install: only ordinal 0
  # honours it (ADR-0047), and only when its data dir has no existing
  # Raft state. Ordinals >0 join via the leader. Set false only if you
  # are restoring from snapshot and want to be explicit that nothing
  # may mint a fresh cluster.
  bootstrap: true
  dataDir: /var/lib/bigfleet
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  storage:
    size: 10Gi                  # Raft logs + snapshots; ~500MB at 100M nodes per plan §10
    storageClassName: ""        # "" = default StorageClass
  service:
    grpcPort: 7790
    raftPort: 7791
    metricsPort: 8790

shard:
  enabled: true
  # M12: shards are deployed as a StatefulSet with stable per-pod DNS
  # via the headless `bigfleet-shard-headless` Service. Operators must
  # be bound to a specific shard ordinal at deploy time (see the
  # provider author guide); the round-robin `bigfleet-shard` Service
  # is retained for single-shard / admin paths only.
  replicas: 1                   # bump per fleet size; see docs/scaling-guide.md
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 8Gi
  service:
    grpcPort: 7780
    metricsPort: 8780
  # provider.addr — host:port of the out-of-tree CapacityProvider's gRPC
  # service (M71). When set, shards dial it and fence every mutating call
  # with (shard_id, shard_epoch, sequence_number) per paper §11. Empty
  # keeps the in-process fake provider — dev/demo only; the fake must
  # never face real machines. Providers ship their own charts in their
  # own repos (no provider charts here, per the out-of-tree hard rule).
  provider:
    addr: ""
  dataDir: /var/lib/bigfleet-shard
  storage:
    size: 1Gi                   # epoch counter + reserved space for future shard-local persistent state
    storageClassName: ""        # "" = default StorageClass
  # ADR-0046 actuation safety rails.
  # actuationPaused is the global kill switch: cycles keep deciding and
  # reporting (reconcile, metrics, shortfalls, AvailableCapacity) but
  # execute nothing. Flip to true during an incident, helm upgrade, and
  # watch bigfleet_shard_actions_suppressed_total for what the engine
  # *would* do.
  actuationPaused: false
  # reclaimCapFraction: per cycle, per cluster, at most
  # max(1, fraction × Configured) Reclaim actions execute; the surplus
  # rolls to later cycles. Preempts are never capped. 0 disables.
  reclaimCapFraction: 0.05
  # emptyRollupGuard quarantines a full-replacement rollup that would
  # erase >90% of a cluster's previously accepted demand (when that
  # demand spans >= 10 Needs) until 3 consecutive rollups confirm it.
  emptyRollupGuard: true
  # dryRun is the ADR-0046-addendum shadow mode — the day-one adoption
  # posture. Cycles decide and report everything (Info logs +
  # bigfleet_shard_actions_dryrun_total) but execute nothing: run
  # BigFleet against a live fleet to see what it WOULD do before
  # trusting it. Distinct from actuationPaused (the emergency stop).
  dryRun: false
  # auditLog, when non-empty, enables the JSONL decision audit log
  # (one record per executed/suppressed/dry-run action). Point it
  # under dataDir so it lands on the shard's PVC, e.g.
  # /var/lib/bigfleet-shard/audit.jsonl, and ship it with your log
  # pipeline. The shard only appends; rotation/size management is the
  # operator's (logrotate-style sidecar or pipeline retention).
  auditLog: ""

# rbac toggles whether ClusterRole / ClusterRoleBinding are rendered.
# Disable if your cluster admin manages RBAC out-of-band.
rbac:
  create: true

# serviceAccount.create=true makes the chart mint a ServiceAccount;
# false reuses an existing one named .Values.serviceAccount.name.
serviceAccount:
  create: true
  name: ""

# podMonitor wires Prometheus Operator scraping. Off by default to keep
# the chart's hard dependencies minimal.
podMonitor:
  enabled: false
