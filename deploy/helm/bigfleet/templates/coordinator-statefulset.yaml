{{- if .Values.coordinator.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: bigfleet-coordinator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  clusterIP: None  # headless; needed for stable Raft peer addresses
  # A joining replica is NOT ready until the leader has voted it in,
  # but the leader must resolve the joiner's per-pod DNS to replicate
  # to it — and on a full restart no replica is ready until a leader
  # is elected. Without this the per-pod records vanish exactly when
  # quorum formation needs them.
  publishNotReadyAddresses: true
  selector:
    {{- include "bigfleet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
  ports:
    - name: grpc
      port: {{ .Values.coordinator.service.grpcPort }}
      targetPort: grpc
    - name: raft
      port: {{ .Values.coordinator.service.raftPort }}
      targetPort: raft
    - name: metrics
      port: {{ .Values.coordinator.service.metricsPort }}
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bigfleet-coordinator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  serviceName: bigfleet-coordinator
  replicas: {{ .Values.coordinator.replicas }}
  # Parallel, not OrderedReady: readiness now gates on Raft leadership,
  # and after a full restart no replica reports ready until a quorum
  # elects a leader. OrderedReady would hold pod 1 on pod 0's readiness
  # — a permanent deadlock for a 3-voter cluster.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "bigfleet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        {{- include "bigfleet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: coordinator
    spec:
      serviceAccountName: {{ include "bigfleet.serviceAccountName" . }}
      containers:
        - name: coordinator
          image: {{ include "bigfleet.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - coordinator
            - --listen=:{{ .Values.coordinator.service.grpcPort }}
            - --raft-bind=:{{ .Values.coordinator.service.raftPort }}
            - --raft-advertise=$(POD_NAME).bigfleet-coordinator.{{ .Values.namespace }}.svc:{{ .Values.coordinator.service.raftPort }}
            - --id=$(POD_NAME)
            - --data-dir={{ .Values.coordinator.dataDir }}
            - --metrics-addr=:{{ .Values.coordinator.service.metricsPort }}
            # ADR-0047 quorum formation: every replica gets identical
            # args (distroless image — no shell to vary them); the
            # binary splits on the ordinal in --id. Only ordinal 0
            # honours --bootstrap; every replica runs the membership
            # reconciler against the headless Service below until the
            # leader has it as a voter at its current address (also
            # heals the pod-IP change a restart causes). Idempotent.
            - --join-addr=bigfleet-coordinator.{{ .Values.namespace }}.svc:{{ .Values.coordinator.service.grpcPort }}
            {{- if .Values.coordinator.bootstrap }}
            - --bootstrap
            {{- end }}
            {{- if .Values.coordinator.tls.secretName }}
            # ADR-0048 mTLS: serves the gRPC port and dials peers'
            # JoinRaftCluster with the same certificate, which must
            # carry the URI SAN bigfleet://admin. Raft (:{{ .Values.coordinator.service.raftPort }})
            # stays plaintext — see ADR-0048.
            - --tls-cert=/etc/bigfleet/tls/tls.crt
            - --tls-key=/etc/bigfleet/tls/tls.key
            - --tls-ca=/etc/bigfleet/tls/ca.crt
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: {{ .Values.coordinator.service.grpcPort }}
            - name: raft
              containerPort: {{ .Values.coordinator.service.raftPort }}
            - name: metrics
              containerPort: {{ .Values.coordinator.service.metricsPort }}
          {{- if .Values.coordinator.tls.secretName }}
          # ADR-0048: kubelet's gRPC probe is plaintext-only and can't
          # complete an mTLS handshake, so with TLS on the gRPC port
          # the probes move to their HTTP twins on the metrics port.
          # Same semantics: liveness = process up, readiness = a Raft
          # leader observed.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          {{- else }}
          # Liveness: grpc_health_v1 default service — SERVING for the
          # life of the process, decoupled from Raft so quorum loss
          # never restart-loops the replicas that could re-form it.
          livenessProbe:
            grpc:
              port: {{ .Values.coordinator.service.grpcPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: SERVING once this replica observes a Raft
          # leader (itself or a peer). Gates a joiner until it's a
          # voter; paces rolling upgrades on actual recovery.
          readinessProbe:
            grpc:
              port: {{ .Values.coordinator.service.grpcPort }}
              service: bigfleet.v1alpha1.Coordinator
            periodSeconds: 5
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.coordinator.dataDir }}
            {{- if .Values.coordinator.tls.secretName }}
            - name: tls
              mountPath: /etc/bigfleet/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
      {{- if .Values.coordinator.tls.secretName }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.coordinator.tls.secretName }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.coordinator.storage.storageClassName }}
        storageClassName: {{ .Values.coordinator.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.coordinator.storage.size }}
{{- end }}
