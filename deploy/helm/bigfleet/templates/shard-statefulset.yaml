{{- if .Values.shard.enabled -}}
# Headless Service for stable per-pod DNS. Operators are bound to a
# specific shard ordinal at deploy time (see provider/operator guides);
# they dial bigfleet-shard-N.bigfleet-shard-headless.<ns>.svc:<port>
# rather than the round-robin ClusterIP below. Required because
# clusters are permanently bound to shards on first contact and the
# round-robin Service can't make that binding stable across pod
# restarts.
apiVersion: v1
kind: Service
metadata:
  name: bigfleet-shard-headless
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: shard
spec:
  clusterIP: None
  selector:
    {{- include "bigfleet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: shard
  ports:
    - name: grpc
      port: {{ .Values.shard.service.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.shard.service.metricsPort }}
      targetPort: metrics
---
# ClusterIP Service kept for backwards compatibility with single-shard
# / dev installs and for admin tooling that doesn't care which shard
# answers (e.g. health probes). Production multi-shard operators use
# the headless Service above for stable bindings.
apiVersion: v1
kind: Service
metadata:
  name: bigfleet-shard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: shard
spec:
  selector:
    {{- include "bigfleet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: shard
  ports:
    - name: grpc
      port: {{ .Values.shard.service.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.shard.service.metricsPort }}
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bigfleet-shard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: shard
spec:
  serviceName: bigfleet-shard-headless
  replicas: {{ .Values.shard.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "bigfleet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: shard
  template:
    metadata:
      labels:
        {{- include "bigfleet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: shard
    spec:
      serviceAccountName: {{ include "bigfleet.serviceAccountName" . }}
      containers:
        - name: shard
          image: {{ include "bigfleet.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - shard
            - --listen=:{{ .Values.shard.service.grpcPort }}
            - --metrics-addr=:{{ .Values.shard.service.metricsPort }}
            - --id=$(POD_NAME)
            - --data-dir={{ .Values.shard.dataDir }}
            - --advertise-addr=$(POD_NAME).bigfleet-shard-headless.{{ .Values.namespace }}.svc:{{ .Values.shard.service.grpcPort }}
            - --coordinator-addr=bigfleet-coordinator.{{ .Values.namespace }}.svc:{{ .Values.coordinator.service.grpcPort }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: {{ .Values.shard.service.grpcPort }}
            - name: metrics
              containerPort: {{ .Values.shard.service.metricsPort }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.shard.dataDir }}
          resources:
            {{- toYaml .Values.shard.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.shard.storage.storageClassName }}
        storageClassName: {{ .Values.shard.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.shard.storage.size }}
{{- end }}
