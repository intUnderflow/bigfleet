{{- if .Values.shard.enabled -}}
# Headless Service for stable per-pod DNS. Operators are bound to a
# specific shard ordinal at deploy time (see provider/operator guides);
# they dial bigfleet-shard-N.bigfleet-shard-headless.<ns>.svc:<port>
# rather than the round-robin ClusterIP below. Required because
# clusters are permanently bound to shards on first contact and the
# round-robin Service can't make that binding stable across pod
# restarts.
apiVersion: v1
kind: Service
metadata:
  name: bigfleet-shard-headless
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: shard
spec:
  clusterIP: None
  # Operators are permanently bound to a shard ordinal; its per-pod
  # DNS record must not vanish while the shard restarts or waits on
  # its first provider reconcile, or every bound operator loses the
  # only name it is allowed to dial.
  publishNotReadyAddresses: true
  selector:
    {{- include "bigfleet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: shard
  ports:
    - name: grpc
      port: {{ .Values.shard.service.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.shard.service.metricsPort }}
      targetPort: metrics
---
# ClusterIP Service kept for backwards compatibility with single-shard
# / dev installs and for admin tooling that doesn't care which shard
# answers (e.g. health probes). Production multi-shard operators use
# the headless Service above for stable bindings.
apiVersion: v1
kind: Service
metadata:
  name: bigfleet-shard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: shard
spec:
  selector:
    {{- include "bigfleet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: shard
  ports:
    - name: grpc
      port: {{ .Values.shard.service.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.shard.service.metricsPort }}
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bigfleet-shard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bigfleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: shard
spec:
  serviceName: bigfleet-shard-headless
  replicas: {{ .Values.shard.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "bigfleet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: shard
  template:
    metadata:
      labels:
        {{- include "bigfleet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: shard
    spec:
      serviceAccountName: {{ include "bigfleet.serviceAccountName" . }}
      containers:
        - name: shard
          image: {{ include "bigfleet.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - shard
            - --listen=:{{ .Values.shard.service.grpcPort }}
            - --metrics-addr=:{{ .Values.shard.service.metricsPort }}
            - --id=$(POD_NAME)
            - --data-dir={{ .Values.shard.dataDir }}
            - --advertise-addr=$(POD_NAME).bigfleet-shard-headless.{{ .Values.namespace }}.svc:{{ .Values.shard.service.grpcPort }}
            - --coordinator-addr=bigfleet-coordinator.{{ .Values.namespace }}.svc:{{ .Values.coordinator.service.grpcPort }}
            {{- if .Values.shard.provider.addr }}
            # M71: dial the out-of-tree provider; mutations are fenced
            # with this shard's (id, epoch, sequence) per paper §11.
            - --provider-addr={{ .Values.shard.provider.addr }}
            {{- end }}
            # ADR-0046 actuation safety rails (see values.yaml).
            - --actuation-paused={{ .Values.shard.actuationPaused }}
            - --reclaim-cap-fraction={{ .Values.shard.reclaimCapFraction }}
            - --empty-rollup-guard={{ .Values.shard.emptyRollupGuard }}
            # ADR-0046 addendum: shadow mode + decision audit log.
            - --dry-run={{ .Values.shard.dryRun }}
            {{- if .Values.shard.auditLog }}
            - --audit-log={{ .Values.shard.auditLog }}
            {{- end }}
            {{- if .Values.shard.tls.secretName }}
            # ADR-0048 mTLS: one flag set covers the Session server,
            # the coordinator report dial, and the provider dial. The
            # certificate must carry bigfleet://shard/<shard_id>;
            # because the SAN embeds the id, a shared Secret only
            # fits replicas=1 (see values.yaml).
            - --tls-cert=/etc/bigfleet/tls/tls.crt
            - --tls-key=/etc/bigfleet/tls/tls.key
            - --tls-ca=/etc/bigfleet/tls/ca.crt
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: {{ .Values.shard.service.grpcPort }}
            - name: metrics
              containerPort: {{ .Values.shard.service.metricsPort }}
          # M75 probes. Neither touches the coordinator: a shard must
          # stay alive and ready with zero coordinators (static
          # stability). Readiness latches after the first successful
          # provider reconcile — before that the shard would be
          # deciding against an empty inventory view.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: {{ .Values.shard.dataDir }}
            {{- if .Values.shard.tls.secretName }}
            - name: tls
              mountPath: /etc/bigfleet/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.shard.resources | nindent 12 }}
      {{- if .Values.shard.tls.secretName }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.shard.tls.secretName }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.shard.storage.storageClassName }}
        storageClassName: {{ .Values.shard.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.shard.storage.size }}
{{- end }}
