# Default values for the bigfleet-operator chart.

image:
  repository: ghcr.io/intunderflow/bigfleet-operator
  tag: ""             # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

namespace: bigfleet-system

# clusterID is this cluster's stable identifier as known to BigFleet.
# Required.
clusterID: ""

# shardAddress is host:port of the BigFleet shard's gRPC endpoint.
# Required.
shardAddress: ""

# tls.secretName — name of an EXISTING kubernetes.io/tls Secret (keys
# tls.crt / tls.key / ca.crt — what a cert-manager Certificate
# produces) mounted into the operator pod. Non-empty = the operator
# dials the shard with ADR-0048 mTLS; its certificate must carry the
# URI SAN bigfleet://cluster/<clusterID>, which the shard binds the
# Session's Hello.cluster_id to (mismatch = PermissionDenied). Empty =
# plaintext (the default). The chart never generates certificates —
# cert-manager is the expected issuer; docs/operator-guide.md has the
# Certificate manifest.
tls:
  secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

metricsPort: 8770

# crds.install controls whether the chart installs the bigfleet.lucy.sh
# CRDs (CapacityRequest, UpcomingNode, AvailableCapacity). Disable on
# clusters where another operator already installed them.
crds:
  install: true

rbac:
  create: true

serviceAccount:
  create: true
  name: ""

# M21 bootstrap-template configuration. When non-empty, the chart
# renders the value as a ConfigMap and mounts it into the operator
# pod; the operator parses it as a Go text/template and runs it on
# every BootstrapRequest. Template context (mirrors the renderer's
# input):
#
#   {{ .ClusterID }}
#   {{ range .Requirements }}{{ .Key }} {{ .Operator }} {{ .Values }}{{ end }}
#
# Example:
#
#   bootstrapTemplate: |
#     #cloud-config
#     write_files:
#       - path: /etc/bigfleet/cluster-id
#         content: {{ .ClusterID }}
#     runcmd:
#       - kubeadm join --token=… --discovery-token-ca-cert-hash=…
#
# Empty / unset → the operator falls back to the built-in stub
# renderer (no userdata). Embedders that supply a Go callback via
# Operator.Config.BootstrapTemplate keep working unchanged.
bootstrapTemplate: ""
