// Capacity message types shared by the cluster operator → shard stream and
// the shard's internal data model.
//
// The CapacityNeed is the unit of aggregated demand. Every send up the
// Shard.Session stream is a *full replacement* of the cluster's desired
// state: the receiver must treat the message as the cluster's complete
// current need set. Withdrawal is implicit (a CR no longer present).
//
// Per docs/plan.md §0.1 B, the two penalty fields on CapacityNeed are
// bucketed to a coarse log scale at aggregation time so that workloads
// with slightly different penalty values still aggregate into a single
// need. The bucket boundary list is published with the CapacityRequest CRD.
syntax = "proto3";

package bigfleet.v1alpha1;

// ClusterCapacityNeeds is what an operator sends to its shard each cycle.
// It is a full replacement of the cluster's desired state. The shard diffs
// against its inventory and reacts.
message ClusterCapacityNeeds {
  // Stable identifier for the cluster. Assigned by the operator and never
  // changed for the life of the cluster.
  string cluster_id = 1;

  // Wall-clock time at which the operator built this snapshot.
  int64 timestamp_unix_nanos = 2;

  // Aggregated demand. Each CapacityNeed is a constrained aggregate resource
  // request; CRs sharing an aggregation key collapse into one entry.
  repeated CapacityNeed needs = 3;
}

// CapacityNeed is the aggregated unit of capacity demand — a constrained
// aggregate resource request (ADR-0027). The aggregation key is
// (requirements, priority, spread, interruption_penalty_bucket,
// reclamation_penalty_bucket). CRs whose fields all match across that key
// collapse into a single CapacityNeed: their per-replica resource requests
// are summed into aggregate_resources, and min_unit is the largest of them.
message CapacityNeed {
  // Node-selector style requirements that must be satisfied. The autoscaler
  // is responsible for honouring all standard operators (In, NotIn, Exists,
  // DoesNotExist) plus the protobuf-only Same operator (see below).
  repeated NodeSelectorRequirement requirements = 1;

  // Aggregate resource demand for this constraint set — the vector sum of
  // the per-replica requests of every CR in this CapacityNeed. Map keys are
  // Kubernetes resource names ("cpu", "memory", "nvidia.com/gpu"); values
  // are quantity strings.
  //
  // ADR-0027: the autoscaler diffs this against the sum of Allocatable over
  // matching machines, in resource-vector space. It does not reconstruct a
  // per-pod count or density — machine count is the autoscaler's output,
  // never the cluster's input.
  map<string, string> aggregate_resources = 2;

  // The pod's PriorityClass value. Higher = served first. The autoscaler
  // walks needs top-down by priority.
  int32 priority = 3;

  // Field 4 was `count` (post-aggregation Pod count). Removed by ADR-0027:
  // demand is now expressed as aggregate_resources + min_unit, and machine
  // count is the autoscaler's output, never the cluster's input.
  reserved 4;

  // Topology-spread constraints copied from the source pod(s). Pass-through
  // to the autoscaler so it can spread provisioning across domains.
  repeated TopologySpread spread = 5;

  // Bucketed penalties. Bucket boundaries are powers of 2 in dollars between
  // $0.50 and $10M; CRs with raw penalties in the same bucket aggregate.
  // The cost-function effect of bucketing is bounded and small; the size
  // of the roll-up message stays bounded even when penalties are
  // workload-specific.
  PenaltyBucket interruption_penalty_bucket = 6;
  PenaltyBucket reclamation_penalty_bucket  = 7;

  // ADR-0027: the largest atomic schedulable unit — a resource vector that
  // every machine provisioned for this CapacityNeed must individually be
  // able to host (the indivisibility floor; e.g. an 8-GPU pod needs 8 GPU
  // on one machine). With the Workload API this is the declared gang/unit
  // size. Same map shape as aggregate_resources.
  map<string, string> min_unit = 8;
}

// NodeSelectorRequirement mirrors core/v1.NodeSelectorRequirement, plus a
// protobuf-only Same operator that the cluster operator emits when a CR
// requires co-location (e.g., all 64 nodes on one rack).
message NodeSelectorRequirement {
  string key = 1;
  enum Operator {
    OPERATOR_UNSPECIFIED  = 0;
    OPERATOR_IN           = 1;
    OPERATOR_NOT_IN       = 2;
    OPERATOR_EXISTS       = 3;
    OPERATOR_DOES_NOT_EXIST = 4;
    // Same: all machines provisioned for this CapacityNeed must share a
    // value for this key. Optional values restrict which value is
    // acceptable. Only valid in the protobuf wire format; not surfaced on
    // the CRD.
    OPERATOR_SAME         = 5;
  }
  Operator operator       = 2;
  repeated string values  = 3;
}

// TopologySpread is the autoscaler-visible projection of a pod's
// topologySpreadConstraints. Whether the autoscaler honours the constraint
// when no machines exist depends on whenUnsatisfiable.
message TopologySpread {
  string topology_key      = 1;
  int32 max_skew           = 2;
  enum WhenUnsatisfiable {
    WHEN_UNSATISFIABLE_UNSPECIFIED   = 0;
    WHEN_UNSATISFIABLE_DO_NOT_SCHEDULE = 1;
    WHEN_UNSATISFIABLE_SCHEDULE_ANYWAY = 2;
  }
  WhenUnsatisfiable when_unsatisfiable = 3;
}

// PenaltyBucket enumerates the boundaries used to coarsen workload-specific
// penalty values. Selected at aggregation time by rounding up the raw
// dollar value to the nearest bucket. Boundaries are powers of 2 in
// dollars from $0.50 up to $8,388,608 (≈ $8.4M); anything larger falls
// in PENALTY_BUCKET_PINNED and is treated as effectively non-interruptible
// for cost-function purposes.
enum PenaltyBucket {
  PENALTY_BUCKET_UNSPECIFIED = 0;
  PENALTY_BUCKET_ZERO        = 1;   // $0
  PENALTY_BUCKET_HALF_DOLLAR = 2;   // (0, $0.50]
  PENALTY_BUCKET_1           = 3;   // ($0.50, $1]
  PENALTY_BUCKET_2           = 4;
  PENALTY_BUCKET_4           = 5;
  PENALTY_BUCKET_8           = 6;
  PENALTY_BUCKET_16          = 7;
  PENALTY_BUCKET_32          = 8;
  PENALTY_BUCKET_64          = 9;
  PENALTY_BUCKET_128         = 10;
  PENALTY_BUCKET_256         = 11;
  PENALTY_BUCKET_512         = 12;
  PENALTY_BUCKET_1024        = 13;  // $1,024
  PENALTY_BUCKET_2048        = 14;
  PENALTY_BUCKET_4096        = 15;
  PENALTY_BUCKET_8192        = 16;
  PENALTY_BUCKET_16384       = 17;
  PENALTY_BUCKET_32768       = 18;
  PENALTY_BUCKET_65536       = 19;
  PENALTY_BUCKET_131072      = 20;
  PENALTY_BUCKET_262144      = 21;
  PENALTY_BUCKET_524288      = 22;
  PENALTY_BUCKET_1048576     = 23;  // $1,048,576
  PENALTY_BUCKET_2097152     = 24;
  PENALTY_BUCKET_4194304     = 25;
  PENALTY_BUCKET_8388608     = 26;  // $8,388,608  (≈ $8.4M)
  PENALTY_BUCKET_PINNED      = 27;  // > $8,388,608: treat as effectively infinite
}
