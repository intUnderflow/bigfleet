// CapacityProvider is the contract every out-of-tree provider implements.
//
// Six RPCs only — Create, Configure, Drain, Delete, Get, List. All four
// lifecycle RPCs (Create/Configure/Drain/Delete) are *asynchronous*: they
// return a TransitionAck immediately and the actual transition is observed
// via state changes visible through subsequent List/Get calls. All
// lifecycle RPCs are *idempotent* on (machine_id, target_state).
//
// There is no Watch RPC. Reconciliation is List + Get only (see plan §10.6
// for why; List supports an optional `since_revision` cursor so providers
// above a documented threshold can serve incremental state efficiently).
//
// Fencing (paper §11, M71). Every MUTATING RPC — Create, Configure, Drain,
// Delete — carries the shard's fencing token: (shard_id, shard_epoch,
// sequence_number). The shard's epoch is persisted and increments on every
// process restart; the sequence number is a per-process monotonic counter.
// Together they let a provider refuse a zombie shard (an old process, or a
// duplicate of the same shard identity) whose view of the fleet is stale.
//
// Providers MUST track, per (shard_id, machine_id), the highest
// (shard_epoch, sequence_number) pair accepted so far, compared
// lexicographically: (e1, s1) is newer than (e2, s2) iff e1 > e2, or
// e1 == e2 and s1 > s2. A mutating request whose token is NOT strictly
// newer than that machine's high-water mark for that shard MUST be rejected
// with FAILED_PRECONDITION and MUST NOT be applied (the fencing check runs
// before idempotent-retry short-circuiting). A token that passes advances
// the high-water mark even if the operation itself then fails. First contact
// from an unknown (shard_id, machine_id) is accepted and establishes the
// mark. A new epoch resets the sequence space: once the epoch advances, any
// sequence_number is acceptable.
//
// The mark is keyed per (shard, machine), NOT per shard. A single live
// shard runs a concurrent execute pool: it draws monotonic sequence numbers
// but races the sends (stamp-then-send is not atomic, and a gRPC server
// dispatches each RPC on its own goroutine), so tokens for DIFFERENT
// machines arrive out of order. A per-shard mark would fence the shard
// against its own out-of-order arrivals — a false zombie — bricking
// machines under any burst with execute-concurrency > 1. Per-machine keying
// stays monotonic for real traffic (the shard serializes transitions per
// machine: one in-flight mutation per machine) while letting concurrent ops
// on different machines proceed. A TRUE zombie is still caught: a superseded
// shard process loads a strictly LOWER persisted epoch than its successor,
// so its tokens are rejected on epoch, per machine.
//
// FAILED_PRECONDITION is reserved on this service for fencing rejections,
// so callers can alert on zombie-shard incidents mechanically. Reject
// anything else (invalid state transitions, etc.) with a different code.
//
// Retries are re-stamped: the shard mints a fresh sequence_number for
// every call attempt, so a transport-level retry is never rejected as a
// replay. Idempotency is keyed on (machine_id, target_state) via
// operation_id reuse, never on the fencing token.
//
// Get and List carry no token. Reads don't fence — a zombie shard reading
// state harms nothing; only mutations actuate machines and money.
syntax = "proto3";

package bigfleet.v1alpha1;

service CapacityProvider {
  rpc Create   (CreateRequest)    returns (TransitionAck);
  rpc Configure(ConfigureRequest) returns (TransitionAck);
  rpc Drain    (DrainRequest)     returns (TransitionAck);
  rpc Delete   (DeleteRequest)    returns (TransitionAck);
  rpc Get      (MachineRef)       returns (Machine);
  rpc List     (ListFilter)       returns (MachineList);
}

// MachineState enumerates the eight states a machine can occupy. Three
// stable (Speculative, Idle, Configured), four transitional (Creating,
// Configuring, Draining, Deleting), one terminal-pending-cleanup (Failed).
enum MachineState {
  MACHINE_STATE_UNSPECIFIED = 0;
  MACHINE_STATE_SPECULATIVE = 1;  // host=nil, cluster=0
  MACHINE_STATE_CREATING    = 2;  // Speculative → Idle in progress
  MACHINE_STATE_IDLE        = 3;  // host=set,  cluster=0
  MACHINE_STATE_CONFIGURING = 4;  // Idle → Configured in progress
  MACHINE_STATE_CONFIGURED  = 5;  // host=set,  cluster=set
  MACHINE_STATE_DRAINING    = 6;  // Configured → Idle in progress
  MACHINE_STATE_DELETING    = 7;  // Idle → Speculative in progress (cloud only)
  MACHINE_STATE_FAILED      = 8;  // last transition timed out; needs intervention
}

// CapacityType is the cost-of-holding category. Drives idle-hold policy
// (bare-metal: forever; reserved: forever; on-demand: minutes; spot: ~1m).
enum CapacityType {
  CAPACITY_TYPE_UNSPECIFIED = 0;
  CAPACITY_TYPE_BARE_METAL  = 1;
  CAPACITY_TYPE_RESERVED    = 2;
  CAPACITY_TYPE_ON_DEMAND   = 3;
  CAPACITY_TYPE_SPOT        = 4;
}

// HostRef is the provider's identifier for a real host. Empty when the
// machine is in the SPECULATIVE state.
message HostRef {
  string provider = 1;  // e.g. "aws-eu-west-1", "bare-metal-amsterdam"
  string ref      = 2;  // provider-scoped ID (instance-id, serial number, …)
}

// Resources is per-machine allocatable capacity. Map keys mirror Kubernetes
// resource names; values are quantity strings.
message Resources {
  map<string, string> resources = 1;
}

// Machine is the unit of inventory the autoscaler reasons about. Same shape
// regardless of whether the machine is a quota slot, a real but idle node,
// or a configured cluster member.
message Machine {
  // BigFleet's internal machine identifier. Stable across the entire
  // lifecycle (a Speculative slot that becomes a real Idle host keeps the
  // same machine_id; the host_ref is the field that fills in).
  string id = 1;

  MachineState state = 2;

  // Empty when state == SPECULATIVE (or CREATING before host attaches).
  HostRef host = 3;

  string instance_type = 4;
  string zone          = 5;
  CapacityType capacity_type = 6;

  // Per-hour price in USD. Zero for bare metal (already paid for).
  double price_per_hour = 7;

  // Hourly interruption probability, [0.0, 1.0]. Provider-declared only:
  // forecast for SPECULATIVE machines, observed for real ones. No
  // cluster-side override (per design memory).
  double interruption_probability = 8;

  // Resources is the per-replica request shape this machine is provisioned
  // to satisfy. Equal to the Pod-side CR.Spec.Resources that the rollup
  // aggregated into the Profile this machine is bound to. Read by Phase 1's
  // demand-vs-supply matching to decide whether this machine can host a
  // unit of demand from this Profile.
  //
  // ADR-0022: distinct from `allocatable`. A `c6a.4xlarge` machine bound to
  // a "{cpu: 1, memory: 4Gi}" per-replica Profile has Resources={cpu:1,
  // memory:4Gi} (what one Pod needs) and Allocatable={cpu:16, memory:32Gi}
  // (what the hardware actually provides). Density = floor(Allocatable /
  // Resources).
  Resources resources = 9;

  // Provider-supplied labels. Used by the autoscaler to satisfy node-selector
  // requirements without re-deriving them from instance_type/zone.
  map<string, string> labels = 10;

  reserved 11;  // transition_started_unix_nanos — unused; removed M66.1

  // Populated when state == FAILED.
  string last_error = 12;

  // ADR-0022: the per-machine allocatable capacity this hardware actually
  // provides. Phase 1's deficit math compares the *aggregate* of Allocatable
  // across matching machines against the *aggregate* demand
  // (Profile.Resources × Need.Count) and provisions the gap.
  //
  // Migration: when this field is unset, callers treat Allocatable as equal
  // to Resources (preserves the pre-ADR-0022 1 CR = 1 machine math). Providers
  // SHOULD populate this field; the shard's fake provider does so during
  // M45.0+ inventory seeding, and out-of-tree providers should follow.
  Resources allocatable = 13;

  // Cluster this machine is bound to, recorded from
  // ConfigureRequest.cluster_id (paper §7: Configure carries the cluster,
  // so the binding is provider-domain state — the provider legitimately
  // knows it). Populated while the binding exists (CONFIGURING,
  // CONFIGURED, DRAINING); cleared when a Drain completes back to IDLE.
  // Empty for SPECULATIVE / CREATING / IDLE records.
  //
  // M72: without this field the wire could not round-trip a Configured
  // machine — a shard rebuilding inventory from List+Get after a restart
  // rejected every provider-reported Configured record at ingest
  // (bigfleet_shard_machines_rejected_total{reason="structural"}).
  string cluster = 14;

  // Opaque shard-side metadata, stored verbatim from
  // ConfigureRequest.shard_metadata and echoed on every Get / List /
  // TransitionAck snapshot of this machine. The contract is STORE AND
  // ECHO, NEVER INTERPRET: keys and values are BigFleet-internal
  // (assignment attribution the shard must recover after a restart),
  // deliberately not first-class fields so no provider is tempted to
  // read meaning into them. Providers MUST preserve unknown keys
  // byte-for-byte and MUST clear the whole map together with `cluster`
  // when a Drain completes — it is per-assignment state established by
  // Configure, not per-machine state, and a stale echo would let a
  // restarted shard resurrect a dead workload's attribution onto a new
  // assignment. (M72; this is the only persistent store the data plane
  // has, so it is what makes shard restart lose nothing.)
  map<string, string> shard_metadata = 15;
}

// MachineRef identifies one machine for the read RPC Get. Reads carry no
// fencing token (see the file-level fencing contract): a zombie shard
// reading state harms nothing.
message MachineRef {
  string id = 1;
}

message MachineList {
  repeated Machine machines = 1;

  // Opaque cursor. Providers that support incremental List echo a revision
  // here that the caller can pass back as ListFilter.since_revision on the
  // next call to receive only deltas. Providers below the conformance
  // threshold may leave this empty and return full state every time.
  bytes revision = 2;
}

// ListFilter restricts the read RPC List. Like Get, List carries no
// fencing token — reads don't fence.
message ListFilter {
  // Restrict to the listed states. Empty list = any state.
  repeated MachineState states = 1;

  reserved 2;  // zone — unused; removed M66.1
  reserved 3;  // instance_type — unused; removed M66.1

  // Cap on returned results. Zero means no cap.
  int32 max_results = 4;

  // Optional opaque cursor returned by a prior MachineList.revision. When
  // set, the provider should return only machines whose state has changed
  // since the cursor was issued. Providers that don't support cursors must
  // ignore this field and return full state. See plan §0.1 C.
  bytes since_revision = 5;
}

// CreateRequest moves Speculative → Creating → Idle.
message CreateRequest {
  // The speculative machine to actuate. Must be a machine the caller
  // currently observes in MACHINE_STATE_SPECULATIVE.
  string machine_id = 1;

  reserved 2;  // labels — unused; removed M66.1

  // Fencing token (paper §11, M71) — see the file-level contract.
  string shard_id        = 3;
  int64  shard_epoch     = 4;
  int64  sequence_number = 5;
}

// ConfigureRequest moves Idle → Configuring → Configured. The bootstrap
// blob is opaque to the provider (cloud: cloud-init / ignition; bare-metal:
// PXE / iPXE config). It is generated on demand by the cluster operator
// over the Shard.Session stream and forwarded by the shard.
message ConfigureRequest {
  string machine_id = 1;
  // Cluster the machine is being configured for. The provider records this
  // so subsequent Get/List responses can populate it.
  string cluster_id = 2;
  // Provider-opaque bootstrap data. Applied as user-data / ignition / PXE.
  bytes bootstrap_blob = 3;

  // Fencing token (paper §11, M71) — see the file-level contract.
  string shard_id        = 4;
  int64  shard_epoch     = 5;
  int64  sequence_number = 6;

  // Opaque shard-side metadata to store with the machine and echo
  // verbatim as Machine.shard_metadata on subsequent Get / List /
  // TransitionAck snapshots, until the binding ends (Drain completes).
  // Never interpret; see Machine.shard_metadata for the full contract.
  // (M72)
  map<string, string> shard_metadata = 7;
}

// DrainRequest moves Configured → Draining → Idle. The grace period bounds
// how long the kubelet's graceful shutdown is permitted to take. PDBs are
// honoured up to the grace period; beyond it, the provider may escalate
// (kubelet kill, instance shutdown).
message DrainRequest {
  string machine_id = 1;
  // Grace period for the kubelet's graceful node shutdown.
  int64 grace_period_seconds = 2;

  // Fencing token (paper §11, M71) — see the file-level contract.
  string shard_id        = 3;
  int64  shard_epoch     = 4;
  int64  sequence_number = 5;
}

// DeleteRequest moves Idle → Deleting → Speculative. Introduced in M71 so
// Delete — a mutating RPC — can carry the fencing token Get's MachineRef
// must not. Wire-compatible with the MachineRef this RPC took before M71:
// field 1 is the same string at the same number (field names don't travel).
message DeleteRequest {
  string machine_id = 1;

  // Fencing token (paper §11, M71) — see the file-level contract.
  string shard_id        = 2;
  int64  shard_epoch     = 3;
  int64  sequence_number = 4;
}

// TransitionAck is the response from any of Create/Configure/Drain/Delete.
// Acceptance is immediate; progress is observed via state changes.
message TransitionAck {
  // Operation identifier for idempotent retry and provider-side tracking.
  // Repeated calls keyed by (machine_id, target_state) must reuse the same
  // operation_id rather than starting a new transition.
  string operation_id = 1;

  // Snapshot of the machine at acceptance time — typically already in the
  // corresponding transitional state (CREATING, CONFIGURING, DRAINING,
  // DELETING).
  Machine machine = 2;
}
