// Coordinator is the internal RPC surface between shards and the global
// coordinator. The coordinator does not make provisioning decisions; it
// owns shard membership, the cluster→shard map, the topology-domain→shard
// map, quota allocations, and the provider registry, and it issues
// rebalancing / cross-shard preemption instructions.
//
// Every coordinator-issued instruction carries (coordinator_term, sequence_number).
// Shards reject instructions with stale terms (zombie-leader protection).
syntax = "proto3";

package bigfleet.v1alpha1;

import "bigfleet/v1alpha1/capacity.proto";
import "bigfleet/v1alpha1/provider.proto";

service Coordinator {
  // Shards push periodic reports. Idempotent per (shard_id, cycle).
  // The response carries any pending CoordinatorInstruction messages
  // the shard should execute, plus the coordinator's current term.
  // The shard piggybacks acks for previously-received instructions on
  // its next ReportShard call (ShardReport.instruction_acks). This
  // keeps the v1 wire surface to one unary RPC; a streaming
  // Instructions RPC may land in a future revision.
  rpc ReportShard(ShardReport) returns (ReportAck);

  // M15 admin surface. Each RPC is leader-only and returns
  // FailedPrecondition on followers (the same redirect contract as
  // ReportShard). v1 ships unauthenticated — the coordinator's gRPC
  // service is a cluster-internal endpoint; exposing it externally
  // requires a sidecar (mTLS / OIDC). cmd/bigfleetctl is the
  // intended client.
  rpc AssignDomain(AssignDomainRequest) returns (AssignDomainResponse);
  rpc UnassignDomain(UnassignDomainRequest) returns (UnassignDomainResponse);
  rpc RemoveShard(RemoveShardRequest) returns (RemoveShardResponse);
  rpc ListShards(ListShardsRequest) returns (ListShardsResponse);
  rpc ListDomainAssignments(ListDomainAssignmentsRequest) returns (ListDomainAssignmentsResponse);

  // M24 quota inspection. Lets on-call surface "the coordinator's
  // quota assignments for this shard" from the user-stories runbook
  // without going into Raft state directly. SetQuota writes through
  // the FSM (idempotent overwrite of the per-shard slice for a
  // (provider, region) key); ListQuotas is a read.
  rpc ListQuotas(ListQuotasRequest) returns (ListQuotasResponse);

  // M75 Raft membership (ADR-0047). A coordinator replica with no
  // existing Raft state asks the leader to AddVoter it into the
  // cluster. Leader-only (FailedPrecondition on followers / on
  // unbootstrapped replicas); the joiner retries with backoff until
  // the call lands on the leader. AddVoter of an existing voter is
  // idempotent in hashicorp/raft (the configuration change updates
  // the address in place), so re-joins after a restart are safe.
  // Same ADR-0008 open-trust posture as the rest of this surface;
  // M74 authenticates it.
  rpc JoinRaftCluster(JoinRaftClusterRequest) returns (JoinRaftClusterResponse);

  // M75 DR (ADR-0047). Streams the leader's freshest Raft snapshot
  // (meta first, then state chunks) so `bigfleetctl snapshot save`
  // can capture a restorable backup from a running coordinator.
  // Leader-only — followers may not have a complete snapshot.
  rpc SnapshotSave(SnapshotSaveRequest) returns (stream SnapshotSaveChunk);
}

message JoinRaftClusterRequest {
  // The joiner's stable Raft server ID (its pod name in the chart).
  string node_id = 1;
  // The joiner's advertised Raft transport address, e.g.
  // bigfleet-coordinator-1.bigfleet-coordinator.<ns>.svc:7791.
  string raft_address = 2;
}
message JoinRaftClusterResponse {}

message SnapshotSaveRequest {}
message SnapshotSaveChunk {
  oneof payload {
    // First frame: the JSON-encoded hashicorp/raft SnapshotMeta
    // (index, term, configuration). Mirrors the meta.json the
    // leader's periodic snapshot-export loop writes, so saved
    // archives and exported directories restore identically.
    bytes meta_json = 1;
    // Subsequent frames: the FSM snapshot payload.
    bytes data = 2;
  }
}

message ListQuotasRequest {}
message ListQuotasResponse {
  repeated QuotaAllocation allocations = 1;
}

message QuotaAllocation {
  string provider = 1;
  string region   = 2;
  // per_shard maps shard_id → speculative-pool slice size.
  map<string, int32> per_shard = 3;
}

// Admin RPCs: AssignDomain pins a topology domain (rack / zone /
// region / etc.) to a specific shard. Idempotent — re-assigning a
// domain to its current shard is a no-op success; assigning to a
// *different* shard returns AlreadyExists with the current owner.
message AssignDomainRequest {
  string topology_key   = 1;
  string topology_value = 2;
  string shard_id       = 3;
}
message AssignDomainResponse {}

// UnassignDomain removes the domain from coordinator state. Idempotent
// — unassigning an already-absent domain is a no-op success.
message UnassignDomainRequest {
  string topology_key   = 1;
  string topology_value = 2;
}
message UnassignDomainResponse {}

// RemoveShard deletes the shard's registry entry and cascades cleanup
// of any cluster / domain assignments pointing at it. Returns NotFound
// if the shard isn't registered.
message RemoveShardRequest {
  string shard_id = 1;
}
message RemoveShardResponse {}

// ListShards returns the registered shard set, sorted by ID.
message ListShardsRequest {}
message ListShardsResponse {
  repeated ShardRegistryEntry shards = 1;
}
message ShardRegistryEntry {
  string shard_id              = 1;
  string address               = 2;
  int64  registered_at_unix_ns = 3;
  int64  last_heartbeat_unix_ns = 4;
}

// ListDomainAssignments returns the topology-domain → shard mapping.
message ListDomainAssignmentsRequest {}
message ListDomainAssignmentsResponse {
  repeated DomainAssignment assignments = 1;
}
message DomainAssignment {
  string topology_key   = 1;
  string topology_value = 2;
  string shard_id       = 3;
}

// ShardReport is what each shard sends every ~30s. Stateless: the
// coordinator builds its fleet picture from the latest report per shard.
message ShardReport {
  string shard_id = 1;

  // Monotonic counter for this shard's reports. Used by the coordinator
  // to discard out-of-order delivery.
  int64 cycle = 2;

  // Wall-clock time of report generation.
  int64 timestamp_unix_nanos = 3;

  // Shard's epoch. Increments on shard restart. Carried so coordinator
  // logs can correlate with shard-side fencing.
  int64 shard_epoch = 4;

  // Aggregate inventory and demand summaries. Bounded in size; not the
  // per-machine inventory.
  ShardSummary summary = 5;

  // Top-N unresolved needs, ranked by priority. Bounded to 100 per
  // §3.5 / shortfall protocol.
  repeated Shortfall shortfalls = 6;

  // Acknowledgements for instructions previously delivered to this
  // shard via ReportAck.instructions. Shards include the result for
  // each instruction they've finished acting on (or rejected). The
  // coordinator uses the acks to clear the pending-instruction queue
  // and to learn outcomes (term-rejected, semantically-invalid,
  // failed). Bounded by the shard's outstanding-instruction set.
  repeated InstructAck instruction_acks = 7;

  // Shard's gRPC dial address as it would be reachable from operators
  // and admin tools — typically `host:port`, e.g.
  // `bigfleet-shard-2.bigfleet-shard-headless.bigfleet-system.svc:7780`.
  // Carried on every ReportShard for forward-compat: if the coordinator
  // sees an unknown shard_id, it Raft-Applies AddShard with this
  // address and accepts subsequent reports as heartbeats. Optional for
  // compat with shards that don't know their advertise address; when
  // absent, the coordinator records an empty address (the registry
  // entry is still useful for membership / domain assignment).
  string shard_address = 8;
}

// ShardSummary is a coarse-grained snapshot of a shard's inventory and
// demand. Sized to fit alongside 200 other shard summaries in the
// coordinator's L1/L2-resident state.
message ShardSummary {
  // Total machines owned by the shard, in any state.
  int32 total_machines = 1;

  // Machines available for assignment (state == IDLE or SPECULATIVE).
  int32 free_machines = 2;

  // Per-instance-type counts for whichever instance types the shard
  // currently owns. Bounded by the shard's catalog (small).
  map<string, int32> per_instance_type_counts = 3;

  // Per-zone counts. Bounded by zones the shard touches.
  map<string, int32> per_zone_counts = 4;

  // Aggregate utilisation hints. Defined by the operator's reporting
  // policy; the coordinator does not interpret precise values.
  double utilisation_cpu_fraction    = 5;
  double utilisation_memory_fraction = 6;
}

// Shortfall describes a need the shard could not satisfy from its own
// inventory and could not resolve via in-shard preemption. The coordinator
// uses these to drive cross-shard rebalancing and preemption.
message Shortfall {
  // The unsatisfied profile's requirements.
  repeated NodeSelectorRequirement requirements = 1;

  // ADR-0027: the residual aggregate resource demand the shard could not
  // place — a resource vector, not a machine count.
  Resources deficit = 2;

  int32 priority = 3;
  reserved 4; // was `count`; removed by ADR-0027 (demand is the `deficit` vector)

  // Cycles this shortfall has been unresolved. >5 escalates to fleet
  // telemetry per the shortfall protocol.
  int32 age_cycles = 5;

  // Bucketed interruption penalty of the originating CapacityNeed.
  // Lets the coordinator price cross-shard preemption.
  PenaltyBucket interruption_penalty_bucket = 6;
}

message ReportAck {
  // The coordinator's current term as observed at report time. The shard
  // updates its high-water mark from this so subsequent CoordinatorInstruction
  // frames can be checked against a known-good term.
  int64 coordinator_term = 1;

  bool acknowledged = 2;

  // Pending instructions the coordinator wants this shard to execute.
  // The shard processes each, then includes a matching InstructAck on
  // its next ReportShard call. The coordinator may include the same
  // instruction across multiple ReportAcks until it sees an ack —
  // instruction_id is stable for deduplication.
  repeated CoordinatorInstruction instructions = 3;
}

// CoordinatorInstruction is the shard-bound action the coordinator wants
// taken. Each instruction is fenced by (term, sequence) — shards reject
// any instruction whose term is older than the highest observed.
message CoordinatorInstruction {
  // Fencing token. The shard rejects instructions whose term is less
  // than its high-water mark.
  int64 coordinator_term = 1;
  int64 sequence_number  = 2;

  // Stable id for the instruction; reused across retries by the
  // coordinator so shards can deduplicate.
  string instruction_id = 3;

  oneof payload {
    AssignDomain        assign_domain        = 4;
    UnassignDomain      unassign_domain      = 5;
    ReassignSpeculative reassign_speculative = 6;
    CrossShardDrain     cross_shard_drain    = 7;
    TransferOwnership   transfer_ownership   = 8;
  }
}

// AssignDomain hands a topology domain to this shard. Per plan §10.1 we
// assign at topology-domain granularity (rack, zone-slice), not machine.
message AssignDomain {
  string topology_key   = 1;
  string topology_value = 2;
}

// UnassignDomain releases a topology domain previously assigned. Used
// during shard splits / merges.
message UnassignDomain {
  string topology_key   = 1;
  string topology_value = 2;
}

// ReassignSpeculative moves quota slices between shards. Pure bookkeeping
// — no real machines exist yet.
message ReassignSpeculative {
  // The speculative machine ids being transferred. The receiving shard
  // takes ownership; the donating shard releases.
  repeated string machine_ids = 1;
}

// CrossShardDrain instructs a donor shard to drain configured machines so
// they can become idle and be transferred. The donor shard scores victims
// and emits ReclaimInstruction frames to the affected cluster operators.
message CrossShardDrain {
  repeated string machine_ids = 1;

  // Priority of the preemptor on the requesting shard. The donor uses
  // this to compute the appropriate drain grace period.
  int32 preemptor_priority = 2;
}

// TransferOwnership reassigns a now-idle machine from one shard to another.
// The receiving shard takes responsibility for the next Configure.
message TransferOwnership {
  repeated string machine_ids = 1;
  string from_shard_id        = 2;
  string to_shard_id          = 3;
}

message InstructAck {
  string instruction_id = 1;

  enum Outcome {
    OUTCOME_UNSPECIFIED      = 0;
    OUTCOME_ACCEPTED         = 1;
    OUTCOME_REJECTED_STALE   = 2;  // term older than shard's high-water mark
    OUTCOME_REJECTED_INVALID = 3;  // semantically not applicable
    OUTCOME_FAILED           = 4;
  }
  Outcome outcome = 2;

  // Populated when outcome != ACCEPTED.
  string reason = 3;
}
